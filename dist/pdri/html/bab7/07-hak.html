<style>/* Volume control for the player bar (volume.js); imported by engine.css. */
.volume { display: flex; align-items: center; flex: none; width: 44px; height: 44px; overflow: hidden;
  border: 1px solid var(--edge); border-radius: 999px; background: var(--panel); color: var(--chalk); transition: width .18s ease; }
.volume .icon { width: 42px; height: 42px; border: 0; background: transparent; }
.volume:hover, .volume:focus-within { width: 166px; gap: 10px; padding-right: 12px; }
.volume:hover { background: var(--hover, #2b3f36); border-color: var(--faint); }
.volume:has(:focus-visible) { outline: 2px solid var(--task); outline-offset: 3px; }
.volume .icon:focus-visible { outline: none; }
.volume input { appearance: none; flex: none; width: 0; height: 42px; margin: 0; opacity: 0; background: transparent; cursor: pointer; }
.volume:hover input, .volume:focus-within input { width: 100px; opacity: 1; }
.volume input:focus-visible { outline: none; }
.volume input::-webkit-slider-runnable-track { height: 4px; border-radius: 999px;
  background: linear-gradient(to right, var(--chalk) var(--volume, 100%), var(--faint) var(--volume, 100%)); }
.volume input::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; margin-top: -4px; border: 0; border-radius: 50%; background: var(--chalk); }
.volume input::-moz-range-track { height: 4px; border-radius: 999px; background: var(--faint); }
.volume input::-moz-range-progress { height: 4px; border-radius: 999px; background: var(--chalk); }
.volume input::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--chalk); }
@media (max-width: 700px) {
  .volume { width: 36px; height: 40px; }
  #bar .volume .icon { width: 34px; height: 38px; }
  .volume:hover, .volume:focus-within { width: 158px; }
  .volume input { height: 38px; }
}
@media (prefers-reduced-motion: reduce) { .volume { transition: none; } }

:root:root {
  --page: #E9EDF4; --board: #FBFAF6; --panel: #FFFFFF; --edge: #D6DEEA;
  --chalk: #0A2A5C; --dim: #4A5F80; --faint: #9AA9C2;
  --task: #F5B324; --quiz: #0055A5; --good: #22A55A; --bad: #D83C3C;
  --ui: "Poppins", "Segoe UI", Arial, sans-serif;
  --math-font: "Poppins", "Segoe UI", Arial, sans-serif;
  --on-fill: #fff; --vignette: rgba(10, 42, 92, 0); color-scheme: light;
  --rule: #E6EBF2; --track: #DCE3EE; --track-ask: #F7D98A;
  --bar-edge: #E1E7F0; --hover: #EEF2F8; --veil: #071E45;
}
:root #stage { background: #FBFAF6; }
:root #frame { box-shadow: 0 0 0 1px var(--edge), 0 30px 80px rgba(10, 42, 92, .2); }
:root .card { background: #fff; border: 2px solid #D6DEEA; border-inline-start: 7px solid var(--task); border-radius: 18px; box-shadow: 0 10px 26px rgba(10, 42, 92, .12); }
:root .card.screen { background: rgba(251, 250, 246, .97); border: 0; border-radius: 0; box-shadow: none; }
:root .btn.go { color: #fff; }
:root .opt[aria-pressed="true"] { color: #fff; }
:root #bar { background: #fff; border-top-color: #E1E7F0; }
:root .cover { background: rgba(7, 30, 69, .55); }
:root .cover-k { color: var(--task); font-weight: 700; }
:root .cover-t { color: #fff; }
:root .cover-t, :root .fin .prompt { font-family: var(--ui); font-weight: 700; letter-spacing: 0; }
:root body, :root button, :root input { font-family: var(--ui); }
/* the narration script as the design's subtitle pill: navy, gold edge, Poppins 600, one phrase at a time */
:root .caption { bottom: 86px; max-width: 1300px; padding: 9px 30px; border-radius: 19px; background: rgba(7, 30, 69, .88);
  border: 2px solid rgba(245, 179, 36, .6); color: #fff; font: 600 27px/1.35 var(--ui); box-shadow: 0 8px 22px rgba(7, 30, 69, .25); }
/* the closing card sits on the paper half of the closing slide */
:root .card.fin { left: 660px !important; width: 920px !important; background: transparent; }
:root .card.fin .prompt { font-size: 46px; }
:root .card.fin .prompt { color: #0A2A5C; }
/* a full-screen question uses the whole stage: the logo pill steps aside while it is open */
:root #chrome { transition: opacity .3s; }
:root body:has(#ui > .card.screen:not(.fin)) #chrome { opacity: 0; }
:root .card.fin .finwrap > :first-child:not(p) { display: none; }   /* no mascot: the medal on the left closes the chapter */
:root .card.fin .kicker { color: #C8901A; }
   /* this book's own settings and overrides (not shared), before the rules below */
/* The palette. lib/book.css may redefine any of it in its own ':root' (this one has no specificity), e.g. a light board
   with dark ink: the stage, COL in engine.js, the cards and the player bar all follow. Colours are #rrggbb. The last
   lines are shades between those colours, written out so the dark board stays exact: a palette of its own sets them too
   (the light set in book.css). */
:where(:root) {
  --page: #0f1613; --board: #1d2b27; --panel: #22322d; --edge: #3a5047;
  --chalk: #ece8dc; --dim: #9aaba3; --faint: #5d7068;
  --task: #f0b45a; --quiz: #86c9e8; --good: #8fd6b0; --bad: #f08c7a;
  --ui: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --vignette: rgba(0, 0, 0, .35);   /* the stage's darkened edges; a light board wants a faint, warm one */
  color-scheme: dark;
  --rule: #2e433b;                            /* lines between answer rows */
  --track: #2f4640; --track-ask: #2d4a57;     /* the player bar's steps, and its question steps */
  --bar-edge: #2a3b35; --hover: #2b3f36;      /* the bar's top line, the volume control under the pointer */
  --veil: #0a100e;                            /* behind the help panel and the captions */
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--page); }
body { color: var(--chalk); font: 26px/1.4 var(--ui); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--task); outline-offset: 3px; }
button[hidden] { display: none; }

/* One fixed 1600×960 frame (900 stage + 60 controls), scaled to fit the window. Fixed, not absolute: a frame wider
   than a phone would otherwise widen the phone's layout viewport, and fit() would scale to that wider width. */
#frame { position: fixed; left: 50%; top: 50%; width: var(--sw, 1600px); height: calc(var(--sh, 900px) + 60px); transform: translate(-50%, -50%) scale(var(--k, .5));
  border-radius: 20px; overflow: hidden; background: var(--board); box-shadow: 0 0 0 1px var(--edge), 0 30px 80px rgba(0, 0, 0, .45); }
#stage { position: absolute; left: 0; top: 0; width: var(--sw, 1600px); height: var(--sh, 900px); display: block;
  background: radial-gradient(75% 75% at 50% 45%, rgba(0,0,0,0) 60%, var(--vignette)), var(--grain, none), var(--board); }
#ui { position: absolute; left: 0; top: 0; width: var(--sw, 1600px); height: var(--sh, 900px); pointer-events: none; }
#ui > * { pointer-events: auto; }

.cover { position: absolute; left: 0; top: 0; width: var(--sw, 1600px); height: var(--sh, 900px); display: grid; place-items: center; background: color-mix(in srgb, var(--page) 50%, transparent); border: 0; }
.cover[hidden] { display: none; }
.cover > div { display: flex; flex-direction: column; align-items: center; }
.cover-k { margin: 0 0 10px; text-align: center; font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--quiz); }
.cover-t { margin: 0 0 44px; max-width: min(1200px, calc(var(--sw, 1600px) - 100px)); text-align: center; font: 500 64px/1.15 "Iowan Old Style", Palatino, Georgia, serif; color: var(--chalk); text-wrap: balance; }
.cover > div > * { animation: rise .7s cubic-bezier(.2, .8, .2, 1) backwards; }
.cover-t { animation-delay: .08s; }
.cover .go { animation-delay: .18s; }
.cover small { animation-delay: .26s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.cover .go { display: inline-flex; align-items: center; gap: 16px; padding: 20px 40px; border-radius: 999px; background: var(--chalk); color: var(--board); font-weight: 600; font-size: 32px; }
.cover small { display: block; margin-top: 22px; font-size: 22px; text-align: center; color: var(--dim); }
.paused-mark { position: absolute; left: 0; top: 0; width: var(--sw, 1600px); height: var(--sh, 900px); display: none; place-items: center; pointer-events: none; }
.paused .paused-mark { display: grid; }
.paused-mark div { padding: 14px 30px; border-radius: 999px; background: color-mix(in srgb, var(--page) 85%, transparent); color: var(--dim); font-size: 22px; }

/* Question cards inside the picture. */
.card { position: absolute; padding: 20px 26px; border-radius: 20px; background: color-mix(in srgb, var(--panel) 97%, transparent); border: 1.5px solid var(--edge); border-inline-start: 7px solid var(--quiz); box-shadow: 0 14px 44px rgba(0, 0, 0, .35); }
.card.band { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; grid-template-areas: "pic head body acts" "pic fb body acts"; column-gap: 28px; align-items: center; align-content: center; min-height: 150px; }
.band .mascot { grid-area: pic; }
.band .head { grid-area: head; align-self: end; }
.band .fb { grid-area: fb; align-self: start; }
.band .body { grid-area: body; }
.band .acts { grid-area: acts; }
.side .mascot { float: inline-end; margin-block: -2px 6px; margin-inline: 10px -4px; }
.kicker { margin: 0 0 4px; font-size: 20px; font-weight: 600; color: var(--quiz); }
.prompt { margin: 0; font-size: 28px; line-height: 1.35; }
.side .prompt { font-size: 24px; }
.body:empty { display: none; }
.side .body { margin-top: 14px; }
.opts { display: flex; gap: 12px; flex-wrap: wrap; }
.opt { padding: 8px 24px; border-radius: 999px; border: 2px solid var(--edge); background: transparent; color: var(--chalk); font-size: 24px; min-height: 58px; display: inline-flex; align-items: center; }
.opt:hover:not(:disabled) { border-color: var(--dim); }
.opt[aria-pressed="true"] { background: var(--c, var(--chalk)); border-color: var(--c, var(--chalk)); color: var(--on-fill, #1b2320); font-weight: 600; }
.opt.good { border-color: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 35%, transparent); }
.opt.bad { border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }
.fb { margin-top: 8px; font-size: 22px; line-height: 1.4; color: var(--chalk); }
.fb:empty { display: none; }
.fb.ok::before { content: "✓ "; color: var(--good); font-weight: 700; }
.fb.no::before { content: "✗ "; color: var(--bad); font-weight: 700; }
.fb ul { margin: 6px 0 0; padding-inline-start: 22px; }
.side .fb { max-height: 110px; overflow: auto; font-size: 20px; }
.acts { display: flex; gap: 12px; align-items: center; }
.side .acts { margin-top: 16px; }
.side .acts { flex-wrap: wrap; gap: 10px; }

.btn { padding: 10px 28px; border-radius: 999px; border: 0; background: var(--chalk); color: var(--board); font-weight: 600; font-size: 22px; white-space: nowrap; }

.grid .row { display: grid; grid-template-columns: 170px minmax(0, 1fr) 34px; gap: 16px; align-items: center; padding: 5px 0; padding-inline-start: 12px; border-bottom: 1px solid var(--rule); }

.grid.text .row { grid-template-columns: minmax(0, 1fr) auto 34px; }
.grid.text .num { justify-content: flex-start; }
.grid .opts { gap: 8px; }
.grid .opt { padding: 3px 16px; min-height: 42px; font-size: 20px; }
.grid .mark { font-weight: 700; text-align: center; }
.grid .mark.good { color: var(--good); }
.grid .mark.bad { color: var(--bad); }
.grid .why { grid-column: 1 / -1; font-size: 19px; color: var(--dim); padding-inline-start: 186px; }
.grid.text .why { padding-inline-start: 0; }
.grid .why:empty { display: none; }

.hit { cursor: pointer; }
.hit .ring { fill: transparent; stroke: var(--chalk); stroke-width: 2.5; stroke-opacity: 0; }
.hit:hover .ring, .hit:focus .ring { stroke-opacity: .7; }
.hit.bad .ring { stroke: var(--bad); stroke-opacity: 1; }
.hit.good .ring { stroke: var(--good); stroke-opacity: 1; stroke-width: 4; }
/* Listen and find (findWords): the word beside a tapped thing. A book can set --word-font for its early-reader letters. */
.findw rect:focus-visible { stroke: var(--chalk); stroke-width: 5; outline: none; }
#ui > .card.word { pointer-events: none; padding: 2px 36px 10px; border-inline-start-width: 1.5px; border-radius: 30px; font: 600 96px/1.15 var(--word-font, var(--ui)); white-space: nowrap; animation: word-in .3s cubic-bezier(.3, 1.5, .6, 1); }
@keyframes word-in { from { transform: scale(.6); opacity: 0; } }
.tok { cursor: grab; touch-action: none; }   /* a finger drags the chip instead of scrolling the page */

/* Controls strip, part of the frame. */
#bar { position: absolute; left: 0; top: var(--sh, 900px); width: var(--sw, 1600px); height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 20px; background: color-mix(in srgb, var(--page) 50%, var(--board)); border-top: 1px solid var(--bar-edge); }
.icon { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--edge); background: var(--panel); display: grid; place-items: center; flex: none; padding: 0; }
.icon svg { width: 18px; height: 18px; fill: var(--chalk); }
.icon .i-pause { display: none; }
.is-playing .icon .i-play { display: none; }
.is-playing .icon .i-pause { display: block; }
.segs { flex: 1; display: flex; gap: 4px; height: 30px; align-items: center; min-width: 0; margin: 0 8px; }
.seg { position: relative; display: block; min-width: 0; height: 8px; border-radius: 4px; background: var(--track); border: 0; padding: 0; overflow: hidden; }
.seg:hover { height: 12px; }
.seg i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--chalk); }
.seg.ask { background: var(--track-ask); }
.seg.ask i { background: var(--quiz); }
.step { width: 300px; flex: none; color: var(--dim); font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
/* Keep the control strip usable without scaling down its touch targets. */
@media (max-width: 700px) {
  #frame { top: calc(50% - 50px); overflow: visible; }
  #bar { width: calc(var(--sw, 1600px) * var(--k)); height: auto; flex-wrap: wrap; gap: 6px; padding: 8px;
    transform: scale(calc(1 / var(--k))); transform-origin: left top; border-radius: 0 0 12px 12px; }
  #bar .icon { width: 36px; height: 40px; }
  .step { display: none; }
  #bHelp { display: none; }   /* keyboard shortcuts; room for the speed button on a phone */
  #bar .icon.speed { width: 36px; min-width: 0; padding: 0; font-size: 12px; letter-spacing: -.3px; }
  .segs { order: 1; }
  .segs { min-width: 80px; margin: 0; }
  :root.full #bar { transform-origin: left bottom; border-radius: 0; }
}
/* Full screen: the stage fills the screen and the controls lie over its foot, out of sight until the pointer moves
   (engine.js wake(): .awake), while paused or ended (.held) and while the pointer is on them. */
:root.full #frame { top: 50%; height: var(--sh, 900px); border-radius: 0; box-shadow: none; }
:root.full #bar { top: auto; bottom: 0; transition: opacity .3s; border-top: 0;
  background: linear-gradient(transparent, color-mix(in srgb, var(--page) 85%, transparent)); }
:root.full #frame:not(.awake):not(.held) #bar:not(:hover):not(:focus-within) { opacity: 0; pointer-events: none; }
:root.full #frame:not(.awake):not(.held):not(:has(#bar:hover)) { cursor: none; }
/* A touch screen has no hover to bring the controls back, and a tap that answers a question would cover the card with
   them: there full screen keeps them, full size, under the stage (fit() leaves them room). */
@media (pointer: coarse) {
  :root.full #frame { top: calc(50% - 30px); overflow: visible; }
  :root.full #frame #bar { top: var(--sh, 900px); bottom: auto; width: calc(var(--sw, 1600px) * var(--k)); height: auto; flex-wrap: wrap;
    gap: 6px; padding: 8px; transform: scale(calc(1 / var(--k))); transform-origin: left top; background: none; opacity: 1 !important; pointer-events: auto !important; }
  :root.full #bar .icon { width: 40px; height: 40px; }
  :root.full .step, :root.full #bHelp { display: none; }
  :root.full .segs { order: 1; min-width: 80px; margin: 0; }
}
@media (pointer: coarse) and (max-width: 700px) { :root.full #frame { top: calc(50% - 55px); } }

.sound-note { position: absolute; inset-inline-start: 24px; top: 20px; margin: 0; padding: 8px 18px; border-radius: 12px; background: color-mix(in srgb, var(--page) 85%, transparent); color: var(--dim); font-size: 19px; }
.sound-note[hidden] { display: none; }
.blanks .brow { padding: 8px 0; border-bottom: 1px solid var(--rule); }
.blanks .brow:last-child { border-bottom: 0; }
.blanks .bline { line-height: 64px; white-space: nowrap; }
.blanks .mark { display: inline-block; margin-inline-start: 14px; font-weight: 700; }
.blanks .mark.good { color: var(--good); animation: pop .35s ease-out; }

.box { height: 52px; margin: 0 6px; padding: 0 6px; border: 0; border-bottom: 3px solid var(--quiz); border-radius: 8px 8px 0 0; background: color-mix(in srgb, var(--chalk) 7%, transparent); color: var(--chalk); font: 32px var(--math-font, "STIX Two Text", "Cambria Math", "Iowan Old Style", Palatino, Georgia, serif); text-align: center; vertical-align: -6px; }
.box:focus { outline: none; background: color-mix(in srgb, var(--quiz) 16%, transparent); }

.box.bad { border-color: var(--bad); }

kbd { display: inline-block; min-width: 1.5em; padding: 0 .4em; margin-inline-start: .5em; border: 1.5px solid currentColor; border-radius: 6px; font: 600 .7em/1.5 var(--ui); text-align: center; vertical-align: .12em; opacity: .6; }
.opt kbd { margin: 0; margin-inline-end: .6em; }
.keys { margin: 6px 0 0; font-size: 18px; color: var(--dim); }

.grid .row.cur { background: color-mix(in srgb, var(--chalk) 5%, transparent); box-shadow: inset 4px 0 var(--quiz); }
.help { position: absolute; left: 0; top: 0; width: var(--sw, 1600px); height: var(--sh, 900px); display: grid; place-items: center; background: color-mix(in srgb, var(--veil) 72%, transparent); }
.help[hidden] { display: none; }
.help-box:focus { outline: none; }   /* focused as the open dialog, not as a control */
.help-box { width: min(1120px, calc(var(--sw, 1600px) - 80px)); padding: 40px 50px; border-radius: 22px; background: var(--panel); border: 1.5px solid var(--edge); }
.help h2 { margin: 0 0 22px; font-size: 32px; font-weight: 600; }
.help h3 { margin: 0 0 12px; font-size: 20px; font-weight: 600; color: var(--quiz); }
.help-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; }
.help-cols:has(> [hidden]) { grid-template-columns: 1fr; }
.help dl { margin: 0; display: grid; grid-template-columns: 150px 1fr; row-gap: 10px; font-size: 22px; }
.help dt { text-align: end; padding-inline-end: 18px; white-space: nowrap; }
.help dt kbd { margin: 0; margin-inline-start: .3em; opacity: .9; }
.help dd { margin: 0; color: var(--dim); }
.help-close { margin: 26px 0 0; font-size: 18px; color: var(--dim); }
.icon.txt { font-size: 20px; font-weight: 700; color: var(--dim); }
/* Optional captions of the narration, one sentence at a time. Off by default: teaching text lives in the picture. */
.caption { position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%); width: max-content; max-width: min(1180px, calc(var(--sw, 1600px) - 80px)); padding: 10px 24px; border-radius: 14px; background: color-mix(in srgb, var(--veil) 82%, transparent); color: var(--chalk); font-size: 28px; line-height: 1.35; text-align: center; pointer-events: none; }
.caption[hidden] { display: none; }
.icon.cc { font-size: 15px; font-weight: 700; color: var(--dim); }
.icon.cc[aria-pressed="true"] { background: var(--chalk); border-color: var(--chalk); color: var(--board); }
.card.side { overflow: auto; }
svg.m { display: inline-block; overflow: visible; }
.card b { font-weight: 700; }   /* not 'bolder' (900 under a 600 prompt) */
.card { animation: card-in .45s cubic-bezier(.2, .9, .3, 1.15); }
.fb:not(:empty) { animation: fb-in .3s ease-out; }
.opt.bad, .grid .mark.bad { animation: shake .4s; }
.grid .mark.good { animation: pop .35s ease-out; }
@keyframes card-in { from { opacity: 0; transform: translateY(24px) scale(.98); } }
@keyframes fb-in { from { opacity: 0; transform: translateY(8px); } }
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.3); } }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
/* Full-screen chapter practice. */
.card.screen { height: 900px; padding: 50px 70px; border: 0; border-radius: 0; background: transparent; box-shadow: none; animation: screen-in .5s ease-out; max-height: none; overflow: visible; }
.screen .kicker { font-size: 22px; }
.screen .prompt { font-size: 40px; font-weight: 600; }
.screen .body { margin-top: 30px; }
.card.screen { display: flex; flex-direction: column; }
.screen .head { order: 1; } .screen .body { order: 2; }
.screen .fb { order: 3; max-width: min(1080px, calc(var(--sw, 1600px) - 140px)); margin: 26px 0 0; font-size: 24px; }   /* feedback right under the answers */
/* Practice screens: the bottom 130 px hold the buttons. Long answers scroll inside the body, so the feedback under
   them stays in view after a wrong answer adds a 'why' line to each row. */
.card.screen:not(.sort):not(.fin) { padding-bottom: 130px; }
.card.screen:not(.sort):not(.fin) > .head, .card.screen:not(.sort):not(.fin) > .fb { flex: none; }
.card.screen:not(.sort):not(.fin) > .body { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
.screen .acts { position: absolute; inset-inline-end: 70px; bottom: 48px; }
.screen .grid .row { grid-template-columns: 200px minmax(0, 1fr) 40px; padding: 9px 0; padding-inline-start: 12px; }
/* a long label (a system of equations) widens the label column for every row instead of running off the card's left */
.screen .grid:not(.text) { display: grid; grid-template-columns: minmax(200px, max-content) minmax(0, 1fr) 40px; }
.screen .grid:not(.text) > .row { grid-column: 1 / -1; grid-template-columns: subgrid; }
.screen .grid.text .row { grid-template-columns: minmax(0, 1fr) auto 40px; }
.screen .grid .opt { font-size: 22px; min-height: 50px; padding: 4px 20px; }
.screen .grid .why { padding-inline-start: 216px; font-size: 20px; }
.screen .grid.text .why { padding-inline-start: 0; }
#ui > .screen.sort { pointer-events: none; }
.screen.sort > * { pointer-events: auto; }
.screen.sort .head { position: absolute; right: 34px; top: 40px; width: 330px; }
.screen.sort .prompt { font-size: 28px; }
.screen.sort .fb { position: absolute; margin: 0; left: auto; right: 34px; bottom: 116px; width: 330px; max-height: 240px; overflow: auto; font-size: 20px; }
.screen.sort .acts { right: 34px; }
.fin .finwrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding-bottom: 60px; }
.fin .mascot { margin-bottom: 28px; }
.fin .fb, .fin .acts { position: static; }
.fin .fb { order: 0; margin: 0; }   /* result lines, not answer feedback: keep them above the buttons */
.fin .acts { margin-top: 30px; }
@keyframes screen-in { from { opacity: 0; } }

/* The guide: an infinity sign whose loops are its eyes. */
.mascot { display: block; flex: none; overflow: visible; }
.mascot .mbody { transform-box: view-box; transform-origin: 60px 46px; animation: bob 3.4s ease-in-out infinite; }
.mascot .eyes { transition: transform .3s; }
.mascot .pupil { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
.mascot .joy, .mascot .flat { display: none; }
.mascot.happy .pupil { display: none; }
.mascot.happy .joy { display: inline; }
.mascot.happy .mbody { animation: hop .55s ease-out 2, bob 3.4s ease-in-out 1.1s infinite; }
.mascot.oops .eyes { transform: translate(-3px, 4px); }
.mascot.oops .smile { display: none; }
.mascot.oops .flat { display: inline; }
.mascot.oops .mbody { animation: wobble .5s ease-in-out, bob 3.4s ease-in-out .5s infinite; }
@keyframes bob { 50% { transform: translateY(-3px) rotate(-2deg); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes hop { 40% { transform: translateY(-12px) rotate(4deg); } }
@keyframes wobble { 25% { transform: rotate(-8deg); } 75% { transform: rotate(6deg); } }
@media (prefers-reduced-motion: reduce) { .card, .fb, .opt, .grid .mark, .mascot * { animation: none !important; } }

a.icon { text-decoration: none; }

@view-transition { navigation: auto; }

.fin .kicker { font-size: 20px; letter-spacing: .14em; text-transform: uppercase; }

:root[data-stage="portrait"] .step { width: 120px; }   /* the 900-wide bar keeps room for the steps */
:root[data-stage="portrait"] .caption { font-size: 38px; bottom: 60px; }

   the right through the logical properties above (border-inline-start, inset-inline-end, …). The stage and the player bar
   keep their left-to-right geometry, so a drawing's coordinates, the timeline and the ← → keys mean the same in every

function progress(f) {

<script>/* Volume control for the player bar: a speaker button that opens a slider. engine.js loads this file and reads
   #volume when it starts each beat's audio, so the control is the same in every book. */
'use strict';
{
  document.getElementById('bHelp').insertAdjacentHTML('beforebegin', `<div class="volume">
    <button class="icon" id="bVolume" aria-label="${translate('volumeLabel')}" aria-controls="volume" title="${translate('volumeTitle')}">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9v6h4l5 4V5L7 9z" fill="currentColor"/>
        <path d="M16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="${translate('volumeSlider')}">
  </div>`);
  const input = document.getElementById('volume');
  document.getElementById('bVolume').onclick = () => input.focus();
  const apply = () => {
    input.style.setProperty('--volume', +input.value * 100 + '%');
    if (P.audio) P.audio.volume = +input.value;
  };
  // the volume carries over to the next chapter; a muted slider does not, so a new visit always has sound
  try { const v = +localStorage.getItem('papermorph:volume'); if (v) { input.value = v; apply(); } } catch {}
  input.oninput = () => { apply(); try { localStorage.setItem('papermorph:volume', input.value); } catch {} };
}
</script>

/* ---------- backgrounds ---------- */
// paper: warm white, a faint blue 40 px grid, a soft vignette
function bgPaper(p) {
  const g = G(p);
  mk('rect', { width: SW, height: SH, fill: MK.paper }, g);
  mk('rect', { width: SW, height: SH, fill: 'url(#mkGrid)' }, g);
  mk('rect', { width: SW, height: SH, fill: 'url(#mkVignette)' }, g);
  return g;
}
// navy aurora: the radial gradient, translucent triangles drifting, a dot grid, a few rising particles
function bgNavy(p, seed = 1, D = 30) {
  const g = G(p);
  mk('rect', { width: SW, height: SH, fill: 'url(#mkAurora)' }, g);
  let s = seed * 9301 + 49297;
  const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  const tris = [];
  for (let i = 0; i < 16; i++) {
    const r = 75 + rnd() * 270, x = rnd() * SW, y = rnd() * SH;
    const e = path(g, `M0 ${-r}L${r * .87} ${r / 2}L${-r * .87} ${r / 2}Z`, { fill: rnd() < .75 ? MK.sky : MK.blue, 'fill-opacity': .05 + rnd() * .09 });
    tris.push({ e, x, y, a: rnd() * 360, v: (rnd() - .5) * 4, dx: (rnd() - .5) * 18 });
  }
  mk('rect', { width: SW, height: SH, fill: 'url(#mkDots)' }, g);
  const dots = [];
  for (let i = 0; i < 24; i++) {
    const e = mk('circle', { r: 1.5 + rnd() * 2.5, fill: rnd() < .4 ? MK.gold : '#fff', 'fill-opacity': .35 + rnd() * .4 }, g);
    dots.push({ e, x: rnd() * SW, y: rnd() * SH, v: 8 + rnd() * 16 });
  }
  clockRun(t => {
    for (const r of tris) r.e.setAttribute('transform', `translate(${r.x + r.dx * Math.sin(t * .2)} ${r.y}) rotate(${r.a + r.v * t})`);
    for (const d of dots) { const y = ((d.y - d.v * t) % SH + SH) % SH; d.e.setAttribute('cx', d.x); d.e.setAttribute('cy', y); }
  }, D, { tail: true });
  return g;
}
/* the stage change: two skewed panels (gold, then navy) that cover the screen at the cut and slide off to the right */
function wipeIn(p) {
  const g = G(p);
  const band = (col, d) => {
    const e = path(g, `M-400 -100H2100L1800 1000H-700Z`, { fill: col });
    put(e, { x: 0 });
    tw(e, { x: 2300 }, d, .9, io);
    return e;
  };
  band(MK.gold, .12); band(MK.navy, 0);
  return g;
}

/* ---------- type ---------- */
/* actionTitle: the slide's conclusion, top left (design: left 110, top 72, Poppins Bold 64 -> 92, 60, 53), up to two
   lines split with '|', clear of the logo pill; a gold tag above names the stage. Lines rise in on the slide's clock. */
function actionTitle(p, str, { tag, t0 = .25, dark = false, size = 40 } = {}) {
  const g = G(p);
  if (tag) {
    const tg = wrap(pill(g, tag, 92, 52, { size: 19, bg: MK.gold, ink: MK.navy, anchor: 'start' }));
    put(tg, { o: 0, x: -14 }); tw(tg, { o: 1, x: 0 }, t0, .4, out);
  }
  const lines = str.split('|');
  lines.forEach((ln, i) => {
    const e = wrap(T(g, ln, { x: 92, y: 118 + i * size * 1.22, size, weight: 700, fill: dark ? '#fff' : MK.navy }));
    put(e, { y: 18, o: 0 }); tw(e, { o: 1, y: 0 }, t0 + .15 + i * .12, .55, out);
  });
  g.bottom = 118 + (lines.length - 1) * size * 1.22;
  return g;
}
// the exhibit's source line, bottom left above the subtitle band
function source(p, str, t0 = .6, dark = false) {
  const e = T(p, 'Sumber: ' + str, { x: 92, y: 752, size: 18, weight: 500, fill: dark ? '#9FB6D8' : MK.dim, o: 0 });
  show(e, t0, .5);
  return e;
}
// a pill (tag) with text; anchor start puts its left edge at x
function pill(p, str, x, y, { size = 22, bg = MK.gold, ink = MK.navy, anchor = 'middle', weight = 700, stroke } = {}) {
  const w = textW(str, size) * 1.05 + size * 1.3, h = size * 1.75;
  const g = G(p, { x: anchor === 'start' ? x + w / 2 : x, y });
  mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: bg, ...(stroke ? { stroke, 'stroke-width': 2.5 } : {}) }, g);
  T(g, str, { y: size * .36, size, weight, anchor: 'middle', fill: ink });
  g._w = w;
  return g;
}
// gold marker under a word or phrase, grown from the left (design: highlight on paper)
function marker(p, x, y, w, t0, size = 30) {
  const r = mk('rect', { x, y: y - size * .32, width: 0, height: size * .42, rx: 3, fill: MK.gold, 'fill-opacity': .6 }, p);
  p.insertBefore(r, p.firstChild);
  prog(q => r.setAttribute('width', w * q), t0, .5, out);
  return r;
}
// lines of text centred or left, one T per line ('|' splits)
function lines(p, str, x, y, { size = 24, lh = 1.3, weight = 500, fill = MK.navy, anchor = 'start' } = {}) {
  str.split('|').forEach((ln, i) => T(p, ln, { x, y: y + i * size * lh, size, weight, fill, anchor }));
}

/* ---------- cards ---------- */
// white card: on navy a deep shadow (radius 28 -> 23), on paper a hairline edge and a light shadow (radius 18 -> 15)
function mcard(p, x, y, w, h, { dark = false, fill = '#fff', r } = {}) {
  const g = G(p);
  if (dark) {
    mk('rect', { x: x + 2, y: y + 14, width: w - 4, height: h, rx: r ?? 23, fill: '#000', 'fill-opacity': .28 }, g);
    mk('rect', { x, y, width: w, height: h, rx: r ?? 23, fill }, g);
  } else {
    mk('rect', { x: x + 1, y: y + 8, width: w - 2, height: h, rx: r ?? 15, fill: MK.navy, 'fill-opacity': .07 }, g);
    mk('rect', { x, y, width: w, height: h, rx: r ?? 15, fill, stroke: MK.line, 'stroke-width': 2 }, g);
  }
  return g;
}

    build: choice([['Gugatan ke Pengadilan Pajak, 14 hari sejak pelaksanaan penagihan'], ['Keberatan ke Direktur Jenderal Pajak, 3 bulan'], ['Permohonan pembetulan ke DJP'], ['Keberatan ke Direktur Jenderal Bea dan Cukai']], 0,
      'Pelaksanaan penagihan yang dinilai menyalahi prosedur digugat ke Pengadilan Pajak, 14 hari sejak pelaksanaan.',
      [null, 'Keberatan ditujukan pada ketetapan, bukan pelaksanaan penagihan.', 'Pembetulan dipakai untuk kesalahan tulis atau hitung, bukan prosedur penagihan.', 'Surat Paksa diterbitkan DJP, bukan DJBC.']),
  }], done, 'Latihan bab') }],

  ['finish', 'Selesai', (m, D) => {
    const p = panel(0);
    paper(p);
    const left = G(p);
    path(left, 'M0 0H640L470 900H0Z', { fill: MK.navy });
    path(p, 'M640 0H700L530 900H470Z', { fill: MK.gold });
    path(p, 'M712 0H742L572 900H542Z', { fill: MK.sky });
    const md = G(p, { x: 300, y: 440 });
    const rays = G(md);
    for (let i = 0; i < 16; i++) path(rays, `M0 0L${-18} -260L18 -260Z`, { fill: MK.gold, 'fill-opacity': .12 }).setAttribute('transform', `rotate(${i * 22.5})`);
    clockRun(t => rays.setAttribute('transform', `rotate(${t * 8})`), D, { tail: true });
    tile(md, 'medal', 0, 0, { size: 190, v: 'gold' });
    popIn(md, .3);
    const orb = [['law', 'blue'], ['doc', 'sky'], ['office', 'gold']].map(([gl, v], i) => {
      const e = tile(p, gl, 0, 0, { size: 64, v, floor: false });
      return { e, a: i * 2.094 };
    });
    clockRun(t => orb.forEach(o => put(o.e, { x: 300 + 190 * Math.cos(o.a + t * .4), y: 440 + 190 * Math.sin(o.a + t * .4) * .55 })), D, { tail: true });
    orb.forEach(o => { put(o.e, { o: 0 }); show(o.e, .8, .5); });
    const h = T(p, 'Selamat, Sobat Pemelajar!', { x: 1120, y: 200, size: 44, weight: 700, fill: MK.navy, anchor: 'middle' });
    slideUp(h, .5);
  }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

{
  const NAVY = new Set(['intro', 'lensa', 'wrap']);
  BEATS.forEach((b, i) => {
    if (!i || b.lead === false) return;
    const prev = BEATS[i - 1];
    if (NAVY.has(b.id) !== NAVY.has(prev.id) || b.id === 'finish') {
      const run = b.run;
      b.run = (m, D) => { run(m, D); wipeIn(S.panel); };
    }
  });
}

{ let s = 6; while (s > 0 && BEATS[s].lead === false) s--; if (s < 6) { const pre = BEATS.slice(s, 6), r = BEATS[6].run; BEATS[6].run = (m, D) => { pre.forEach(b => b.run(() => -60, 0)); r(m, D); }; } }
BEATS.splice(0, BEATS.length, BEATS[6]);
mkBoot();
</script>
