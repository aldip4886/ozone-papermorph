:root { color-scheme: dark; --ink: #071A3A; --panel: #0B214A; --line: rgba(255,255,255,.12); --dim: #9FB3D6; --text: #EEF3FB; --gold: #F5B324; --bar: 58px; --side: 300px; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--text); font: 15px/1.45 Poppins, system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#app { position: fixed; inset: 0; display: grid; grid-template-rows: 1fr var(--bar); grid-template-columns: 0 1fr; transition: grid-template-columns .22s; }
#app.side { grid-template-columns: var(--side) 1fr; }

/* sidebar: every scene as a thumbnail */
#side { grid-row: 1 / 3; overflow: hidden; background: var(--panel); border-right: 1px solid var(--line); }
#side .in { width: var(--side); height: 100%; overflow: auto; padding: 18px 16px 28px; }
#side h2 { margin: 0 0 2px; font-size: 15px; }
#side .sub { color: var(--dim); font-size: 13px; margin-bottom: 16px; }
#list { display: grid; gap: 14px; }
#list button { display: grid; grid-template-columns: 22px 1fr; gap: 4px 8px; text-align: left; padding: 6px; border-radius: 10px; }
#list button:hover { background: rgba(255,255,255,.06); }
#list b { grid-row: 1 / 3; font-size: 13px; color: var(--dim); padding-top: 2px; text-align: right; }
#list .th { aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: #1A3D73; outline: 2px solid transparent; outline-offset: 2px; }
#list .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
#list span { font-size: 13px; line-height: 1.3; color: #DCE6F6; }
#list button.cur b { color: var(--gold); }
#list button.cur .th { outline-color: var(--gold); }
#list button.cur span { color: #fff; font-weight: 600; }

/* the slide */
#screen { position: relative; min-width: 0; min-height: 0; }
#slide { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--ink); transition: opacity .18s; }
#slide.out { opacity: 0; }

/* bottom bar */
#nav { grid-column: 2; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 0 14px; border-top: 1px solid var(--line); min-width: 0; }
.name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 22px; height: 22px; border-radius: 6px; background: #12366F; display: grid; place-items: center; flex: none; }
.mark i { width: 12px; height: 12px; border-radius: 3px; background: var(--gold); }
.name div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
.name div b { color: var(--gold); font-weight: 600; margin-right: 6px; }
.name div strong { color: var(--text); font-weight: 600; }
.mid { display: flex; align-items: center; gap: 6px; }
.right { display: flex; justify-content: flex-end; gap: 6px; }
.ib { height: 40px; min-width: 40px; padding: 0 10px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: var(--text); }
.ib:hover { background: rgba(255,255,255,.08); }
.ib[disabled] { opacity: .3; cursor: default; background: none; }
.ib.on { background: rgba(245,179,36,.16); color: var(--gold); }
.ib svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#count { min-width: 70px; text-align: center; font-variant-numeric: tabular-nums; color: var(--dim); }
#count b { color: var(--text); font-weight: 600; }

/* full screen: the controls lie over the slide's foot and fade out until the pointer moves */
:root.fs #app { grid-template-rows: 1fr 0; }
:root.fs #nav { position: fixed; left: 0; right: 0; bottom: 0; height: var(--bar); background: rgba(7,26,58,.9); transition: opacity .3s; z-index: 5; }
:root.fs #app.side #nav { left: var(--side); }
:root.fs:not(.awake) #nav:not(:hover) { opacity: 0; }

@media (max-width: 760px) {
  :root { --side: 240px; }
  .name div { display: none; }
}
</style>
</head>

const SHARED = {css: "/* Volume control for the player bar (volume.js); imported by engine.css. */\n.volume { display: flex; align-items: center; flex: none; width: 44px; height: 44px; overflow: hidden;\n  border: 1px solid var(--edge); border-radius: 999px; background: var(--panel); color: var(--chalk); transition: width .18s ease; }\n.volume .icon { width: 42px; height: 42px; border: 0; background: transparent; }\n.volume:hover, .volume:focus-within { width: 166px; gap: 10px; padding-right: 12px; }\n.volume:hover { background: var(--hover, #2b3f36); border-color: var(--faint); }\n.volume:has(:focus-visible) { outline: 2px solid var(--task); outline-offset: 3px; }\n.volume .icon:focus-visible { outline: none; }\n.volume input { appearance: none; flex: none; width: 0; height: 42px; margin: 0; opacity: 0; background: transparent; cursor: pointer; }\n.volume:hover input, .volume:focus-within input { width: 100px; opacity: 1; }\n.volume input:focus-visible { outline: none; }\n.volume input::-webkit-slider-runnable-track { height: 4px; border-radius: 999px;\n  background: linear-gradient(to right, var(--chalk) var(--volume, 100%), var(--faint) var(--volume, 100%)); }\n.volume input::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; margin-top: -4px; border: 0; border-radius: 50%; background: var(--chalk); }\n.volume input::-moz-range-track { height: 4px; border-radius: 999px; background: var(--faint); }\n.volume input::-moz-range-progress { height: 4px; border-radius: 999px; background: var(--chalk); }\n.volume input::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--chalk); }\n@media (max-width: 700px) {\n  .volume { width: 36px; height: 40px; }\n  #bar .volume .icon { width: 34px; height: 38px; }\n  .volume:hover, .volume:focus-within { width: 158px; }\n  .volume input { height: 38px; }\n}\n@media (prefers-reduced-motion: reduce) { .volume { transition: none; } }\n\n/* This book's own settings, imported by 700; letter-spacing: 0; }\n:root body, :root button, :root input { font-family: var(--ui); }\n/* the narration script as the design's subtitle pill: navy, gold edge, Poppins 600, one phrase at a time */\n:root .caption { bottom: 86px; max-width: 1300px; padding: 9px 30px; border-radius: 19px; background: rgba(7, 30, 69, .88);\n  border: 2px solid rgba(245, 179, 36, .6); color: #fff; font: 600 27px/1.35 var(--ui); box-shadow: 0 8px 22px rgba(7, 30, 69, .25); }\n/* the closing card sits on the paper half of the closing slide */\n:root .card.fin { left: 660px !important; width: 920px !important; background: transparent; }\n:root .card.fin .prompt { font-size: 46px; }\n:root .card.fin .prompt { color: #0A2A5C; }\n/* a full-screen question uses the whole stage: the logo pill steps aside while it is open */\n:root #chrome { transition: opacity .3s; }\n:root body:has(#ui > .card.screen:not(.fin)) #chrome { opacity: 0; }\n:root .card.fin .finwrap > :first-child:not(p) { display: none; }   /* no mascot: the medal on the left closes the chapter */\n:root .card.fin .kicker { color: #C8901A; }\n   /* this book's own settings and overrides (not shared), before the rules below */\n/* The palette. lib/book.css may redefine any of it in its own ':root' (this one has no specificity), e.g. a light board\n   with dark ink: the stage, COL in engine.js, the cards and the player bar all follow. Colours are #rrggbb. The last\n   lines are shades between those colours, written out so the dark board stays exact: a palette of its own sets them too\n   (the light set in book.css). */\n:where(:root) {\n  --page: #0f1613; --board: #1d2b27; --panel: #22322d; --edge: #3a5047;\n  --chalk: #ece8dc; --dim: #9aaba3; --faint: #5d7068;\n  --task: #f0b45a; --quiz: #86c9e8; --good: #8fd6b0; --bad: #f08c7a;\n  --ui: \"Avenir Next\", \"Segoe UI\", \"Helvetica Neue\", Arial, sans-serif;\n  --vignette: rgba(0, 0, 0, .35);   /* the stage's darkened edges; a light board wants a faint, warm one */\n  color-scheme: dark;\n  --rule: #2e433b;                            /* lines between answer rows */\n  --track: #2f4640; --track-ask: #2d4a57;     /* the player bar's steps, and its question steps */\n  --bar-edge: #2a3b35; --hover: #2b3f36;      /* the bar's top line, the volume control under the pointer */\n  --veil: #0a100e;                            /* behind the help panel and the captions */\n}\n* { box-sizing: border-box; }\nhtml, body { height: 100%; margin: 0; overflow: hidden; background: var(--page); }\nbody { color: var(--chalk); font: 26px/1.4 var(--ui); }\nbutton { font: inherit; color: inherit; cursor: pointer; }\nbutton:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--task); outline-offset: 3px; }\nbutton[hidden] { display: none; }\n\n/* One fixed 1600×960 frame (900 stage + 60 controls), scaled to fit the window. Fixed, not absolute: a frame wider\n   than a phone would otherwise widen the phone's layout viewport, and fit() would scale to that wider width. */\n#frame { position: fixed; left: 50%; top: 50%; width: var(--sw, 1600px); height: calc(var(--sh, 900px) + 60px); transform: translate(-50%, -50%) scale(var(--k, .5));\n  border-radius: 20px; overflow: hidden; background: var(--board); box-shadow: 0 0 0 1px var(--edge), 0 30px 80px rgba(0, 0, 0, .45); }\n#stage { position: absolute; left: 0; top: 0; width: var(--sw, 1600px); height: var(--sh, 900px); display: block;\n  background: radial-gradient(75% 75% at 50% 45%, rgba(0,0,0,0) 60%, var(--vignette)), var(--grain, none), var(--board); }\n#ui { position: absolute; left: 0; top: 0; width: var(--sw, 1600px); height: var(--sh, 900px); pointer-events: none; }\n#ui > * { pointer-events: auto; }\n\n.cover { position: absolute; left: 0; top: 0; width: var(--sw, 1600px); height: var(--sh, 900px); display: grid; place-items: center; background: color-mix(in srgb, var(--page) 50%, transparent); border: 0; }\n.cover[hidden] { display: none; }\n.cover > div { display: flex; flex-direction: column; align-items: center; }\n.cover-k { margin: 0 0 10px; text-align: center; font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--quiz); }\n.cover-t { margin: 0 0 44px; max-width: min(1200px, calc(var(--sw, 1600px) - 100px)); text-align: center; font: 500 64px/1.15 \"Iowan Old Style\", Palatino, Georgia, serif; color: var(--chalk); text-wrap: balance; }\n.cover > div > * { animation: rise .7s cubic-bezier(.2, .8, .2, 1) backwards; }\n.cover-t { animation-delay: .08s; }\n.cover .go { animation-delay: .18s; }\n.cover small { animation-delay: .26s; }\n@keyframes rise { from { opacity: 0; transform: translateY(14px); } }\n.cover .go { display: inline-flex; align-items: center; gap: 16px; padding: 20px 40px; border-radius: 999px; background: var(--chalk); color: var(--board); font-weight: 600; font-size: 32px; }\n.cover small { display: block; margin-top: 22px; font-size: 22px; text-align: center; color: var(--dim); }\n.paused-mark { position: absolute; left: 0; top: 0; width: var(--sw, 1600px); height: var(--sh, 900px); display: none; place-items: center; pointer-events: none; }\n.paused .paused-mark { display: grid; }\n.paused-mark div { padding: 14px 30px; border-radius: 999px; background: color-mix(in srgb, var(--page) 85%, transparent); color: var(--dim); font-size: 22px; }\n\n/* Question cards inside the picture. */\n.card { position: absolute; padding: 20px 26px; border-radius: 20px; background: color-mix(in srgb, var(--panel) 97%, transparent); border: 1.5px solid var(--edge); border-inline-start: 7px solid var(--quiz); box-shadow: 0 14px 44px rgba(0, 0, 0, .35); }\n.card.band { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; grid-template-areas: \"pic head body acts\" \"pic fb body acts\"; column-gap: 28px; align-items: center; align-content: center; min-height: 150px; }\n.band .mascot { grid-area: pic; }\n.band .head { grid-area: head; align-self: end; }\n.band .fb { grid-area: fb; align-self: start; g(Math.abs(v)).replace('.', DECIMAL_SIGN);\nfunction reset() {\n  scene.replaceChildren();\n  for (const k in S) delete S[k];\n  Object.assign(S, { dots: {}, tick: {}, rows: [], chips: [], samples: [], list: G(scene), line: G(scene), venn: G(scene) });\n}\nfunction tick(v) {\n  const g = G(S.line, { o: 0 });\n  path(g, `M${X(v)} ${Y0 - 11}V${Y0 + 11}`, { stroke: COL.dim, 'stroke-width': 2.5 });\n  T(g, num(v), { x: X(v), y: Y0 + 50, size: 30, fill: COL.dim, font: MATH, anchor: 'middle' });\n  return (S.tick[v] = g);\n}\nfunction dot(key, v, r = 9, name = v) {\n  const g = G(S.line, { x: X(v), y: Y0, s: 0, o: 0 });\n  mk('circle', { r, fill: COL[key], stroke: COL.board, 'stroke-width': 2 }, g);\n  return (S.dots[name] = g);\n}\nconst arrow = (x, dir) => `M${x - 15 * dir} ${Y0 - 10}L${x} ${Y0}L${x - 15 * dir} ${Y0 + 10}`;\nfunction panel(t0) {\n  if (t0 < .5) S.cleared = true;   // the old panel fades, or this is the first panel after the title\n  const old = S.panel;\n  if (old && t0 < .5) retire(old);\n  else if (old) {   // a panel change later in the beat stays on the beat clock\n    hide(old, t0, .4);\n    prog(q => { if (q === 1) old.style.display = 'none'; }, t0 + .4, 0, lin);\n  }\n  return (S.panel = G(scene));\n}\n// Take a beat's old picture away on wall time: a 150 ms fade, then out of rendering. On the beat clock the fade would\n// wait for the new clip's audio to start (a few hundred ms in Firefox) with the old, frozen scene still showing.\n// While seeking, the pictures passed on the way were never seen: they go at once.\n// It then leaves the page: a long film otherwise keeps every earlier beat's picture (a documentary's maps: megabytes).\nfunction retire(e) {\n  if (seeking) { e.remove(); return; }\n  e.style.transition = 'opacity .15s linear';\n  e.style.opacity = '0';\n  setTimeout(() => e.remove(), 160);\n}\nfunction header(p, str, t0, x = 1000, y = 170) {\n  const h = T(p, str, { x, y, size: 30, fill: COL.dim, weight: 600, o: 0 });\n  show(h, t0); nction reportAnswer(qid, entry, promptParts, latencySec) {\n  try { window.onInteraction?.(qid, entry, flatten(promptParts), latencySec); }\n  catch (e) { console.warn('[interactions]', e); }\n}\n\nfunction h(tag, cls, kids = []) {\n  const e = document.createElement(tag);\n  if (cls) e.className = cls;\n  for (const k of [].concat(kids)) e.append(k);\n  return e;\n}\n// Rich text: strings, DOM nodes, or $m(...) inline math.\nfunction rich(parts, size = 28) {\n  const s = document.createElement('span');\n  for (const p of [].concat(parts)) s.append(typeof p === 'string' || p instanceof Node ? p : mathEl(p.m, size));\n  return s;\n}\n// A card at pos; a band card keeps its bottom on the stage: when its content grows (a long question, feedback),\n// it moves up rather than running under the player bar.\nfunction card(pos, cls) {\n  const c = h('div', `card ${pos.cls} ${cls}`);\n  Object.assign(c.style, { left: pos.x + 'px', top: pos.y + 'px', width: pos.w + 'px' });\n  if (pos.maxH) c.style.maxHeight = pos.maxH + 'px';\n  $('ui').append(c);\n  if (pos.cls === 'band') {\n    const fit = () => { c.style.top = Math.max(16, Math.min(pos.y, SH - 16 - c.offsetHeight)) + 'px'; };\n    const ro = new ResizeObserver(fit);\n    ro.observe(c); fit();\n    P.cleanup.push(() => ro.disconnect());\n  }\n  return c;\n}\n// The guide: an infinity sign whose two loops are its eyes. Drawn in SVG so it can blink, hop and wobble.\nfunction lemniscate(cx, cy, a, k) {\n  let d = '';\n  for (let i = 0; i <= 96; i++) {\n    const t = i / 96 * 2 * Math.PI, sn = Math.sin(t), q = 1 + sn * sn;\n    d += (i ? 'L' : 'M') + (cx + a * Math.cos(t) / q).toFixed(1) + ' ' + (cy + k * a * sn * Math.cos(t) / q).toFixed(1);\n  }\n  return d + 'Z';\n}\nfunction mascotEl(size = 100) {\n  const svg = mk('svg', { class: 'mascot', viewBox: '0 0 120 84', width: size, height: size * .7, 'aria-hidden': 'true' });\n  const body = mk('g', { class: 'mbody' }, svg);\n  const line = { fill: 'none', stroke: COL.chalk, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };\n  mk('path', { d: lemniscate(60, 40, 52, 1.5), ...line, 'stroke-width': 6 }, body);\n  const eyes = mk('g', { class: 'eyes' }, body);\n  for (const x of [33, 87]) {\n    mk('circle', { class: 'pupil', cx: x, cy: 40, r: 6.5, fill: COL.chalk }, eyes);\n    mk('path', { class: 'joy', d: `M${x - 7} 43Q${x} 32 ${x + 7} 43`, ...line, 'stroke-width': 4 }, body);\n  }\n  mk('path', { class: 'smile', d: 'M55 62Q60 67 65 62', ...line, 'stroke-width': 3.5 }, body);\n  mk('path', { class: 'flat', d: 'M55 64H65', ...line, 'stroke-width': 3.5 }, body);\n  return svg;\n}\nfunction mood(el, m) {\n  el.classList.remove('happy', 'oops');\n  void el.getBoundingClientRect();  // restart the CSS animation\n  if (m) el.classList.add(m);\n}\n// A sequence of questions in one card. Each question: { id, prompt, build(body, api) -> { check?, reveal, lock? } }.\nfunction quiz(pos, qs, done, label = translate('quickCheck')) {\n  const c = card(pos, 'quiz');\n  let k = 0;\n  const show = () => {\n    const q = qs[k];\n    let first = true, resolved = false;\n    const askedAt = performance.now();\n    const fb = h('div', 'fb'), body = h('div', 'body'), acts = h('div', 'acts');\n    fb.setAttribute('role', 'status');   // screen readers announce right or wrong\n    const bCheck = h('button', 'btn', [translate('check'), kbd('Enter')]), bShow = h('button', 'btn quiet', [translate('showAnswer'), kbd('S')]);\n    const bNext = h('button', 'btn go', [k < qs.length - 1 ? translate('nextQuestion') : translate('continue'), kbd('Enter')]);\n    bShow.hidden = bNext.hidden = true;\n    const guide = pos.cls === 'band' || pos.cls === 'side' ? mascotEl(pos.cls === 'band' ? 108 : 70) : null;\n    const say = (cls, parts) => { fb.className = 'fb ' + cls; fb.replaceChildren(rich(parts, 24)); fb.style.animation = 'none'; void fb.offsetWidth; fb.style.animation = ''; };\n    const resolve = () => {\n      resolved = true;\n      bCheck.hidden = bShow.hidden KB 5.4)\nconst NI = 1528230000, PPH_API = NI * .025, PPH_NON = NI * .075;   // 38.205.750 and 114.617.250\nconst NI2 = 764115000, PPH2 = NI2 * .025;                           // 19.102.875\nconst pct = v => String(v).replace('.', ',') + '%';\n\n/* ---------- beats ---------- */\nconst BEATS = [\n  ['intro', 'PPh Pasal 22 Impor', (m, D) => {\n    const p = panel(0);\n    navy(p, 51, D);\n    const ring = G(p, { x: 1130, y: 470 });\n    mk('circle', { r: 250, fill: 'none', stroke: MK.sky, 'stroke-width': 3, 'stroke-opacity': .6, 'stroke-dasharray': '6 10' }, ring);\n    path(ring, 'M-270 0A270 270 0 0 1 0 -270', { stroke: MK.gold, 'stroke-width': 14, 'stroke-linecap': 'round', fill: 'none' });\n    path(ring, 'M270 0A270 270 0 0 1 0 270', { stroke: MK.gold, 'stroke-width': 14, 'stroke-linecap': 'round', fill: 'none' });\n    clockRun(t => ring.setAttribute('transform', `translate(1130 470) rotate(${t * 6})`), D, { tail: true });\n    const mid = G(p, { x: 1130, y: 470 });\n    mk('circle', { r: 150, fill: '#fff' }, mid);\n    tile(mid, 'wallet', 0, -18, { size: 150, v: 'gold' });\n    T(mid, 'PPh 22', { y: 92, size: 30, weight: 800, fill: MK.navy, anchor: 'middle' });\n    popIn(mid, .3);\n    [['user', 'gold', 'Importir'], ['doc', 'blue', 'PIB'], ['shield', 'sky', 'DJBC'], ['office', 'gold', 'Bank devisa'], ['coins', 'blue', 'Kas negara'], ['calc', 'sky', 'SPT Tahunan']].forEach(([gl, v, n], k) => {\n      const a = -Math.PI / 2 + k * Math.PI / 3, x = 1130 + 250 * Math.cos(a), y = 470 + 250 * Math.sin(a);\n      const g = G(p);\n      tile(g, gl, x, y, { size: 84, v, floor: false });\n      pill(g, n, x, y + 60, { size: 16, bg: '#fff', ink: MK.navy });\n      popIn(g, m('sub') + .3 + k * .22);\n    });\n    const part = pill(p, 'BAGIAN II · MENGHITUNG, MEMERIKSA, MENJELASKAN', 92, 240, { size: 16, anchor: 'start', bg: MK.navy2, ink: '#D5E2F5' });\n    slideUp(part, m('sub'));\n    const tg = pill(p, 'BAB 5 · KEGIATAN BELAJAR 5', 92, 290, { size: 20, anchor: 'start' });\n    slideUp(tg, .5);\n    const t1 = T(p, 'PPh Pasal 22', { x: 92, y: 392, size: 70, weight: 700, fill: '#fff' });\n    const t2 = T(p, 'Impor', { x: 92, y: 474, size: 70, weight: 700, fill: MK.gold });\n    slideUp(t1, .7); slideUp(t2, .85);\n    const rule = mk('rect', { x: 92, y: 512, width: 0, height: 6, rx: 3, fill: MK.gold }, p);\n    prog(q => rule.setAttribute('width', 120 * q), 1.2, .5, out);\n    const sub = G(p);\n    lines(sub, 'Cicilan PPh yang dibayar|di pelabuhan', 92, 572, { size: 30, weight: 500, fill: '#D5E2F5' });\n    slideUp(sub, 1.3);\n  }],\n\n  ['ask', 'PPh sebelum kain terjual', (m, D) => {\n    const p = panel(0);\n    paper(p);\n    actionTitle(p, 'PPh Pasal 22 Impor bukan pajak tambahan,|melainkan cicilan PPh di muka', { tag: 'PERTANYAAN KASUS 4' });\n    const q = G(p);\n    mcard(q, 92, 230, 620, 470);\n    tile(q, 'chat', 175, 310, { size: 96, v: 'gold' });\n    T(q, 'STAF PT KAIN PRIMA NUSANTARA', { x: 245, y: 300, size: 16, weight: 700, fill: MK.dim });\n    lines(q, '“Kain kami belum terjual.|Mengapa PPh sudah|dipungut di pelabuhan?”', 132, 420, { size: 30, weight: 700, lh: 1.3 });\n    slideUp(q, .4);\n    const k = G(p);\n    tile(k, 'fabric', 175, 625, { size: 72, v: 'sky', floor: false });\n    T(k, 'Kain kapas masih di gudang', { x: 230, y: 633, size: 21, weight: 600, fill: MK.dim });\n    slideUp(k, m('ask') + 2);\n    const a = G(p);\n    mcard(a, 760, 230, 748, 470, { fill: MK.navy });\n    T(a, 'Jawaban singkatnya', { x: 810, y: 310, size: 22, weight: 600, fill: '#D5E2F5' });\n    T(a, 'Cicilan di muka', { x: 810, y: 395, size: 60, weight: 800, fill: MK.gold });\n    lines(a, 'atas PPh perusahaan tahun ini,|bukan pajak tambahan', 810, 470, { size: 28, weight: 600, fill: '#fff' });\n    tile(a, 'wallet', 1420, 620, { size: 96, v: 'gold' });\n    show(a, m('ans') - .2, .4);\n    source(p, 'Bahan Ajar PDRI, Kasus yang Dipakai dan KB 5', m('ans') + 1);\n  }],\n\n  ['lunas', 'Pelunasan PPh dalam tahun berjalan', (m, D) => {\n    const p = panel(0);\n    paper(p);\n    actionTitle(p, 'PPh dapat dicicil dalam tahun berjalan;|PPh Pasal 22 adalah salah satu caranya', { tag: 'PELUNASAN PPH DALAM TAHUN BERJALAN' });\n    [['p21', '21', 'users', 'sky', 'Pemotongan', 'oleh pemberi kerja|atas gaji pegawai'],\n     ['p22', '22', 'ship', 'gold', 'Pemungutan', 'oleh pihak tertentu,|termasuk atas impor'],\n     ['p23', '23', 'coins', 'blue', 'Pemotongan', 'atas dividen, bunga,|royalti, sewa, dan|jasa tertentu'],\n     ['p25', '25', 'calc', 'sky', 'Angsuran', 'bulanan oleh wajib|pajak sendiri']].forEach(([mark, n, gl, v, how, desc], i) => {\n      const x = 92 + i * 360, c = G(p), hot = n === '22';\n      mcard(c, x, 235, 336, 390, { fill: hot ? '#FFF7E3' : '#fff' });\n      if (hot) mk('rect', { x, y: 235, width: 336, height: 390, rx: 15, fill: 'none', stroke: MK.gold, 'stroke-width': 3 }, c);\n      tile(c, gl, x + 70, 310, { size: 80, v });\n      T(c, 'PPh Pasal', { x: x + 150, y: 300, size: 18, weight: 600, fill: MK.dim });\n      T(c, n, { x: x + 150, y: 350, size: 54, weight: 800, fill: hot ? MK.goldDark : MK.navy });\n      pill(c, how, x + 36, 412, { size: 17, anchor: 'start', bg: hot ? MK.gold : '#EEF2F8', ink: MK.navy });\n      lines(c, desc, x + 36, 470, { size: 20, weight: 600, lh: 1.3 });\n      slideUp(c, m(mark) - .2, .5);\n    });\n    // pemotongan + pemungutan = withholding (pasal 21, 22, 23)\n    const t0 = m('wh'), w = G(p);\n    path(w, 'M104 645V662H1152V645', { stroke: MK.navy, 'stroke-width': 3, fill: 'none' });\n    pill(w, 'Pemotongan dan pemungutan: withholding', 628, 690, { size: 18, bg: MK.navy, ink: '#fff' });\n    show(w, t0 - .1, .4);\n    source(p, 'Bahan Ajar PDRI KB 5.1', m('p21'));\n  }],\n\n  ['ketentuan', 'Ketentuan PPh Pasal 22 Impor', (m, D) => {\n    const p = panel(0);\n    navy(p, 53, D);\n    actionTitle(p, 'PPh Pasal 22 Impor dipungut bersama Bea|Masuk dan tidak bersifat final', { tag: 'KETENTUAN · PMK 51 TAHUN 2025', dark: true });\n    [['k1', 'shield <script>
'use strict';
const $ = id => document.getElementById(id);
const escH = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const S = { i: -1, win: null, t: 0 };

function docFor(i) {
  const sc = SHARED.script.replace('/*@CHAPTER@*/', () => CHAPTERS[i]).replace('/*@PICK@*/', () => PICKS[i]);
  return '<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'
    + `<style>${SHARED.css}</style></head><body><script>${SHARED.eng}<\/script><script>${SHARED.vol}<\/script><script>${SHARED.mck}<\/script>`
    + `<script>${SHARED.tim}<\/script><script>\n${sc}<\/script><script>${SHARED.deck}<\/script></body></html>`;
}

document.title = `Bab ${DECK.n} · ${DECK.title} · Presentasi`;
$('sideSub').textContent = `Bab ${DECK.n} · ${DECK.title} · ${DECK.count} adegan`;
const list = $('list');
SLIDES.forEach((s, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<b>${i + 1}</b><div class="th">${s.thumb ? `<img src="${s.thumb}" alt="" loading="lazy">` : ''}</div><span>${escH(s.title)}</span>`;
  b.onclick = () => go(i - S.i);
  list.append(b);
});

/* ---------- slides ---------- */
const frame = $('slide');
function show(i) {
  S.i = i;
  const s = SLIDES[i], n = SLIDES.length;
  $('count').innerHTML = `<b>${i + 1}</b> / ${n}`;
  $('where').innerHTML = `<b>BAB ${DECK.n}</b><strong>${escH(s.title)}</strong>`;
  $('where').title = `Bab ${DECK.n} · ${DECK.title} · Adegan ${i + 1}: ${s.title}`;
  $('bPrev').disabled = i === 0; $('bNext').disabled = i === n - 1;
  [...list.children].forEach((b, k) => b.classList.toggle('cur', k === i));
  list.children[i].scrollIntoView({ block: 'nearest' });
  history.replaceState(null, '', '#' + (i + 1));
  frame.classList.add('out');
  clearTimeout(S.t);
  S.t = setTimeout(() => { S.win = null; frame.srcdoc = docFor(i); }, 160);
}
function go(d) {
  const i = Math.max(0, Math.min(SLIDES.length - 1, S.i + d));
  if (i !== S.i) show(i);
}
const focusSlide = () => { try { frame.focus(); S.win?.focus(); } catch {} };
window.deck = {   // called from inside each slide
  ready(win) { S.win = win; requestAnimationFrame(() => frame.classList.remove('out')); focusSlide(); },
  go,
  key,
};

/* ---------- sidebar, full screen, keys ---------- */
function toggleSide(on = !$('app').classList.contains('side')) { $('app').classList.toggle('side', on); $('bSide').classList.toggle('on', on); if (on) list.children[S.i]?.scrollIntoView({ block: 'nearest' }); setTimeout(focusSlide, 250); }
function toggleFull() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {}); }
document.addEventListener('fullscreenchange', () => { document.documentElement.classList.toggle('fs', !!document.fullscreenElement); wake(); focusSlide(); });
let sleepT;
function wake() { const r = document.documentElement; r.classList.add('awake'); clearTimeout(sleepT); sleepT = setTimeout(() => r.classList.remove('awake'), 2500); }
addEventListener('pointermove', wake);
frame.addEventListener('load', () => { try { frame.contentWindow.addEventListener('pointermove', wake); } catch {} });

function key(k) {
  if (k === 'escape') { if ($('app').classList.contains('side')) toggleSide(false); }
  else if (k === 'g') toggleSide();
  else if (k === 'f') toggleFull();
}
addEventListener('keydown', e => {
  if (e.altKey || e.metaKey || e.ctrlKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); go(1); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(-1); }
  else if (/^[gGfF]$/.test(k) || k === 'Escape') { e.preventDefault(); key(k.toLowerCase()); }
});
$('bPrev').onclick = () => go(-1);
$('bNext').onclick = () => go(1);
$('bSide').onclick = () => toggleSide();
$('bFull').onclick = toggleFull;
$('screen').addEventListener('pointerdown', focusSlide);

/* #N opens scene N */
const h0 = parseInt(location.hash.slice(1), 10);
show(h0 >= 1 && h0 <= SLIDES.length ? h0 - 1 : 0);
