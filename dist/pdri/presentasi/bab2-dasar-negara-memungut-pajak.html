:root { color-scheme: dark; --ink: #071A3A; --panel: #0B214A; --line: rgba(255,255,255,.12); --dim: #9FB3D6; --text: #EEF3FB; --gold: #F5B324; --bar: 58px; --side: 300px; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--text); font: 15px/1.45 Poppins, system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#app { position: fixed; inset: 0; display: grid; grid-template-rows: 1fr var(--bar); grid-template-columns: 0 1fr; transition: grid-template-columns .22s; }
#app.side { grid-template-columns: var(--side) 1fr; }

/* sidebar: every scene as a thumbnail */
#side { grid-row: 1 / 3; overflow: hidden; background: var(--panel); border-right: 1px solid var(--line); }
#side .in { width: var(--side); height: 100%; overflow: auto; padding: 18px 16px 28px; }
#side h2 { margin: 0 0 2px; font-size: 15px; }
#side .sub { color: var(--dim); font-size: 13px; margin-bottom: 16px; }
#list { display: grid; gap: 14px; }
#list button { display: grid; grid-template-columns: 22px 1fr; gap: 4px 8px; text-align: left; padding: 6px; border-radius: 10px; }
#list button:hover { background: rgba(255,255,255,.06); }
#list b { grid-row: 1 / 3; font-size: 13px; color: var(--dim); padding-top: 2px; text-align: right; }
#list .th { aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: #1A3D73; outline: 2px solid transparent; outline-offset: 2px; }
#list .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
#list span { font-size: 13px; line-height: 1.3; color: #DCE6F6; }
#list button.cur b { color: var(--gold); }
#list button.cur .th { outline-color: var(--gold); }
#list button.cur span { color: #fff; font-weight: 600; }

/* the slide */
#screen { position: relative; min-width: 0; min-height: 0; }
#slide { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--ink); transition: opacity .18s; }
#slide.out { opacity: 0; }

/* bottom bar */
#nav { grid-column: 2; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 0 14px; border-top: 1px solid var(--line); min-width: 0; }
.name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 22px; height: 22px; border-radius: 6px; background: #12366F; display: grid; place-items: center; flex: none; }
.mark i { width: 12px; height: 12px; border-radius: 3px; background: var(--gold); }
.name div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
.name div b { color: var(--gold); font-weight: 600; margin-right: 6px; }
.name div strong { color: var(--text); font-weight: 600; }
.mid { display: flex; align-items: center; gap: 6px; }
.right { display: flex; justify-content: flex-end; gap: 6px; }
.ib { height: 40px; min-width: 40px; padding: 0 10px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: var(--text); }
.ib:hover { background: rgba(255,255,255,.08); }
.ib[disabled] { opacity: .3; cursor: default; background: none; }
.ib.on { background: rgba(245,179,36,.16); color: var(--gold); }
.ib svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#count { min-width: 70px; text-align: center; font-variant-numeric: tabular-nums; color: var(--dim); }
#count b { color: var(--text); font-weight: 600; }

/* full screen: the controls lie over the slide's foot and fade out until the pointer moves */
:root.fs #app { grid-template-rows: 1fr 0; }
:root.fs #nav { position: fixed; left: 0; right: 0; bottom: 0; height: var(--bar); background: rgba(7,26,58,.9); transition: opacity .3s; z-index: 5; }
:root.fs #app.side #nav { left: var(--side); }
:root.fs:not(.awake) #nav:not(:hover) { opacity: 0; }

@media (max-width: 760px) {
  :root { --side: 240px; }
  .name div { display: none; }
}
</style>
</head>

const SHARED = {css: "/* Volume control for the player bar (volume.js); imported by engine.css. */\n.volume { display: flex; align-items: center; flex: none; width: 44px; height: 44px; overflow: hidden;\n  border: 1px solid var(--edge); border-radius: 999px; background: var(--panel); color: var(--chalk); transition: width .18s ease; }\n.volume .icon { width: 42px; height: 42px; border: 0; background: transparent; }\n.volume:hover, .volume:focus-within { width: 166px; gap: 10px; padding-right: 12px; }\n.volume:hover { background: var(--hover, #2b3f36); border-color: var(--faint); }\n.volume:has(:focus-visible) { outline: 2px solid var(--task); outline-offset: 3px; }\n.volume .icon:focus-visible { outline: none; }\n.volume input { appearance: none; flex: none; width: 0; height: 42px; margin: 0; opacity: 0; background: transparent; cursor: pointer; }\n.volume:hover input, .volume:focus-within input { width: 100px; opacity: 1; }\n.volume input:focus-visible { outline: none; }\n.volume input::-webkit-slider-runnable-track { height: 4px; border-radius: 999px;\n  background: linear-gradient(to right, var(--chalk) var(--volume, 100%), var(--faint) var(--volume, 100%)); }\n.volume input::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; margin-top: -4px; border: 0; border-radius: 50%; background: var(--chalk); }\n.volume input::-moz-range-track { height: 4px; border-radius: 999px; background: var(--faint); }\n.volume input::-moz-range-progress { height: 4px; border-radius: 999px; background: var(--chalk); }\n.volume input::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--chalk); }\n@media (max-width: 700px) {\n  .volume { width: 36px; height: 40px; }\n  #bar .volume .icon { width: 34px; height: 38px; }\n  .volume:hover, .volume:focus-within { width: 158px; }\n  .volume input { height: 38px; }\n}\n@media (prefers-reduced-motion: reduce) { .volume { transition: none; } }\n\n/* This book's own settings, imported by me: dark;\n  --rule: #2e433b;                            /* lines between answer rows */\n  --track: #2f4640; --track-ask: #2d4a57;     /* the player bar's steps, and its question steps */\n  --bar-edge: #2a3b35; --hover: #2b3f36;      /* the bar's top line, the volume control under the pointer */\n  --veil: #0a100e;                            /* behind the help panel and the captions */\n}\n* { box-sizing: border-box; }\nhtml, body { height: 100%; margin: 0; overflow: hidden; background: var(--page); }\nbody { color: var(--chalk); font: 26px/1.4 var(--ui); }\nbutton { font: inherit; color: inherit; cursor: pointer; }\nbutton:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--task); outline-offset: 3px; }\nbutton[hidden] { display: none; }\n\n/* One fixed 1600×960 frame (900 stage + 60 controls), scaled to fit the window. Fixed, not absolute: a frame wider\n   than a phone would otherwise widen the phone's layout viewport, and fit() would scale to that wider width. */\n#frame { position: fixed; left: 50%; top: 50%; width: var(--sw, 1600px); height: calc(var(--sh, 900px) + 60px); transform: translate(-50%, -50%) scale(var(--k, .5));\n  border-radius: 20px; overflow: hidden; background: var(--board); box-shadow: 0 0 0 1px var(--edge), 0 30px 80px rgba(0, 0, 0, .45); }\n#stage { position: absolute; left: 0; top: 0; width: var(--sw, 1600px); height: var(--sh, 900px); display: block;\n  background: radial-gradient(75% 75% at 50% 45%, rgba(0,0,0,0) 60%, var(--vignette)), var(--grain, none), var(--board); }\n#ui { position: absolute; left: 0; top: 0; width: var(--sw, 1600px); height: var(--sh, 900px); pointer-events: none; }\n#ui > * { pointer-events: auto; }\n\n.cover { position: absolute; left: 0; top: 0; width: var(--sw, 1600px); height: var(--sh, 900px); display: grid; place-items: center; background: color-mix(in srgb, var(--page) 50%, transparent); border: 0; }\n.cover[hidden] { display: none; }\n.cover > div { display: flex; flex-direction: column; align-items: center; }\n.cover-k { margin: 0 0 10px; text-align: center; font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--quiz); }\n.cover-t { margin: 0 0 44px; max-width: min(1200px, calc(var(--sw, 1600px) - 100px)); text-align: center; font: 500 64px/1.15 \"Iowan Old Style\", Palatino, Georgia, serif; color: var(--chalk); text-wrap: balance; }\n.cover > div > * { animation: rise .7s cubic-bezier(.2, .8, .2, 1) backwards; }\n.cover-t { animation-delay: .08s; }\n.cover .go { animation-delay: .18s; }\n.cover small { animation-delay: .26s; }\n@keyframes rise { from { opacity: 0; transform: translateY(14px); } }\n.cover .go { display: inline-flex; align-items: center; gap: 16px; padding: 20px 40px; border-radius: 999px; background: var(--chalk); color: var(--board); font-weight: 600; font-size: 32px; }\n.cover small { display: block; margin-top: 22px; font-size: 22px; text-align: center; color: var(--dim); }\n.paused-mark { position: absolute; left: 0; top: 0; width: var(--sw, 1600px); height: var(--sh, 900px); display: none; place-items: center; pointer-events: none; }\n.paused .paused-mark { display: grid; }\n.paused-mark div { padding: 14px 30px; border-radius: 999px; background: color-mix(in srgb, var(--page) 85%, transparent); color: var(--dim); font-size: 22px; }\n\n/* Question cards inside the picture. */\n.card { position: absolute; padding: 20px 26px; border-radius: 20px; background: color-mix(in srgb, var(--panel) 97%, transparent); border: 1.5px solid var(--edge); border-inline-start: 7px solid var(--quiz); box-shadow: 0 14px 44px rgba(0, 0, 0, .35); }\n.card.band { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; grid-template-areas: \"pic head body acts\" \"pic fb body acts\"; column-gap: 28px; align-items: center; align-content: center; min-height: 150px; }\n.band .mascot { grid-area: pic; }\n.band .head { grid-area: head; align-self: end; }\n.band .fb { grid-area: fb; align-self: start; }\n.band .body { grid-area: body; }\n.band .acts { grid-area: acts; }\n.side .mascot { float: inline-end; margin-block: -2px 6px; margin-inline: 10px -4px; }\n.kicker { margin: 0 0 4px; font-size: 20px; font-weight: 600; color: var(--quiz); }\n.prompt { margin: 0; font-size: 28px; line-height: 1.35; }\n.side .prompt { font-size: 24px; }\n.body:empty { display: none; }\n.side .body { margin-top: 14px; }\n.opts { display: flex; gap: 12px; flex-wrap: wrap; }\n.opt { padding: 8px 24px; border-radius: 999px; border: 2px solid var(--edge); background: transparent; color: var(--chalk); font-size: 24px; min-height: 58px; display: inline-flex; align-items: center; }\n.opt:hover:not(:disabled) { border-color: var(--dim); }\n.opt[aria-pressed=\"true\"] { background: var(--c, var(--chalk)); border-color: var(--c, var(--chalk)); color: var(--on-fill, #1b2320); font-weight: 600; }\n.opt.good { border-color: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 35%, transparent); }\n.opt.bad { border-color: var(--bad); color: var(--bad); }\n.opt:disabled { cursor: default; }\n.fb { margin-top: 8px; font-size: 22px; line-height: 1.4; color: var(--chalk); }\n.fb:empty { display: none; }\n.fb.ok::before { content: \"✓ \"; color: var(--good); font-weight: 700; }\n.fb.no::before { content: \"✗ \"; color: var(--bad); font-weight: 700; }\n.fb ul { margin: 6px 0 0; padding-inline-start: 22px; }\n.side .fb { max-height: 110px; overflow: auto; font-size: 20px; }\n.acts { display: flex; gap: 12px; align-items: center; }\n.side .acts { margin-top: 16px; }\n.side .acts { flex-wrap: wrap; gap: 10px; }\n.side .btn { padding: 8px 16px; font-size: 20px; }\n.card.side { padding: 18px 22px; }\n.btn { padding: 10px 28px; border-radius: 999px; border: 0; background: var(--chalk); color: var(--board); font-weight: 600; font-size: 22px; white-space: nowrap; }\n.btn.quiet { background: transparent; color: var(--dim); border: 1.5px solid var(--edge); }\n.btn.go { background: var(--quiz); color: var(--on-fill, #10242e); }   /* --on-fill: text on a coloured fill */\n.btn:disabled { background: var(--edge); color: var(--dim); cursor: default; }\n\n.grid .row { display: grid; grid-template-columns: 170px minmax(0, 1fr) 34px; gap: 16px; align-items: center; padding: 5px 0; padding-inline-start: 12px; border-bottom: 1px solid var(--rule); }\n.grid .num { display: flex; justify-content: flex-end; align-items: center; font-size: 26px; }\n.grid.text .row { grid-template-columns: minmax(0, 1fr) auto 34px; }\n.grid.text .num { justify-content: flex-start; }\n.grid .opts { gap: 8px; }\n.grid .opt { padding: 3px 16px; min-height: 42px; font-size: 20px; }\n.grid .mark { font-weight: 700; text-align: center; }\n.grid .mark.good { color: var(--good); }\n.grid .mark.bad { color: var(--bad); }\n.grid .why { grid-column: 1 / -1; font-size: 19px; color: var(--dim); padding-inline-start: 186px; }\n.grid.text .why { padding-inline-start: 0; }\n.grid .why:empty { display: none; }\n\n.hit { cursor: pointer; }\n.hit .ring { fill: transparent; stroke: var(--chalk); stroke-width: 2.5; stroke-opacity: 0; }\n.hit:hover .ring, .hit:focus .ring { stroke-opacity: .7; }\n.hit.bad .ring { stroke: var(--bad); stroke-opacity: 1; }\n.hit.good .ring { stroke: var(--good); stroke-opacity: 1; stroke-width: 4; }\n/* Listen and find (findWords): the word beside a tapped thing. A book can set --word-font for its early-reader letters. */\n.findw rect:focus-visible { stroke: var(--chalk); stroke-width: 5; outline: none; }\n#ui > .card.word { pointer-events: none; padding: 2px 36px 10px; border-inline-start-width: 1.5px; border-radius: 30px; font: 600 96px/1.15 var(--word-font, var(--ui)); white-space: nowrap; animation: word-in .3s cubic-bezier(.3, 1.5, .6, 1); }\n@keyframes word-in { from { transform: scale(.6); opacity: 0; } }\n.tok { cursor: grab; touch-action: none; }   /* a finger drags the chip instead of scrolling the page */\n\n/* Controls strip, part of the frame. */\n#bar { position: absolute; left: 0; top: var(--sh, 900px); width: var(--sw, 1600px); height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 20px; background: color-mix(in srgb, var(--page) 50%, var(--board)); border-top: 1px solid var(--bar-edge); }\n.icon { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--edge); background: var(--panel); display: grid; place-items: center; flex: none; padding: 0; }\n.icon svg { width: 18px; height: 18px; fill: var(--chalk); }\n.icon .i-pause { display: none; }\n.is-playing .icon .i-play { display: none; }\n.is-playing .icon .i-pause { display: block; }\n.segs { flex: 1; display: flex; gap: 4px; height: 30px; align-items: center; min-width: 0; margin: 0 8px; }\n.seg { position: relative; display: block; min-width: 0; height: 8px; border-radius: 4px; background: var(--track); border: 0; padding: 0; overflow: hidden; }\n.seg:hover { height: 12px; }\n.seg i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--chalk); }\n.seg.ask { background: var(--track-ask); }\n.seg.ask i { background: var(--quiz); }\n.step { width: 300px; flex: none; color: var(--dim); font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }\n/* Keep the control strip usable without scaling down its touch targets. */\n@media (max-width: 700px) {\n  #frame { top: calc(50% - 50px); overflow: visible; }\n  #bar { width: calc(var(--sw, 1600px) * var(--k)); height: auto; flex-wrap: wrap; gap: 6px; padding: 8px;\n    transform: scale(calc(1 / var(--k))); transform-origin: left top; border-radius: 0 0 12px 12px; }\n  #bar .icon { width: 36px; height: 40px; }\n  .step { display: none; }\n  #bHelp { display: none; }   /* keyboard shortcuts; room for the speed button on a phone */\n  #bar .icon.speed { width: 36px; min-width: 0; padding: 0; font-size: 12px; letter-spacing: -.3px; }\n  .segs { order: 1; }\n  .segs { min-width: 80px; margin: 0; }\n  :root.full #bar { transform-origin: left bottom; border-radius: 0; }\n}\n/* Full screen: the stage fills the screen and the controls lie over its foot, out of sight until the pointer moves\n   (engine.js wake(): .awake), while paused or ended (.held) and while the pointer is on them. */\n:root.full #frame { top: 50%; height: var(--sh, 900px); border-radius: 0; box-shadow: none; }\n:root.full #bar { top: auto; bottom: 0; transition: opacity .3s; border-top: 0;\n  background: linear-gradient(transparent, color-mix(in srgb, var(--page) 85%, transparent)); }\n:root.full #frame:not(.awake):not(.held) #bar:not(:hover):not(:focus-within) { opacity: 0; pointer-events: none; }\n:root.full #frame:not(.awake):not(.held):not(:has(#bar:hover)) { cursor: none; }\n/* A touch screen has no hover to bring the controls back, and a tap that answers a question would cover the card with\n   them: there full screen keeps them, full size, under the stage (fit() leaves them room). */\n@media (pointer: coarse) {\n  :root.full #frame { top: calc(50% - 30px); overflow: visible; }\n  :root.full #frame #bar { top: var(--sh, 900px); bottom: auto; width: calc(var(--sw, 1600px) * var(--k)); height: auto; flex-wrap: wrap;\n    gap: 6px; padding: 8px; transform: scale(calc(1 / var(--k))); transform-origin: left top; background: none; opacity: 1 !important; pointer-events: auto !important; }\n  :root.full #bar .icon { width: 40px; height: 40px; }\n  :root.full .step, :root.full #bHelp { display: none; }\n  :root.full .segs { order: 1; min-width: 80px; margin: 0; }\n}\n@media (pointer: coarse) and (max-width: 700px) { :root.full #frame { top: calc(50% - 55px); } }\n\n.sound-note { position: absolute; inset-inline-start: 24px; top: 20px; margin: 0; padding: 8px 18px; border-radius: 12px; background: color-mix(in srgb, var(--page) 85%, transparent); color: var(--dim); font-size: 19px; }\n.sound-note[hidden] { display: none; }\n.blanks .brow { padding: 8px 0; border-bottom: 1px solid var(--rule); }\n.blanks .brow:last-child { border-bottom: 0; } <script>
'use strict';
const $ = id => document.getElementById(id);
const escH = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const S = { i: -1, win: null, t: 0 };

function docFor(i) {
  const sc = SHARED.script.replace('/*@CHAPTER@*/', () => CHAPTERS[i]).replace('/*@PICK@*/', () => PICKS[i]);
  return '<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'
    + `<style>${SHARED.css}</style></head><body><script>${SHARED.eng}<\/script><script>${SHARED.vol}<\/script><script>${SHARED.mck}<\/script>`
    + `<script>${SHARED.tim}<\/script><script>\n${sc}<\/script><script>${SHARED.deck}<\/script></body></html>`;
}

document.title = `Bab ${DECK.n} · ${DECK.title} · Presentasi`;
$('sideSub').textContent = `Bab ${DECK.n} · ${DECK.title} · ${DECK.count} adegan`;
const list = $('list');
SLIDES.forEach((s, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<b>${i + 1}</b><div class="th">${s.thumb ? `<img src="${s.thumb}" alt="" loading="lazy">` : ''}</div><span>${escH(s.title)}</span>`;
  b.onclick = () => go(i - S.i);
  list.append(b);
});

/* ---------- slides ---------- */
const frame = $('slide');
function show(i) {
  S.i = i;
  const s = SLIDES[i], n = SLIDES.length;
  $('count').innerHTML = `<b>${i + 1}</b> / ${n}`;
  $('where').innerHTML = `<b>BAB ${DECK.n}</b><strong>${escH(s.title)}</strong>`;
  $('where').title = `Bab ${DECK.n} · ${DECK.title} · Adegan ${i + 1}: ${s.title}`;
  $('bPrev').disabled = i === 0; $('bNext').disabled = i === n - 1;
  [...list.children].forEach((b, k) => b.classList.toggle('cur', k === i));
  list.children[i].scrollIntoView({ block: 'nearest' });
  history.replaceState(null, '', '#' + (i + 1));
  frame.classList.add('out');
  clearTimeout(S.t);
  S.t = setTimeout(() => { S.win = null; frame.srcdoc = docFor(i); }, 160);
}
function go(d) {
  const i = Math.max(0, Math.min(SLIDES.length - 1, S.i + d));
  if (i !== S.i) show(i);
}
const focusSlide = () => { try { frame.focus(); S.win?.focus(); } catch {} };
window.deck = {   // called from inside each slide
  ready(win) { S.win = win; requestAnimationFrame(() => frame.classList.remove('out')); focusSlide(); },
  go,
  key,
};

/* ---------- sidebar, full screen, keys ---------- */
function toggleSide(on = !$('app').classList.contains('side')) { $('app').classList.toggle('side', on); $('bSide').classList.toggle('on', on); if (on) list.children[S.i]?.scrollIntoView({ block: 'nearest' }); setTimeout(focusSlide, 250); }
function toggleFull() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {}); }
document.addEventListener('fullscreenchange', () => { document.documentElement.classList.toggle('fs', !!document.fullscreenElement); wake(); focusSlide(); });
let sleepT;
function wake() { const r = document.documentElement; r.classList.add('awake'); clearTimeout(sleepT); sleepT = setTimeout(() => r.classList.remove('awake'), 2500); }
addEventListener('pointermove', wake);
frame.addEventListener('load', () => { try { frame.contentWindow.addEventListener('pointermove', wake); } catch {} });

function key(k) {
  if (k === 'escape') { if ($('app').classList.contains('side')) toggleSide(false); }
  else if (k === 'g') toggleSide();
  else if (k === 'f') toggleFull();
}
addEventListener('keydown', e => {
  if (e.altKey || e.metaKey || e.ctrlKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); go(1); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(-1); }
  else if (/^[gGfF]$/.test(k) || k === 'Escape') { e.preventDefault(); key(k.toLowerCase()); }
});
$('bPrev').onclick = () => go(-1);
$('bNext').onclick = () => go(1);
$('bSide').onclick = () => toggleSide();
$('bFull').onclick = toggleFull;
$('screen').addEventListener('pointerdown', focusSlide);

/* #N opens scene N */
const h0 = parseInt(location.hash.slice(1), 10);
show(h0 >= 1 && h0 <= SLIDES.length ? h0 - 1 : 0);
</script>
