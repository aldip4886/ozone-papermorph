<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memahami dan Menghitung PDRI · Versi 3 · Slide Materi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2A5C;--navy-deep:#071E45;--navy2:#0E3A78;--blue:#0055A5;--sky:#3A9BE1;
  --gold:#F5B324;--gold-dark:#C8901A;--gold-light:#FFE29A;--paper:#FBFAF6;--line:#D6DEEA;
  --red:#D83C3C;--green:#22A55A;--bg:#EEF3FA;--side:320px;
  --ease:cubic-bezier(.2,.8,.2,1);--pop:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--navy);background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{display:block}
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100dvh;transition:grid-template-columns .45s var(--ease)}
.app.collapsed{grid-template-columns:0 minmax(0,1fr)}

/* ---------- sidebar ---------- */
.side{background:#fff;border-right:2px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;z-index:30}
.side-in{width:var(--side);display:flex;flex-direction:column;height:100%}
.side-head{padding:18px 18px 12px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;position:relative;overflow:hidden}
.side-head:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;background:var(--gold);opacity:.9;transform:rotate(45deg);border-radius:18px}
.side-head small{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.side-head h2{font-size:16px;line-height:1.3;margin-top:4px;max-width:230px;position:relative;z-index:1}
.search{margin:12px 14px 6px;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border-radius:12px;border:2px solid var(--line);font:500 13px 'Poppins',sans-serif;color:var(--navy);background:var(--paper);outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--sky)}
.search svg{position:absolute;left:11px;top:11px;width:18px;height:18px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round}
.outline{flex:1;overflow-y:auto;padding:6px 10px 12px;scrollbar-width:thin}
.grp{margin:2px 0}
.grp>button{width:100%;display:flex;align-items:center;gap:8px;text-align:left;padding:9px 10px;border-radius:12px;font-weight:700;font-size:13px;line-height:1.25;transition:background .2s}
.grp>button:hover{background:var(--bg)}
.grp>button .ch{margin-left:auto;transition:transform .3s var(--ease);flex:none}
.grp.open>button .ch{transform:rotate(90deg)}
.grp .dot{width:10px;height:10px;border-radius:3px;background:var(--gold);flex:none;box-shadow:0 2px 0 var(--gold-dark)}
.grp.lvl .dot{background:var(--blue);box-shadow:0 2px 0 #003A73}
.items{display:none;padding:2px 0 6px 14px;border-left:2px solid var(--line);margin-left:15px}
.grp.open .items{display:block;animation:fadeIn .3s var(--ease)}
.it{display:flex;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:10px;font-size:12.5px;line-height:1.35;font-weight:500;color:#33507e;transition:background .2s,color .2s}
.it:hover{background:var(--bg)}
.it .no{flex:none;min-width:22px;font-weight:700;color:var(--blue)}
.it.on{background:var(--navy);color:#fff}
.it.on .no{color:var(--gold)}
.it .ty{margin-left:auto;flex:none;font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:6px;height:fit-content;background:var(--gold-light);color:var(--navy)}
.it.on .ty{background:var(--gold)}
.side-foot{padding:12px 14px 14px;border-top:2px solid var(--line);display:grid;gap:8px;background:var(--paper)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:14px;font-weight:600;font-size:13px;transition:transform .2s var(--pop),box-shadow .2s,background .2s}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.gold{background:var(--gold);color:var(--navy);box-shadow:0 5px 0 var(--gold-dark)}
.btn.gold:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--gold-dark)}
.btn.gold:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-dark)}
.btn.ghost{background:#fff;border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--sky);transform:translateY(-1px)}
.btn.navy{background:var(--navy);color:#fff;box-shadow:0 5px 0 var(--navy-deep)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- main ---------- */
.main{position:relative;display:flex;flex-direction:column;min-width:0;height:100dvh;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;flex:none;z-index:5}
.ib{width:42px;height:42px;border-radius:14px;background:#fff;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .2s var(--pop),border-color .2s}
.ib:hover{border-color:var(--sky);transform:translateY(-1px)}
.ib svg{width:20px;height:20px;stroke:var(--navy);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.crumb{min-width:0;flex:1}
.crumb small{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.crumb b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;padding:8px 14px;border-radius:99px;background:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(10,42,92,.25);border:2px solid rgba(245,179,36,.6)}
.pill i{font-style:normal;color:var(--gold)}
.stage{position:relative;flex:1;min-height:0;margin:0 14px;border-radius:28px;overflow:hidden;background:var(--paper);border:2px solid var(--line);box-shadow:0 18px 44px rgba(10,42,92,.12);
  background-image:linear-gradient(rgba(0,85,165,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(0,85,165,.06) 2px,transparent 2px);background-size:48px 48px}
.stage:before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 90px rgba(10,42,92,.08);pointer-events:none;z-index:2}
.slide{position:absolute;inset:0;overflow:hidden}
.slide.out{animation:outL .38s var(--ease) forwards;pointer-events:none}
.slide.out.rev{animation-name:outR}
@keyframes outL{to{opacity:0;transform:translateX(-5%) scale(.985)}}
@keyframes outR{to{opacity:0;transform:translateX(5%) scale(.985)}}
.wipe{position:absolute;inset:0;z-index:10;pointer-events:none;overflow:hidden}
.wipe i{position:absolute;top:-10%;bottom:-10%;width:70%;left:-150%;transform:skewX(-18deg)}
.wipe .w1{background:var(--gold)}.wipe .w2{background:var(--navy)}
.wipe.go .w1{animation:wipe 1.3s cubic-bezier(.65,0,.35,1)}
.wipe.go .w2{animation:wipe 1.3s cubic-bezier(.65,0,.35,1) .14s}
.wipe.go.rev .w1,.wipe.go.rev .w2{animation-name:wipeR}
@keyframes wipe{from{left:-150%}to{left:150%}}
@keyframes wipeR{from{left:150%}to{left:-150%}}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px 14px;flex:none}
.prog{flex:1;height:10px;border-radius:99px;background:#dbe5f3;position:relative;overflow:hidden;cursor:pointer}
.prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--blue),var(--sky) 60%,var(--gold));border-radius:99px;transition:width .6s var(--ease)}
.count{font-weight:700;font-size:13px;min-width:70px;text-align:center}
.count span{color:var(--blue)}
.nav{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;flex:none;transition:transform .2s var(--pop),box-shadow .2s,opacity .2s}
.nav svg{width:22px;height:22px;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav.prev{background:#fff;border:2px solid var(--line)}.nav.prev svg{stroke:var(--navy)}
.nav.next{background:var(--gold);box-shadow:0 5px 0 var(--gold-dark)}.nav.next svg{stroke:var(--navy)}
.nav:hover{transform:translateY(-2px)}.nav.next:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-dark)}
.nav[disabled]{opacity:.35;pointer-events:none}

/* ---------- notes ---------- */
.notes{position:absolute;left:14px;right:14px;bottom:0;z-index:20;background:var(--navy);color:#fff;border-radius:22px 22px 0 0;padding:16px 22px 22px;transform:translateY(105%);transition:transform .45s var(--ease);box-shadow:0 -12px 40px rgba(10,42,92,.35);max-height:46%;overflow:auto}
.notes.on{transform:none}
.notes small{color:var(--gold);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px}
.notes p{margin-top:6px;font-size:14.5px;line-height:1.6}
.notes .x{position:absolute;right:12px;top:10px;width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.notes .x svg{width:16px;height:16px;stroke:#fff;stroke-width:2.5;fill:none}

/* ---------- slide parts ---------- */

.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;box-shadow:0 3px 0 var(--gold-dark)}
.tag.blue{background:var(--blue);color:#fff;box-shadow:0 3px 0 #003A73}
h1.t{font-size:clamp(22px,3.1vw,42px);line-height:1.22;font-weight:700;margin-top:14px;max-width:1100px;letter-spacing:-.01em}
mark{background:linear-gradient(transparent 52%,rgba(245,179,36,.62) 52% 92%,transparent 92%);background-size:0 100%;background-repeat:no-repeat;color:inherit;padding:0 2px;animation:hl 1.2s var(--ease) forwards;animation-delay:calc(var(--base,0s) + 1s)}
@keyframes hl{to{background-size:100% 100%}}
.body{display:grid;gap:clamp(14px,2vw,26px);margin-top:clamp(18px,2.6vw,34px);grid-template-columns:minmax(0,1fr)}
.body.has-aside{grid-template-columns:minmax(0,1fr) minmax(220px,300px)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:clamp(12px,1.6vw,20px)}
.card{display:flex;gap:14px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:0 10px 26px rgba(10,42,92,.10);transition:transform .3s var(--pop),border-color .2s,box-shadow .3s}
.card:hover{border-color:var(--sky);box-shadow:0 18px 34px rgba(10,42,92,.16)}
.card b{display:block;font-size:15px;line-height:1.3;margin-bottom:3px}
.card p{font-size:clamp(13px,1.15vw,15.5px);line-height:1.55;color:#27406d}
.card .tile{width:clamp(56px,5vw,74px);height:clamp(56px,5vw,74px);flex:none}
.tile{filter:drop-shadow(0 4px 6px rgba(10,42,92,.15));animation:pop 1.1s var(--pop) backwards;animation-delay:calc(var(--base,0s) + var(--d,0) * 140ms + .2s)}
@keyframes pop{from{opacity:0;transform:scale(.5) rotate(-8deg)}}
.stat{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;border-radius:24px;padding:22px;position:relative;overflow:hidden;align-self:start;box-shadow:0 16px 36px rgba(10,42,92,.3)}
.stat:after{content:"";position:absolute;right:-26px;bottom:-26px;width:96px;height:96px;border-radius:22px;background:var(--gold);transform:rotate(30deg);opacity:.95}
.stat small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sky);font-weight:700}
.stat .n{font-size:clamp(28px,3.4vw,44px);font-weight:700;color:var(--gold);line-height:1.1;margin:8px 0 6px;word-break:break-word}
.stat p{font-size:13px;color:#cfe0f5;position:relative;z-index:1;max-width:80%}
.src{margin-top:22px;font-size:12px;color:#5b7197;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.src b{color:var(--navy)}
.vis{margin-top:14px;font-size:12px;color:#6b7fa3;font-style:italic}

/* jenis: peralihan */
.per{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px;align-items:center;min-height:100%}
.per .big{font-size:clamp(90px,16vw,220px);line-height:.9;font-weight:700;color:var(--navy);letter-spacing:-.04em;position:relative;display:inline-block}
.per .big:after{content:"";position:absolute;left:0;right:0;bottom:6%;height:16%;background:var(--gold);z-index:-1;border-radius:6px;transform-origin:left;animation:grow .8s var(--ease) .6s both}
@keyframes grow{from{transform:scaleX(0)}}
.per h1{font-size:clamp(24px,min(4vw,7vh),56px);line-height:1.12;font-weight:700;margin:10px 0 18px}
.chips{display:grid;gap:10px}
.chip{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-size:clamp(13px,1.2vw,16px);line-height:1.45;box-shadow:0 8px 20px rgba(10,42,92,.08)}
.chip i{flex:none;width:28px;height:28px;border-radius:9px;background:var(--navy);color:var(--gold);font:700 13px 'Poppins';display:grid;place-items:center;font-style:normal}
.per .art{position:relative;display:grid;place-items:center}
.art svg.iso{width:100%;max-width:520px;height:auto;overflow:visible}
.disc{position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#dcebfa 60%,#c3dcf5);border:10px solid #fff;box-shadow:0 20px 50px rgba(10,42,92,.2)}
.ring{position:absolute;width:92%;aspect-ratio:1;border-radius:50%;border:4px solid var(--sky);opacity:.55}
.arc{position:absolute;width:98%;aspect-ratio:1;border-radius:50%;border:8px solid transparent;border-top-color:var(--gold);border-left-color:var(--gold);transform:rotate(-20deg);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(340deg)}}
.art .tile{position:absolute;right:4%;bottom:2%;width:clamp(84px,11vw,140px);height:clamp(84px,11vw,140px);z-index:2}
.fl{animation:flt 8s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-6px)}}

/* interaksi */
.int{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:24px;align-items:start}
.int .panel{background:linear-gradient(160deg,#fff,#e8f2fd);border:2px solid var(--line);border-radius:24px;padding:20px;text-align:center;box-shadow:0 12px 30px rgba(10,42,92,.1)}
.int .panel .tile{width:120px;height:120px;margin:0 auto}
.steps{display:grid;gap:12px;counter-reset:s}
.step{display:flex;gap:14px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-left:8px solid var(--gold);border-radius:18px;padding:14px 18px;font-size:clamp(14px,1.3vw,17px);line-height:1.5;box-shadow:0 8px 20px rgba(10,42,92,.08);transition:transform .25s var(--pop)}

.step:before{counter-increment:s;content:counter(s);flex:none;width:30px;height:30px;border-radius:10px;background:var(--navy);color:var(--gold);font-weight:700;display:grid;place-items:center;font-size:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.timer{font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;color:var(--navy);margin-top:12px}
.timer.warn{color:var(--red)}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.vote button{border-radius:20px;padding:18px;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;transition:transform .2s var(--pop)}
.vote button:active{transform:scale(.96)}
.vote .y{background:var(--green);box-shadow:0 6px 0 #167a41}.vote .n{background:var(--red);box-shadow:0 6px 0 #a02a2a}
.vote small{display:block;font-weight:500;font-size:12px;opacity:.9}
.reveal{margin-top:16px;background:var(--navy);color:#fff;border-radius:18px;padding:16px 20px;line-height:1.6;font-size:14.5px;display:none}
.reveal.on{display:block;animation:rv .5s var(--ease) both}
.reveal b{color:var(--gold)}

/* rangkuman */
.ran{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:22px;align-items:start}
.check{display:grid;gap:12px}
.ck{display:flex;gap:14px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 18px;font-size:clamp(14px,1.3vw,17px);line-height:1.5;box-shadow:0 8px 20px rgba(10,42,92,.08)}
.ck .tile{width:52px;height:52px;flex:none}
.ans{background:linear-gradient(160deg,var(--navy),var(--navy2));border-radius:24px;padding:22px;color:#fff;box-shadow:0 16px 36px rgba(10,42,92,.3);display:grid;gap:12px}
.ans small{color:var(--gold);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px}
.ans div{font-size:15px;line-height:1.55}
.ans mark{background-image:linear-gradient(transparent 52%,rgba(245,179,36,.55) 52% 92%,transparent 92%);color:#fff}

/* sampul & penutup */
.cover{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center;min-height:100%}
.cover h1{font-size:clamp(28px,min(5vw,9vh),72px);line-height:1.08;font-weight:700;letter-spacing:-.02em;margin:16px 0}
.cover p.sub{font-size:clamp(14px,1.6vw,21px);line-height:1.5;color:#27406d;max-width:560px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.meta span{padding:9px 16px;border-radius:99px;border:2px dashed var(--sky);font-size:13px;font-weight:600;color:var(--blue)}
.hint{margin-top:26px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--blue)}
.hint kbd{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:8px;padding:2px 9px;font:600 12px 'Poppins'}
.pulse{animation:pls 1.8s ease-in-out infinite}
@keyframes pls{50%{transform:translateX(7px)}}
.end{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);min-height:100%;gap:0;border-radius:20px;overflow:hidden}
.end .l{background:radial-gradient(ellipse at 70% 30%,#12468C,#0A2A5C 55%,#071E45);display:grid;place-items:center;position:relative;overflow:hidden;padding:30px;min-height:260px}
.end .l:before,.end .l:after{content:"";position:absolute;width:180%;height:46px;transform:rotate(-18deg);left:-40%}
.end .l:before{background:var(--gold);bottom:14%}.end .l:after{background:var(--sky);bottom:5%;opacity:.8}
.medal{position:relative;width:min(70%,260px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE29A,#F5B324 55%,#C8901A);display:grid;place-items:center;box-shadow:0 20px 50px rgba(0,0,0,.4),0 0 0 14px rgba(245,179,36,.25);animation:flt 4s ease-in-out infinite;z-index:1}
.medal:before{content:"";position:absolute;inset:12%;border-radius:50%;border:5px dashed rgba(10,42,92,.55);animation:spin 20s linear infinite}
.medal svg{width:50%;height:50%;stroke:var(--navy);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.end .r{background:var(--paper);padding:clamp(22px,3vw,48px);display:flex;flex-direction:column;justify-content:center}
.end h1{font-size:clamp(28px,4.4vw,60px);line-height:1.1;font-weight:700;margin:12px 0}
.end p{font-size:clamp(14px,1.3vw,17px);line-height:1.6;color:#27406d}
.refl{margin-top:16px;display:grid;gap:8px}
.refl .chip{font-size:14px}

/* agenda */
.agenda{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px;margin-top:22px}
.ag{text-align:left;background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:8px;grid-template-columns:auto 1fr;align-items:center;box-shadow:0 10px 26px rgba(10,42,92,.1);transition:transform .3s var(--pop),border-color .2s,box-shadow .3s}
.ag:hover{border-color:var(--gold);box-shadow:0 20px 36px rgba(10,42,92,.18)}
.ag .tile{width:64px;height:64px}
.ag b{font-size:15px;line-height:1.3;display:block}
.ag small{font-size:12px;color:var(--blue);font-weight:600}
.ag .no{grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6b7fa3;display:flex;justify-content:space-between}
.agdiv{grid-column:1/-1;display:flex;align-items:center;gap:12px;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.agdiv:after{content:"";height:3px;flex:1;background:linear-gradient(90deg,var(--gold),transparent);border-radius:3px}

/* ringkasan akhir */
.sum{display:grid;gap:18px;margin-top:20px}
.chain{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}

<script type="application/json" id="deck-data">{"groups":[{"name":"Pembukaan","slides":[{"n":1,"type":"JUD","title":"Memahami dan Menghitung Pajak dalam Rangka Impor (PDRI)","isi":"Judul, subjudul, nama fasilitator, tanggal, lokasi (isian kosong).","sumber":"","catatan":"","layout":"S1.","visual":"Foto kapal peti kemas dipotong lingkaran dengan border putih, cincin sky, dan dua busur emas. Latar navy aurora. Pill logo kanan atas."}]},{"name":"Bab 1","slides":[{"n":8,"type":"PER","title":"Hari Pertama di Pelabuhan","sumber":"","catatan":"","isi":"Nomor KB 01. Hari pertama di pelabuhan. Kita akan mengenal komponen pungutan impor, lalu menghitung nilai impor.","layout":"S2","visual":"Ikon tile kapal (emas)."},{"n":"1.01","type":"SCN","title":"Hari pertama di pelabuhan","tag":"Bab 1 · Slide 1 dari 11","isi":"","sumber":"","catatan":"Narasi: Hari pertama di pelabuhan. Kita akan mengenal komponen pungutan impor, lalu menghitung nilai impor.","src":"presentasi-pdri-v3-scenes/bab1/01-intro.html"},{"n":"1.02","type":"SCN","title":"Tanjung Priok","tag":"Bab 1 · Slide 2 dari 11","isi":"","sumber":"","catatan":"Narasi: Hari ini Anda mulai bertugas di Tanjung Priok. Sebuah kapal membawa kontainer berisi kain kapas milik PT Kain Prima Nusantara. Harga kainnya sekitar satu koma nol sembilan miliar rupiah. Tetapi tagihan pungutannya sekitar enam ratus empat puluh lima juta rupiah. Staf perusahaan datang ke meja layanan dan bertanya, hitungan ini dari mana? Di bab ini, kita mulai menyusun jawabannya.","src":"presentasi-pdri-v3-scenes/bab1/02-port.html"},{"n":"1.03","type":"SCN","title":"Dua kelompok pungutan","tag":"Bab 1 · Slide 3 dari 11","isi":"","sumber":"","catatan":"Narasi: Saat barang masuk ke daerah pabean, importir membayar dua kelompok pungutan. Kelompok pertama adalah pungutan kepabeanan: Bea Masuk, dan bea masuk tambahan, seperti bea masuk tindakan pengamanan atau BMTP, bea masuk antidumping, dan bea masuk imbalan. Angka-angka ini sudah Anda pelajari di materi kepabeanan. Kelompok kedua adalah pajak dalam rangka impor, atau PDRI, yaitu pajak yang dipungut Bea dan Cukai pada saat impor.","src":"presentasi-pdri-v3-scenes/bab1/03-groups.html"},{"n":"1.04","type":"SCN","title":"Tiga jenis PDRI","tag":"Bab 1 · Slide 4 dari 11","isi":"","sumber":"","catatan":"Narasi: PDRI terdiri atas tiga jenis. Pertama, PPN Impor. Pajak ini dikenakan atas impor barang kena pajak, oleh siapa pun yang mengimpor. Kedua, PPnBM Impor, yang hanya dikenakan atas barang yang tergolong mewah. Ketiga, PPh Pasal dua puluh dua Impor, yaitu pembayaran di muka atas pajak penghasilan importir. Barang kena cukai juga dapat menimbulkan cukai, tetapi itu dibahas di modul tersendiri.","src":"presentasi-pdri-v3-scenes/bab1/04-pdri.html"},{"n":"1.05","type":"SCN","title":"Nilai impor","tag":"Bab 1 · Slide 5 dari 11","isi":"","sumber":"","catatan":"Narasi: Lalu, dari angka apa semua pajak ini dihitung? Jawabannya: nilai impor. Nilai impor sama dengan nilai pabean dalam rupiah, ditambah Bea Masuk, ditambah bea masuk tambahan, misalnya BMTP. PPN dan PPnBM tidak termasuk di dalamnya. Dari satu angka ini, PPN, PPnBM, dan PPh Pasal dua puluh dua dihitung. Undang-undang PPN dan PMK lima puluh satu tahun dua ribu dua puluh lima memakai dasar yang sama.","src":"presentasi-pdri-v3-scenes/bab1/06-nilai.html"},{"n":"1.06","type":"SCN","title":"Kasus 1: kain tenunan kapas","tag":"Bab 1 · Slide 6 dari 11","isi":"","sumber":"","catatan":"Narasi: Sekarang kita hitung untuk kasus kain tadi. Importir memasukkan seratus ribu meter kain tenunan kapas, dengan nilai CIF enam puluh ribu dolar Amerika. Kurs pajak minggu ini delapan belas ribu seratus lima puluh lima rupiah per dolar. Tarif Bea Masuknya kita anggap sepuluh persen. Angka ini masih asumsi latihan, jadi cocokkan dulu dengan BTKI. Kain ini juga dikenai BMTP tiga ribu tiga ratus rupiah per meter.","src":"presentasi-pdri-v3-scenes/bab1/07-case.html"},{"n":"1.07","type":"SCN","title":"Langkah 1: nilai pabean","tag":"Bab 1 · Slide 7 dari 11","isi":"","sumber":"","catatan":"Narasi: Langkah pertama, nilai pabean dalam rupiah. Enam puluh ribu dolar dikali kurs. Hasilnya satu koma nol delapan sembilan miliar rupiah. Inilah balok dasar nilai impor.","src":"presentasi-pdri-v3-scenes/bab1/08-step1.html"},{"n":"1.08","type":"SCN","title":"Langkah 2 dan 3: BM dan BMTP","tag":"Bab 1 · Slide 8 dari 11","isi":"","sumber":"","catatan":"Narasi: Langkah kedua, Bea Masuk. Sepuluh persen dari nilai pabean, yaitu sekitar seratus sembilan juta rupiah. Langkah ketiga, BMTP. Seratus ribu meter dikali tiga ribu tiga ratus rupiah, hasilnya tiga ratus tiga puluh juta rupiah. Perhatikan, BMTP dihitung per meter, bukan dari persentase harga.","src":"presentasi-pdri-v3-scenes/bab1/09-step2.html"},{"n":"1.09","type":"SCN","title":"Langkah 4: nilai impor","tag":"Bab 1 · Slide 9 dari 11","isi":"","sumber":"","catatan":"Narasi: Langkah keempat, jumlahkan ketiganya. Nilai pabean, ditambah Bea Masuk, ditambah BMTP. Nilai impornya satu koma lima dua delapan miliar rupiah. Angka inilah yang akan menjadi dasar PPN Impor dan PPh Pasal dua puluh dua di bab-bab berikutnya.","src":"presentasi-pdri-v3-scenes/bab1/10-step3.html"},{"n":"1.10","type":"SCN","title":"Cek dulu sebelum hitung","tag":"Bab 1 · Slide 10 dari 11","isi":"","sumber":"","catatan":"Narasi: Karena itu, biasakan cek dulu sebelum hitung. Pertama, status importir: punya API atau tidak, PKP atau tidak. Kedua, jenis barang: tergolong mewah atau tidak. Ketiga, aturan dan kurs: masih berlaku, dan sesuai minggu berjalan. Satu kesalahan pada nilai impor akan terbawa ke semua pajak di bawahnya.","src":"presentasi-pdri-v3-scenes/bab1/12-check.html"},{"n":"1.11","type":"SCN","title":"Rangkuman","tag":"Bab 1 · Slide 11 dari 11","isi":"","sumber":"","catatan":"Narasi: Jadi, ini rangkumannya. PDRI terdiri atas PPN Impor, PPnBM Impor, dan PPh Pasal dua puluh dua Impor. Bea Masuk dan bea masuk tambahan adalah pungutan kepabeanan, dan menjadi bagian dari nilai impor. Semua PDRI dihitung dari nilai impor, jadi periksa angka ini lebih dahulu.","src":"presentasi-pdri-v3-scenes/bab1/13-wrap.html"}]},{"name":"Bab 2","slides":[{"n":15,"type":"PER","title":"Dasar Negara Memungut Pajak","sumber":"","catatan":"","isi":"Nomor KB 02. Mari kita lanjutkan ya. Pada materi kedua ini, kita akan membahas mengapa negara boleh memungut pajak, dari lima sudut pandang.","layout":"S2","visual":"Ikon tile timbangan (biru)."},{"n":"2.01","type":"SCN","title":"Dasar negara memungut pajak","tag":"Bab 2 · Slide 1 dari 10","isi":"","sumber":"","catatan":"Narasi: Mari kita lanjutkan ya. Pada materi kedua ini, kita akan membahas mengapa negara boleh memungut pajak, dari lima sudut pandang.","src":"presentasi-pdri-v3-scenes/bab2/01-intro.html"},{"n":"2.02","type":"SCN","title":"Pertanyaan di meja layanan","tag":"Bab 2 · Slide 2 dari 10","isi":"","sumber":"","catatan":"Narasi: Di materi pertama, staf PT Kain Prima Nusantara bertanya dari mana angka tagihannya. Kali ini, pertanyaannya lebih mendasar. Kenapa kami harus bayar? Kami kan tidak mendapat imbalan langsung. Untuk menjawabnya, kita pakai lima sudut pandang: hukum, fungsi, teori pembenaran, asas pemungutan, dan pembeda pungutan.","src":"presentasi-pdri-v3-scenes/bab2/02-ask.html"},{"n":"2.03","type":"SCN","title":"Sudut pandang hukum","tag":"Bab 2 · Slide 3 dari 10","isi":"","sumber":"","catatan":"Narasi: Kita mulai dari sudut pandang hukum. Pasal dua puluh tiga A UUD seribu sembilan ratus empat puluh lima menyatakan, pajak dan pungutan lain yang bersifat memaksa untuk keperluan negara diatur dengan undang-undang. DPR dan Presiden menetapkan kewajiban pajak dalam undang-undang. Karena itu, negara berwenang memaksa importir membayar.","src":"presentasi-pdri-v3-scenes/bab2/03-hukum.html"},{"n":"2.04","type":"SCN","title":"Lima unsur pajak","tag":"Bab 2 · Slide 4 dari 10","isi":"","sumber":"","catatan":"Narasi: Lalu, apa sebenarnya pajak itu? Pasal satu angka satu UU KUP memberi definisinya, dan dari situ kita dapat lima unsur pajak. Pertama, kontribusi wajib kepada negara. Kedua, terutang oleh orang pribadi atau badan. Ketiga, bersifat memaksa berdasarkan undang-undang. Keempat, tanpa imbalan secara langsung. Kelima, digunakan untuk keperluan negara, bagi sebesar-besarnya kemakmuran rakyat.","src":"presentasi-pdri-v3-scenes/bab2/04-unsur.html"},{"n":"2.05","type":"SCN","title":"Sudut pandang fungsi","tag":"Bab 2 · Slide 5 dari 10","isi":"","sumber":"","catatan":"Narasi: Sudut pandang kedua, fungsi pajak. Pertama, fungsi budgetair, atau penerimaan. PPN dan PPh Pasal dua puluh dua atas kain tadi masuk ke kas negara untuk membiayai belanja negara. Kedua, fungsi regulerend, atau mengatur. Pemerintah memakai pungutan untuk mengatur kegiatan ekonomi. BMTP melindungi industri tekstil dalam negeri. Tarif PPh Pasal dua puluh dua tanpa API, tujuh koma lima persen, juga lebih tinggi daripada dengan API, dua koma lima persen. Jadi, importir terdorong untuk memiliki API.","src":"presentasi-pdri-v3-scenes/bab2/06-fungsi.html"},{"n":"2.06","type":"SCN","title":"Teori pembenaran","tag":"Bab 2 · Slide 6 dari 10","isi":"","sumber":"","catatan":"Narasi: Sudut pandang ketiga, teori pembenaran. Ada lima teori yang menjelaskan mengapa negara berhak memungut pajak. Teori asuransi: negara melindungi rakyat, dan pajak menjadi semacam premi, misalnya untuk menjaga jalur perdagangan dan pelabuhan. Teori kepentingan: importir memakai pelabuhan, jalan, dan layanan kepabeanan, jadi ikut menanggung bebannya. Teori daya pikul: importir yang sanggup membeli kain satu miliar rupiah dianggap mampu memikul pajaknya. Teori bakti: membayar pajak adalah wujud bakti warga kepada negara. Dan teori daya beli: PPN atas kain akhirnya ditanggung pembeli kemeja, lalu kembali dalam bentuk layanan publik.","src":"presentasi-pdri-v3-scenes/bab2/07-teori.html"},{"n":"2.07","type":"SCN","title":"Asas pemungutan","tag":"Bab 2 · Slide 7 dari 10","isi":"","sumber":"","catatan":"Narasi: Sudut pandang keempat, asas pemungutan. Adam Smith, dalam The Wealth of Nations, mengajukan empat asas. Equality: pajak adil sesuai kemampuan, misalnya tarif yang sama untuk importir dengan kondisi yang sama. Certainty: pajak harus pasti. Tarif PPh Pasal dua puluh dua tercantum dalam PMK lima puluh satu Tahun dua ribu dua puluh lima. Convenience: pajak dipungut pada saat yang paling memudahkan. PDRI dibayar bersamaan dengan Bea Masuk. Economy: biaya pemungutan harus lebih kecil daripada penerimaan. DJBC memungut PDRI dalam satu dokumen dan satu pembayaran.","src":"presentasi-pdri-v3-scenes/bab2/08-asas.html"},{"n":"2.08","type":"SCN","title":"Asas wilayah dan kewarganegaraan","tag":"Bab 2 · Slide 8 dari 10","isi":"","sumber":"","catatan":"Narasi: Ada juga asas yang mengaitkan pajak dengan wilayah dan kewarganegaraan. Asas domisili: negara memajaki penduduknya atas seluruh penghasilan, dari dalam maupun luar negeri. Asas sumber: negara memajaki penghasilan yang bersumber di wilayahnya, siapa pun penerimanya. Dan asas kebangsaan, yang mengaitkan pengenaan pajak dengan kewarganegaraan.","src":"presentasi-pdri-v3-scenes/bab2/09-wilayah.html"},{"n":"2.09","type":"SCN","title":"Pembeda pungutan","tag":"Bab 2 · Slide 9 dari 10","isi":"","sumber":"","catatan":"Narasi: Sudut pandang kelima, pembeda pungutan. Tidak semua pungutan negara adalah pajak. Pajak, seperti PPN dan PPh, tidak memberi imbalan langsung dan berdasar undang-undang. Retribusi memberi imbalan langsung atas jasa, berdasar peraturan daerah, misalnya retribusi parkir. PNBP juga memberi imbalan langsung atas layanan, misalnya biaya paspor. Bea Masuk sama seperti pajak: tanpa imbalan langsung, berdasar UU Kepabeanan. Cukai juga pungutan berdasar undang-undang, dan dibahas di modul tersendiri.","src":"presentasi-pdri-v3-scenes/bab2/10-pembeda.html"},{"n":"2.10","type":"SCN","title":"Rangkuman","tag":"Bab 2 · Slide 10 dari 10","isi":"","sumber":"","catatan":"Narasi: Jadi, ini rangkumannya. Pasal dua puluh tiga A UUD seribu sembilan ratus empat puluh lima dan UU KUP menjadi dasar hukum pemungutan pajak. Pajak memiliki fungsi budgetair dan regulerend. Teori pembenaran dan asas pemungutan membantu Anda menjelaskan kepada pengguna jasa mengapa suatu pungutan adil.","src":"presentasi-pdri-v3-scenes/bab2/12-wrap.html"}]},{"name":"Bab 3","slides":[{"n":26,"type":"PER","title":"Pihak dan Sistem Pemungutan","sumber":"","catatan":"","isi":"Nomor KB 03. Mari kita lanjutkan, ya sobat. Pada materi ketiga ini, kita akan melihat siapa yang memungut pajak, dan dengan cara apa.","layout":"S2","visual":"Ikon tile orang-orang (sky)."},{"n":"3.01","type":"SCN","title":"Pihak dan sistem pemungutan","tag":"Bab 3 · Slide 1 dari 10","isi":"","sumber":"","catatan":"Narasi: Mari kita lanjutkan, ya sobat. Pada materi ketiga ini, kita akan melihat siapa yang memungut pajak, dan dengan cara apa.","src":"presentasi-pdri-v3-scenes/bab3/01-intro.html"},{"n":"3.02","type":"SCN","title":"Satu PIB, banyak pihak","tag":"Bab 3 · Slide 2 dari 10","isi":"","sumber":"","catatan":"Narasi: Staf PT Kain Prima Nusantara kini bertanya, siapa sebenarnya yang memungut, dan dengan cara apa? Jawabannya bertemu dalam satu dokumen, yaitu Pemberitahuan Impor Barang, atau PIB. Di balik satu PIB itu, ada enam pihak dan tiga sistem pemungutan yang bekerja bersama.","src":"presentasi-pdri-v3-scenes/bab3/02-ask.html"},{"n":"3.03","type":"SCN","title":"Tiga sistem pemungutan","tag":"Bab 3 · Slide 3 dari 10","isi":"","sumber":"","catatan":"Narasi: Kita mulai dari tiga sistem pemungutan pajak. Pertama, official assessment: petugas pajak, atau fiskus, yang menentukan besarnya pajak. Dalam Kasus satu, pejabat DJBC meneliti PIB dan dapat menetapkan kekurangan pembayaran. Kedua, self assessment: wajib pajak menentukan sendiri. Importir menghitung sendiri Bea Masuk dan PDRI dalam PIB. Ketiga, withholding: pihak ketiga yang ditunjuk undang-undang memungut pajaknya. DJBC memungut PPh Pasal dua puluh dua Impor atas penghasilan importir.","src":"presentasi-pdri-v3-scenes/bab3/03-sistem.html"},{"n":"3.04","type":"SCN","title":"Ketiganya berjalan bersama","tag":"Bab 3 · Slide 4 dari 10","isi":"","sumber":"","catatan":"Narasi: Sistem utama di Indonesia adalah self assessment. Tetapi dalam impor, ketiganya berjalan bersama. Importir menghitung, DJBC meneliti, dan DJBC juga memungut PPh Pasal dua puluh dua.","src":"presentasi-pdri-v3-scenes/bab3/04-alur.html"},{"n":"3.05","type":"SCN","title":"Jenis-jenis pajak","tag":"Bab 3 · Slide 5 dari 10","isi":"","sumber":"","catatan":"Narasi: Pajak juga dapat dibagi menurut tiga dasar. Menurut lembaga pemungutnya, ada pajak pusat, seperti PPN, PPnBM, PPh, dan Bea Meterai, dan ada pajak daerah, seperti pajak kendaraan bermotor dan pajak hotel. Menurut pihak yang menanggung, PPh adalah pajak langsung, sedangkan PPN dan PPnBM adalah pajak tidak langsung. Menurut sifatnya, PPh adalah pajak subjektif, karena memperhatikan keadaan wajib pajak, sedangkan PPN adalah pajak objektif, karena memperhatikan objeknya.","src":"presentasi-pdri-v3-scenes/bab3/06-jenis.html"},{"n":"3.06","type":"SCN","title":"Peta dasar hukum","tag":"Bab 3 · Slide 6 dari 10","isi":"","sumber":"","catatan":"Narasi: Lalu, aturan mana yang menjadi pegangan? UU KUP, UU PPh, dan UU PPN berasal dari tahun seribu sembilan ratus delapan puluh tiga, dan terakhir diubah dengan UU enam Tahun dua ribu dua puluh tiga tentang Cipta Kerja. UU Harmonisasi Peraturan Perpajakan menetapkan tarif PPN dua belas persen, paling lambat satu Januari dua ribu dua puluh lima. Untuk kepabeanan, pegangannya UU sepuluh Tahun seribu sembilan ratus sembilan puluh lima, yang diubah dengan UU tujuh belas Tahun dua ribu enam.","src":"presentasi-pdri-v3-scenes/bab3/07-hukum.html"},{"n":"3.07","type":"SCN","title":"Urutan peraturan","tag":"Bab 3 · Slide 7 dari 10","isi":"","sumber":"","catatan":"Narasi: Dalam pekerjaan, Anda akan menemui peraturan dengan urutan ini. Undang-undang, Peraturan Pemerintah, Peraturan Menteri Keuangan atau PMK, lalu Peraturan Direktur Jenderal. Ingat, peraturan yang lebih rendah tidak boleh bertentangan dengan peraturan yang lebih tinggi.","src":"presentasi-pdri-v3-scenes/bab3/08-hierarki.html"},{"n":"3.08","type":"SCN","title":"Pembagian peran","tag":"Bab 3 · Slide 8 dari 10","isi":"","sumber":"","catatan":"Narasi: Sekarang, siapa melakukan apa? Importir menghitung dan membayar Bea Masuk dan PDRI, serta mengisi PIB. PPJK mengurus kewajiban kepabeanan atas kuasa importir. DJBC meneliti PIB, memungut PDRI, dan menetapkan kekurangan pembayaran. Bank persepsi atau bank devisa menerima pembayarannya. DJP mengadministrasikan pengkreditan PPN dan PPh Pasal dua puluh dua dalam SPT importir. Dan konsumen akhir menanggung PPN di ujung rantai penjualan.","src":"presentasi-pdri-v3-scenes/bab3/09-peran.html"},{"n":"3.09","type":"SCN","title":"Identitas importir","tag":"Bab 3 · Slide 9 dari 10","isi":"","sumber":"","catatan":"Narasi: Saat melayani, Anda akan sering memeriksa identitas importir. NPWP atau NIK, Angka Pengenal Importir, API-U atau API-P, dan status Pengusaha Kena Pajak, atau PKP. Data ini terhubung dengan Coretax, sistem administrasi perpajakan DJP.","src":"presentasi-pdri-v3-scenes/bab3/10-identitas.html"},{"n":"3.10","type":"SCN","title":"Rangkuman","tag":"Bab 3 · Slide 10 dari 10","isi":"","sumber":"","catatan":"Narasi: Jadi, ini rangkumannya. Dalam impor, self assessment, official assessment, dan withholding berjalan bersama. DJBC memungut PDRI di pelabuhan, sedangkan DJP mengadministrasikan pengkreditannya. Dan sebelum melayani, periksa dulu identitas importir: NPWP, API, dan status PKP.","src":"presentasi-pdri-v3-scenes/bab3/12-wrap.html"}]},{"name":"Penutup","slides":[{"n":75,"type":"PEN","title":"Terima kasih","isi":"Terima kasih; Ulangi slide yang masih terasa sulit; Gunakan rangkuman tiap bab sebagai pengingat; Lanjutkan ke Bab 4: PPN Impor","sumber":"","catatan":"Umumkan kelompok pemenang lomba hitung dan bagikan stempel terakhir.","layout":"S11.","visual":"Panel kiri navy dengan medali emas dan cincin; pita diagonal emas dan sky; panel kanan kertas."}]}]}</script>

const PAL={gold:['#FFD05A','#F5B324','#C8901A'],blue:['#2B7FD0','#0055A5','#003A73'],sky:['#9ED0F6','#3A9BE1','#1F6FAE'],navy:['#1E5AA8','#0A2A5C','#071E45'],white:['#FFFFFF','#E4EDF8','#BCCFE6'],red:['#F27A7A','#D83C3C','#A02A2A'],green:['#5BCB8A','#22A55A','#167A41']};
function iso(blocks,W=520,H=400,U=34){
  const ox=W/2,oy=H*.62;
  const P=(x,y,z)=>[ox+(x-y)*.866*U,oy+(x+y)*.5*U-z*U];
  const pt=a=>a.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
  const sorted=[...blocks].sort((a,b)=>(a.x+a.y+a.z*.01)-(b.x+b.y+b.z*.01)||a.z-b.z);
  let out='<defs><filter id="isb"><feGaussianBlur stdDeviation="8"/></filter></defs>';
  let mnx=1e9,mxx=-1e9,mxy=-1e9;
  sorted.forEach(b=>{const [,,,]=[0];});
  let body='';
  sorted.forEach((b,i)=>{
    const {x,y,z,w,d,h}=b,p=PAL[b.c]||PAL.gold;
    const top=[P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)];
    const left=[P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)];
    const right=[P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)];
    const seg=b.stripes?[...Array(Math.max(1,Math.round(w*2)-1))].map((_,k)=>{const t=(k+1)/Math.round(w*2);const a=P(x+w*t,y+d,z+.08),bb=P(x+w*t,y+d,z+h-.08);return `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${bb[0].toFixed(1)}" y2="${bb[1].toFixed(1)}" stroke="${p[2]}" stroke-opacity=".45" stroke-width="2"/>`}).join(''):'';
    const fl=b.float?` class="fl" style="animation-delay:${(i*.35).toFixed(2)}s"`:'';
    body+=`<g${fl}><polygon points="${pt(left)}" fill="${p[1]}"/><polygon points="${pt(right)}" fill="${p[2]}"/><polygon points="${pt(top)}" fill="${p[0]}"/>${seg}</g>`;
    top.concat(left,right).forEach(q=>{mnx=Math.min(mnx,q[0]);mxx=Math.max(mxx,q[0]);mxy=Math.max(mxy,q[1])});
  });
  const sh=`<ellipse cx="${((mnx+mxx)/2).toFixed(0)}" cy="${(mxy+10).toFixed(0)}" rx="${((mxx-mnx)*.42).toFixed(0)}" ry="16" fill="#0A2A5C" opacity=".22" filter="url(#isb)"/>`;
  return `<svg class="iso" viewBox="0 0 ${W} ${H}" aria-hidden="true">${out}${sh}${body}</svg>`;
}

/* latar: partikel aurora (gelap) + segitiga melayang (kedua tema) */
function decorate(el,dark){
  const bg=el.querySelector('.bgl');
  const n=innerWidth<700?5:9;
  for(let k=0;k<n;k++){
    const t=document.createElement('i');t.className='tri';
    const sz=rnd(60,260);
    t.style.cssText=`width:${sz}px;height:${sz*.9}px;left:${rnd(-5,95)}%;top:${rnd(-5,90)}%;background:${dark?(Math.random()<.75?'#3A9BE1':'#0055A5'):(Math.random()<.35?'#F5B324':'#3A9BE1')};opacity:${dark?rnd(.05,.13):rnd(.04,.09)}`;
    bg.appendChild(t);
    if(!reduce)t.animate([{transform:'translate(0,0) rotate(0deg)'},{transform:`translate(${rnd(-60,60)}px,${rnd(-50,50)}px) rotate(${rnd(-50,50)}deg)`}],{duration:rnd(20000,36000),direction:'alternate',iterations:Infinity,easing:'ease-in-out'});
  }

}
function aurora(bg){
  const cv=document.createElement('canvas');cv.className='cv';bg.appendChild(cv);
  const ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),ps=[];let W=0,H=0;
  const size=()=>{W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!ps.length&&W)for(let k=0;k<(innerWidth<700?24:44);k++)ps.push({x:rnd(0,W),y:rnd(0,H),r:rnd(1,2.8),v:rnd(.08,.28),c:Math.random()<.5?'245,179,36':'255,255,255',a:rnd(.2,.65),ph:rnd(0,6)})};
  new ResizeObserver(size).observe(cv);size();
  (function f(){if(!cv.isConnected)return;ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.y-=p.v;p.ph+=.006;p.x+=Math.sin(p.ph)*.18;if(p.y<-6){p.y=H+6;p.x=rnd(0,W)}ctx.fillStyle=`rgba(${p.c},${p.a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()});
    requestAnimationFrame(f)})();
}

/* judul muncul per kata */
function splitTitle(h){
  h.classList.remove('rv');
  let k=0;
  const walk=n=>[...n.childNodes].forEach(c=>{
    if(c.nodeType===3){
      const fr=document.createDocumentFragment();
      c.textContent.split(/(\s+)/).forEach(tk=>{
        if(!tk.trim()){fr.append(tk);return}
        const o=document.createElement('span');o.className='w';
        const i=document.createElement('span');i.textContent=tk;i.style.animationDelay=`calc(var(--base,0s) + ${k++*90+150}ms)`;
        o.append(i);fr.append(o);
      });
      c.replaceWith(fr);
    }else if(c.nodeType===1&&c.tagName!=='BR')walk(c);
  });
  walk(h);
}
/* angka menghitung naik */
function countUp(el,delay){
  const txt=el.textContent,m=txt.match(/\d[\d.]*(?:,\d+)?/);if(!m)return;
  const raw=m[0],dec=raw.includes(',')?raw.split(',')[1].length:0,val=parseFloat(raw.replace(/\./g,'').replace(',','.'));
  if(!isFinite(val))return;
  const pre=txt.slice(0,m.index),post=txt.slice(m.index+raw.length),pad=/^0\d/.test(raw)?raw.length:0;
  const fmt=v=>pad?String(Math.round(v)).padStart(pad,'0'):v.toLocaleString('id-ID',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  const t0=performance.now()+delay;el.textContent=pre+fmt(0)+post;
  (function f(t){const p=Math.max(0,Math.min(1,(t-t0)/2000)),e=1-Math.pow(1-p,3);el.textContent=pre+fmt(val*e)+post;if(p<1&&el.isConnected)requestAnimationFrame(f)})(performance.now());
}
/* kemiringan 3D mengikuti pointer */
function tilt(root){
  if(!fine||reduce)return;
  root.querySelectorAll('.card,.ck,.ag,.stat,.panel,.ans,.cb').forEach(e=>{
    let tx=0,ty=0,cx=0,cy=0,raf=0,on=false;
    const step=()=>{
      cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;
      if(!on&&Math.abs(cx)+Math.abs(cy)<.02){e.style.transform='';raf=0;return}
      e.style.transform=`perspective(1000px) rotateX(${cy.toFixed(2)}deg) rotateY(${cx.toFixed(2)}deg)`;
      raf=requestAnimationFrame(step);
    };
    e.addEventListener('pointermove',ev=>{const r=e.getBoundingClientRect();tx=((ev.clientX-r.left)/r.width-.5)*7;ty=-((ev.clientY-r.top)/r.height-.5)*5;on=true;if(!raf)raf=requestAnimationFrame(step)});
    e.addEventListener('pointerleave',()=>{tx=ty=0;on=false;if(!raf)raf=requestAnimationFrame(step)});
  });
}

function mount(i,base){

const VARIANTS=['wipe','circle','zoom','push','curtain','flip','rise'];
let wtimer=0;
function go(i){

  if(i===cur&&slideEl.children.length)return;
  const dir=i>=cur?1:-1,my=++tok;clearTimeout(wtimer);
  const kids=[...slideEl.children],old=kids.pop();
  kids.forEach(k=>{k._clean&&k._clean();k.remove()});
  if(old)old.getAnimations().forEach(a=>{try{a.finish()}catch(e){}});
  wipe.classList.remove('go','rev');
  cur=i;updateChrome();
  try{const oi=old&&old.querySelector('iframe');oi&&oi.contentWindow&&oi.contentWindow.postMessage({pm:'pause'},'*')}catch(e){}
  const drop=o=>{if(o){o._clean&&o._clean();o.remove()}};
  if(reduce||!old){drop(old);mount(i,'0s');return}
  const v=VARIANTS[i%VARIANTS.length],E='cubic-bezier(.2,.8,.2,1)';

  const nu=mount(i,base);nu.style.zIndex=2;old.style.zIndex=1;

    o.appendChild(d);
  });
  document.querySelectorAll('.it').forEach(b=>b.classList.toggle('on',+b.dataset.i===cur));
  document.querySelectorAll('.grp').forEach(g=>{if(g.querySelector('.it.on'))g.classList.add('open')});
}
const app=$('#app');
function closeDrawer(){app.classList.remove('drawer')}
$('#btnMenu').onclick=()=>{if(innerWidth<=900)app.classList.toggle('drawer');else app.classList.toggle('collapsed')};
$('#scrim').onclick=closeDrawer;
$('#q').oninput=e=>buildOutline(e.target.value);
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#prog').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();go(Math.round((e.clientX-r.left)/r.width*flat.length)-1)};
function toggleNotes(f){$('#notes').classList.toggle('on',f)}
$('#btnNotes').onclick=()=>toggleNotes();$('#notesX').onclick=()=>toggleNotes(false);
function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
$('#btnFs').onclick=fs;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}


/* pesan dari adegan: next, menu, ready, done */
addEventListener('message',e=>{
  const m=e.data;if(!m||!m.pm)return;
  if(m.pm==='pv-cmd'){pvCmd(m);return}
  const fr=[...slideEl.querySelectorAll('iframe')].find(f=>f.contentWindow===e.source);
  if(!fr)return;
  const cur_=slideEl.lastElementChild;if(!cur_||!cur_.contains(fr))return;
  if(m.pm==='key')remoteKey(m);
  else if(m.pm==='next')go(cur+1);
  else if(m.pm==='menu'){if(innerWidth<=900)app.classList.add('drawer');else app.classList.remove('collapsed')}
  else if(m.pm==='ready'){setTimeout(()=>{try{fr.contentWindow.postMessage({pm:'start',mode:MODE},'*')}catch(e){}},reduce?100:1500)}
  else if(m.pm==='done'){
    const i=cur;flat[i].done=true;
    const b=document.querySelector('.it[data-i="'+i+'"]');b&&b.classList.add('done');
    if(AUTONEXT&&i<flat.length-1){toast('Adegan selesai. Lanjut otomatis…');const t=tok;setTimeout(()=>{if(cur===i&&t===tok&&AUTONEXT)go(i+1)},2600)}
  }
});

/* keyboard + swipe */
addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  if($('#modal').classList.contains('on')){if(e.key==='Escape')closeModal();return}
  const k=e.key;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)&&!e.target.closest('button:not(.nav)')&&!(flat[cur].type==='SCN'&&(k===' '||k==='Enter'))){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){e.preventDefault();go(cur-1)}
  else if(k==='Home')go(0);else if(k==='End')go(flat.length-1);
  else if(k==='F5'){e.preventDefault();startShow({from:e.shiftKey?cur:0,presenter:false})}else if(k==='b'||k==='B'||k==='.'){toggleBlack()}
  else if(k==='n'||k==='N')toggleNotes();else if(k==='m'||k==='M')$('#btnMenu').click();
  else if(k==='f'||k==='F')fs();else if(k==='Escape'){toggleNotes(false);closeDrawer()}
});
let tx=0,ty=0;
$('#stage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('#stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1))},{passive:true});
addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1));if(n&&n-1!==cur)go(n-1)});

/* ================= editor HTML ================= */
let editTab='slide';
function openModal(){
  const s=flat[cur];
  $('#eTitle').value=s.ref?s.ref.title:s.title;$('#eIsi').value=s.ref?s.ref.isi:'';$('#eSrc').value=s.ref?s.ref.sumber:s.sumber;$('#eNote').value=s.ref?s.ref.catatan:s.catatan;
  const syn=!s.ref;
  ['eTitle','eIsi','eSrc','eNote'].forEach(id=>$('#'+id).disabled=syn);
  $('#eJson').value=JSON.stringify(deckData,null,1);
  $('#modal').classList.add('on');
}
function closeModal(){$('#modal').classList.remove('on')}
function reload(keep){const c=cur;cur=-1;slideEl.innerHTML='';buildFlat();buildOutline($('#q').value);go(Math.min(keep===undefined?c:keep,flat.length-1))}
$('#btnEdit').onclick=openModal;$('#mClose').onclick=closeModal;
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  editTab=b.dataset.tab;$('#mSlide').style.display=editTab==='slide'?'':'none';$('#mJson').style.display=editTab==='json'?'':'none';
});
$('#mApply').onclick=()=>{
  try{
    if(editTab==='json'){deckData=JSON.parse($('#eJson').value);reload(0)}
    else{const s=flat[cur];if(s.ref){s.ref.title=$('#eTitle').value;s.ref.isi=$('#eIsi').value;s.ref.sumber=$('#eSrc').value;s.ref.catatan=$('#eNote').value;reload()}}
    closeModal();toast('Perubahan diterapkan');
  }catch(err){toast('JSON tidak valid: '+err.message)}
};
$('#mReset').onclick=()=>{deckData=JSON.parse(ORIGINAL);reload(0);closeModal();toast('Dikembalikan ke isi awal')};
function download(){
  const clone=document.documentElement.cloneNode(true);
  clone.querySelector('#deck-data').textContent=JSON.stringify(deckData).replace(/</g,'\\u003c');
  clone.querySelector('#slide').innerHTML='';clone.querySelector('#outline').innerHTML='';
  clone.querySelector('#modal').classList.remove('on');clone.querySelector('#app').className='app';
  const html='<!doctype html>\n'+clone.outerHTML;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='presentasi-pdri-v3.html';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('HTML diunduh');
}
$('#btnDl').onclick=download;$('#mDl').onclick=download;


/* tombol animasi: default hidup (tidak ikut pengaturan OS agar transisi selalu terlihat) */
function applyMotion(){document.documentElement.classList.toggle('no-motion',reduce);$('#btnMotion').style.opacity=reduce?.45:1;$('#btnMotion').title=reduce?'Animasi mati (klik untuk menghidupkan)':'Animasi hidup (klik untuk mematikan)'}
$('#btnMotion').onclick=()=>{reduce=!reduce;localStorage.setItem('pdri-motion',reduce?'off':'on');applyMotion();toast(reduce?'Animasi dimatikan':'Animasi dihidupkan')};
applyMotion();
if(matchMedia('(prefers-reduced-motion:reduce)').matches&&!reduce)setTimeout(()=>toast('Animasi tetap aktif. Matikan lewat tombol ✦ di kiri atas.'),1200);

/* ================= mode presentasi (proyektor) + tampilan presenter ================= */
let pw=null,showOn=false,blackOn=false,showStart=0,idleT=0;
const htmlEl=document.documentElement;
function pvPost(){
  if(!pw||pw.closed)return;
  const s=flat[cur],n=flat[cur+1];
  try{pw.postMessage({pm:'pv-state',i:cur,n:flat.length,title:s.title,tag:s.tag||s.secLabel||'',type:s.type,notes:s.catatan||'',next:n?n.title:'',show:showOn,black:blackOn,start:showStart},'*')}catch(e){}
}
function pvCmd(m){
  if(m.a==='next')go(cur+1);else if(m.a==='prev')go(cur-1);else if(m.a==='goto')go(m.i);
  else if(m.a==='black')toggleBlack();else if(m.a==='hello')pvPost();
  else if(m.a==='replay'){const fr=slideEl.lastElementChild&&slideEl.lastElementChild.querySelector('iframe');try{fr&&fr.contentWindow.postMessage({pm:'start',mode:MODE},'*')}catch(e){}}
}
function toggleBlack(f){blackOn=f===undefined?!blackOn:f;$('#blk').classList.toggle('on',blackOn);pvPost()}
function remoteKey(m){
  const k=m.key;
  if(['PageDown','ArrowRight','ArrowDown',' ','Enter'].includes(k))go(cur+1);
  else if(['PageUp','ArrowLeft','ArrowUp','Backspace'].includes(k))go(cur-1);
  else if(k==='b'||k==='B'||k==='.')toggleBlack();
  else if(k==='F5')m.shift?startShow({from:cur}):startShow({from:0});
  else if(k==='Home')go(0);else if(k==='End')go(flat.length-1);
}
function wake(){
  htmlEl.classList.add('awake');htmlEl.classList.remove('idle');clearTimeout(idleT);
  idleT=setTimeout(()=>{htmlEl.classList.remove('awake');htmlEl.classList.add('idle')},2600);
}
addEventListener('mousemove',()=>{if(showOn)wake()});
addEventListener('touchstart',()=>{if(showOn)wake()},{passive:true});
async function startShow(o){
  o=o||{};
  closeMenu();
  if(o.presenter){
    try{pw=window.open(location.href.split('#')[0]+'#presenter','pdri-presenter','popup=yes,width=1180,height=760')}catch(e){pw=null}
    if(!pw)toast('Jendela presenter diblokir. Izinkan pop-up untuk halaman ini.');
  }
  showOn=true;showStart=Date.now();htmlEl.classList.add('present');app.classList.add('collapsed');app.classList.remove('drawer');
  if(o.from!=null)go(o.from);
  wake();
  let screenOpt;
  if(o.presenter&&window.getScreenDetails){
    try{
      const d=await getScreenDetails();
      const ext=d.screens.find(s=>s!==d.currentScreen);
      if(ext){screenOpt={screen:ext};try{pw&&pw.moveTo(d.currentScreen.availLeft+40,d.currentScreen.availTop+40)}catch(e){}}
    }catch(e){}
  }
  try{await htmlEl.requestFullscreen(screenOpt)}catch(e){try{await htmlEl.requestFullscreen()}catch(e2){toast('Tekan F11 untuk layar penuh. Jendela ini sudah dalam mode presentasi.')}}
  pvPost();
}
function endShow(){
  if(!showOn)return;
  showOn=false;htmlEl.classList.remove('present','awake','idle');toggleBlack(false);
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  pvPost();
}
document.addEventListener('fullscreenchange',()=>{if(showOn&&!document.fullscreenElement)endShow()});
/* menu Proyeksikan */
function closeMenu(){$('#pmenu').classList.remove('on')}
$('#btnProject').onclick=e=>{e.stopPropagation();$('#pmenu').classList.toggle('on')};
document.addEventListener('click',e=>{if(!e.target.closest('#pmenu,#btnProject'))closeMenu()});
$('#pmGo').onclick=()=>{
  const from=document.querySelector('input[name=pmFrom]:checked').value==='cur'?cur:0;
  startShow({from,presenter:$('#pmPv').checked});
};
$('#pPrev').onclick=()=>go(cur-1);$('#pNext').onclick=()=>go(cur+1);
$('#pBlack').onclick=()=>toggleBlack();$('#pExit').onclick=endShow;
$('#blk').onclick=()=>toggleBlack(false);
$('#pctl').addEventListener('pointermove',e=>e.stopPropagation());
/* klik di tepi kiri/kanan panggung untuk pindah slide saat presentasi (di atas iframe) */
$('#zL').onclick=()=>go(cur-1);$('#zR').onclick=()=>go(cur+1);

/* ---- tampilan presenter (jendela terpisah) ---- */
function initPresenter(){
  htmlEl.classList.add('pv');
  document.title='Tampilan presenter · PDRI';
  const root=document.createElement('div');root.id='pv';
  root.innerHTML=`<header><b>Tampilan presenter</b><span class="grow"></span><span id="pvClock"></span><span class="pvt" id="pvTimer">00:00</span><button class="btn ghost sm" id="pvReset">Reset timer</button></header>
  <main><section class="pvcur"><small id="pvTag">Menunggu jendela presentasi…</small><h1 id="pvTitle">–</h1><div class="pvnotes" id="pvNotes"></div></section>
  <aside><div class="pvnext"><small>Berikutnya</small><b id="pvNext">–</b></div>
  <div class="pvctl"><button class="btn ghost" id="pvPrev">‹ Sebelumnya</button><button class="btn gold" id="pvNextBtn">Berikutnya ›</button></div>
  <div class="pvctl"><button class="btn ghost sm" id="pvReplay">Ulangi animasi</button><button class="btn ghost sm" id="pvBlack">Layar hitam</button><button class="btn ghost sm" id="pvA1">A−</button><button class="btn ghost sm" id="pvA2">A+</button></div>
  <div class="pvcount" id="pvCount"></div><div class="pvlist" id="pvList"></div></aside></main>`;
  document.body.appendChild(root);
  const q=id=>document.getElementById(id);
  const send=(a,i)=>{try{(window.opener||pw).postMessage({pm:'pv-cmd',a,i},'*')}catch(e){}};
  q('pvPrev').onclick=()=>send('prev');q('pvNextBtn').onclick=()=>send('next');q('pvBlack').onclick=()=>send('black');q('pvReplay').onclick=()=>send('replay');
  let fs=22;const setFs=v=>{fs=Math.max(14,Math.min(48,v));q('pvNotes').style.fontSize=fs+'px'};setFs(22);
  q('pvA1').onclick=()=>setFs(fs-2);q('pvA2').onclick=()=>setFs(fs+2);
  const list=q('pvList');
  flat.forEach((s,i)=>{const b=document.createElement('button');b.dataset.i=i;b.innerHTML=`<span>${esc(String(s.n))}</span>${esc(s.title)}`;b.onclick=()=>send('goto',i);list.appendChild(b)});
  let t0=0;
  q('pvReset').onclick=()=>{t0=Date.now()};
  setInterval(()=>{const d=new Date();q('pvClock').textContent=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});if(t0){const s=Math.floor((Date.now()-t0)/1000);q('pvTimer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}},500);
  addEventListener('message',e=>{
    const m=e.data;if(!m||m.pm!=='pv-state')return;
    if(!t0)t0=m.start||Date.now();
    q('pvTag').textContent=m.tag;q('pvTitle').textContent=m.title;
    q('pvNotes').textContent=m.notes||'Tidak ada catatan untuk slide ini.';
    q('pvNext').textContent=m.next||'Akhir presentasi';
    q('pvCount').textContent='Slide '+(m.i+1)+' dari '+m.n+(m.black?'  ·  layar hitam':'');
    q('pvBlack').classList.toggle('on',!!m.black);
    list.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===m.i));
    const on=list.querySelector('.on');on&&on.scrollIntoView({block:'nearest'});
  });
  addEventListener('keydown',e=>{
    if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();send('next')}
    else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();send('prev')}
    else if(e.key==='b'||e.key==='B'||e.key==='.')send('black');
  });
  send('hello');
}

/* slide native diskalakan dari kanvas tetap bila panggung sempit, supaya selalu 16:9 seperti PowerPoint */
function fitNative(el){
  const sc=el.querySelector('.sc');if(!sc||el.classList.contains('scn'))return;
  const W=stage.clientWidth;
  if(W>=1000){sc.style.cssText='';return}
  const DW=W<700?720:960,DH=DW*9/16,k=W/DW;
  sc.style.cssText=`width:${DW}px;height:${DH}px;inset:auto;left:0;top:0;transform:scale(${k.toFixed(4)});transform-origin:0 0`;
}
new ResizeObserver(()=>slideEl.querySelectorAll('.slide').forEach(fitNative)).observe(stage);

/* ================= mulai ================= */
buildFlat();if(IS_PV){initPresenter();return}buildOutline();
if(innerWidth>900)app.classList.add('collapsed');
const start=parseInt(location.hash.slice(1));
go(start&&start>0?start-1:0);
if(!slideEl.children.length){mount(cur,'0s')}
})();
</script>
