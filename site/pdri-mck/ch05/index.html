};

      const x = 92 + i * 290, c = G(p), t0 = m(mark) - .1;
      mcard(c, x, 290, 256, 330, { dark: true });
      if (i === 4) mk('rect', { x, y: 290, width: 256, height: 12, rx: 6, fill: MK.gold }, c);
      T(c, '0' + (i + 1), { x: x + 228, y: 335, size: 26, weight: 700, fill: MK.line, anchor: 'end' });
      tile(c, gl, x + 128, 395, { size: 96, v });
      T(c, n, { x: x + 128, y: 500, size: 25, weight: 700, fill: MK.navy, anchor: 'middle' });
      lines(c, sub, x + 128, 540, { size: 19, weight: 500, fill: MK.dim, anchor: 'middle' });
      popIn(c, t0);
      if (i) { flow(p, `M${x - 30} 455H${x - 8}`, MK.gold, t0 - .2, .2, 4); mkHead(p, x - 6, 455, 0, MK.gold, t0, 10); }
    });
    source(p, 'Bahan Ajar PDRI KB 5.5', .8, true);
  }],

  ['kas', 'API dan arus kas', (m, D) => {
    const p = panel(0);
    paper(p);
    actionTitle(p, 'Tanpa API, uang yang tertahan di muka tiga|kali lipat, tetapi tetap dapat dikreditkan', { tag: 'STATUS API DAN ARUS KAS · KASUS 1' });
    const base = 650, K2 = 330 / PPH_NON;
    const ax = G(p);
    mk('rect', { x: 120, y: base, width: 640, height: 3, fill: MK.navy }, ax);
    show(ax, .4, .3);
    [['api', 'Dengan API', '2,5%', PPH_API, MK.blue, 240], ['nonapi', 'Tanpa API', '7,5%', PPH_NON, MK.sky, 560]].forEach(([mark, n, r, v, col, x]) => {
      const t0 = m(mark) - .1, g = G(p), h = v * K2;
      const bar = mk('rect', { x: x - 90, y: base, width: 180, height: 0, fill: col }, g);
      prog(q => { bar.setAttribute('y', base - h * q); bar.setAttribute('height', h * q); }, t0, .8, out);
      T(g, n, { x, y: base + 38, size: 22, weight: 700, fill: MK.navy, anchor: 'middle' });
      T(g, 'tarif ' + r, { x, y: base + 66, size: 18, weight: 500, fill: MK.dim, anchor: 'middle' });
      const l = T(g, rp(v), { x, y: base - h - 18, size: 24, weight: 800, fill: col, anchor: 'middle' });
      put(l, { o: 0 }); show(l, t0 + .8, .3);
      show(g, t0, .2);
    });
    const c = G(p);
    mcard(c, 860, 240, 648, 210);
    tile(c, 'calc', 945, 345, { size: 96, v: 'gold' });
    T(c, 'Keduanya tetap', { x: 1020, y: 330, size: 22, weight: 600, fill: MK.dim });
    lines(c, 'dikreditkan dalam|SPT Tahunan PPh', 1020, 370, { size: 28, weight: 700 });
    popIn(c, m('kredit') - .1);
    const d = G(p);
    mcard(d, 860, 480, 648, 220, { fill: MK.navy });
    T(d, 'DAMPAKNYA: ARUS KAS', { x: 900, y: 530, size: 15, weight: 700, fill: '#D5E2F5' });
    T(d, rp(PPH_NON - PPH_API), { x: 900, y: 600, size: 44, weight: 800, fill: MK.gold });
    T(d, 'lebih banyak tertahan di muka', { x: 900, y: 650, size: 22, weight: 600, fill: '#fff' });
    popIn(d, m('kredit') + 4);
    source(p, 'Bahan Ajar PDRI KB 5.3 dan 5.7', m('api'));
  }],

  ['q2', 'Cek pemahaman', (m, D) => {
    const p = panel(0);
    paper(p);
    actionTitle(p, 'Cek pemahaman: apa sifat PPh Pasal 22|Impor?', { tag: 'CEK PEMAHAMAN', t0: .1 });
    [['shield', 'blue', 'Pemungut', 'DJBC dan bank devisa'], ['container', 'sky', 'Dasar', 'nilai impor'], ['question', 'gold', 'Sifat', '?']].forEach(([gl, v, n, sub], i) => {
      const c = G(p), y = 250 + i * 150;
      mcard(c, 92, y, 640, 126);
      tile(c, gl, 155, y + 62, { size: 76, v });
      T(c, n, { x: 210, y: y + 58, size: 28, weight: 700, fill: MK.navy });
      T(c, sub, { x: 210, y: y + 92, size: 20, weight: 500, fill: MK.dim });
      slideUp(c, .2 + i * .15);
    });
  }, { ask: done => quiz({ x: 790, y: 220, w: 730, cls: 'side' }, [{
    id: 'c-sifat', prompt: ['Apa sifat PPh Pasal 22 Impor bagi importir?'],
    build: choice([['Tidak final: dikreditkan dalam SPT Tahunan PPh'], ['Final: tidak dapat diperhitungkan lagi'], ['Dikreditkan dalam SPT Masa PPN'], ['Dikembalikan tunai oleh DJBC setelah barang terjual']], 0,
      'PPh Pasal 22 Impor tidak final. Importir memperhitungkannya sebagai kredit pajak dalam SPT Tahunan PPh.',
      [null, 'Menurut PMK 51 Tahun 2025, PPh Pasal 22 Impor tidak bersifat final.', 'Yang dikreditkan dalam SPT Masa PPN adalah PPN Impor. PPh Pasal 22 masuk SPT Tahunan PPh.', 'DJBC tidak mengembalikannya. Importir mengkreditkannya dalam SPT Tahunan.']),
  }], done) }],

  ['jawab', 'Jawaban untuk staf', (m, D) => {
    const p = panel(0);
    paper(p);
    actionTitle(p, 'Jawaban untuk staf: PPh Pasal 22 adalah cicilan,|yang terasa hanya arus kasnya', { tag: 'MENJAWAB PERTANYAAN KASUS 4' });
    const q = G(p);
    mcard(q, 92, 230, 500, 470);
    tile(q, 'chat', 175, 310, { size: 96, v: 'gold' });
    T(q, 'PERTANYAAN', { x: 245, y: 300, size: 16, weight: 700, fill: MK.dim });
    lines(q, '“Kain kami belum|terjual. Mengapa|PPh sudah dipungut|di pelabuhan?”', 132, 420, { size: 28, weight: 700, lh: 1.3 });
    slideUp(q, .4);
    [['a1', 'wallet', 'gold', 'Pembayaran di muka', 'atas PPh perusahaan tahun ini,|bukan pajak tambahan'],
     ['a2', 'calc', 'blue', `${rp(PPH_API)} dikreditkan`, 'dalam SPT Tahunan PPh'],
     ['a3', 'rate', 'sky', 'Yang terasa: arus kas', 'bukan beban pajak baru']].forEach(([mark, gl, v, n, sub], i) => {
      const y = 230 + i * 160, g = G(p);
      mcard(g, 640, y, 868, 140);
      tile(g, gl, 715, y + 70, { size: 80, v, floor: false });
      T(g, n, { x: 780, y: y + 62, size: 27, weight: 700, fill: MK.navy });
      lines(g, sub, 780, y + 96, { size: 19, weight: 500, fill: MK.dim });
      T(g, '0' + (i + 1), { x: 1470, y: y + 62, size: 30, weight: 700, fill: MK.line, anchor: 'end' });
      slideUp(g, m(mark) - .2, .5);
    });
    source(p, 'Bahan Ajar PDRI KB 5.7', m('a1'));
  }],

  ['wrap', 'Rangkuman', (m, D) => {
    const p = panel(0);
    navy(p, 9, D);
    actionTitle(p, 'Rangkuman: cicilan di muka, pilih tarif|berurutan, API soal arus kas', { tag: 'RANGKUMAN BAB 5', dark: true });
    [['w1', 'wallet', 'gold', 'PPh Pasal 22 Impor|adalah pembayaran|di muka dan tidak|bersifat final'],
     ['w2', 'search', 'blue', 'Cek lampiran PMK|51, lalu barang|khusus, lalu|status API'],
     ['w3', 'rate', 'sky', 'Tanpa API lebih|tinggi, tetapi tetap|dikreditkan: soal|arus kas']].forEach(([mark, gl, v, str], i) => {
      const x = 92 + i * 482, c = G(p);
      mcard(c, x, 250, 450, 450, { dark: true });
      const strip = mk('rect', { x, y: 250, width: 450, height: 12, rx: 6, fill: MK.gold, 'fill-opacity': 0 }, c);
      tile(c, gl, x + 90, 335, { size: 96, v });
      T(c, '0' + (i + 1), { x: x + 400, y: 320, size: 34, weight: 700, fill: MK.line, anchor: 'end' });
      lines(c, str, x + 40, 450, { size: 26, weight: 700, lh: 1.32 });
      put(c, { o: 0 }); tw(c, { o: .35 }, .3, .4);
      tw(c, { o: 1 }, m(mark), .4); pulse(c, m(mark), 1.03);
      prog(q => strip.setAttribute('fill-opacity', q), m(mark), .4, out);
    });
  }],

  ['final1', 'Latihan bab', (m) => { const p = panel(0); paper(p); }, { ask: done => quiz(SCREEN, [{
    id: 'p-pilih-tarif', prompt: ['Latihan 5.1. Pilih tarifmu: tentukan tarif PPh Pasal 22 Impor untuk setiap skenario.'],
    build: grid([
      { parts: ['PT A (API-U) mengimpor kain kapas'], ans: ['c'], why: 'Bukan barang khusus, importir ber-API: 2,5%.' },
      { parts: ['CV B (tanpa API) mengimpor kain kapas'], ans: ['d'], why: 'Tanpa API: 7,5%.' },
      { parts: ['PT C (API-P) mengimpor gandum untuk pabrik tepung'], ans: ['b'], why: 'Gandum, importir ber-API: 0,5%.' },
      { parts: ['PT D (API-U) mengimpor emas batangan'], ans: ['a'], why: 'Emas batangan: 0,25%.' },
    ], [['a', '0,25%', MK.gold, 'a'], ['b', '0,5%', MK.goldDark, 'b'], ['c', '2,5%', MK.blue, 'c'], ['d', '7,5%', MK.sky, 'd'], ['e', '10%', MK.navy, 'e']], { multi: false, text: true }),
  }, {
    id: 'p-pilih-tarif-2', prompt: ['Latihan 5.1 (lanjutan). Tentukan tarif untuk empat skenario berikutnya.'],
    build: grid([
      { parts: ['Barang tidak dikuasai yang dilelang DJBC'], ans: ['d'], why: 'Barang tidak dikuasai: 7,5% dari harga jual lelang.' },
      { parts: ['PT E (API-U) mengimpor barang di daftar 10% lampiran PMK 51/2025'], ans: ['e'], why: 'Lampiran diperiksa lebih dulu: 10%.' },
      { parts: ['PT F (API-U) mengimpor kedelai'], ans: ['b'], why: 'Kedelai, importir ber-API: 0,5%.' },
      { parts: ['PT G (tanpa API) mengimpor kedelai'], ans: ['d'], why: 'Tarif 0,5% untuk kedelai hanya bagi importir ber-API. Tanpa API: 7,5%.' },
    ], [['a', '0,25%', MK.gold, 'a'], ['b', '0,5%', MK.goldDark, 'b'], ['c', '2,5%', MK.blue, 'c'], ['d', '7,5%', MK.sky, 'd'], ['e', '10%', MK.navy, 'e']], { multi: false, text: true }),
  }, {
    id: 'p-pph-50rb', prompt: [`Latihan 5.2. Untuk varian 50.000 meter, nilai impornya ${rp(NI2)}. Importirnya memiliki API-U. Berapa PPh Pasal 22 Impornya?`],
    build: blanks([{ parts: ['2,5% × ' + rp(NI2) + ' = Rp', { box: idNum(PPH2) }],
      why: `2,5% × ${rp(NI2)} = ${rp(PPH2)}.`, hint: 'Kalikan nilai impor dengan 2,5%.' }]),
  }, {
    id: 'p-tanpa-api', prompt: ['Latihan 5.3. Seandainya PT Kain Prima Nusantara tidak memiliki API, apa yang berubah?'],
    build: choice([[`PPh Pasal 22 menjadi ${rp(PPH_NON)}, tetapi tetap dapat dikreditkan; yang terdampak arus kasnya`], ['PPh Pasal 22 menjadi final dan tidak dapat dikreditkan'], ['PPh Pasal 22 tidak dipungut sama sekali'], [`PPh Pasal 22 tetap ${rp(PPH_API)}`]], 0,
      `Tanpa API, tarifnya 7,5%: 7,5% × ${rp(NI)} = ${rp(PPH_NON)}. Tetap dapat dikreditkan, jadi dampaknya pada arus kas.`,
      [null, 'Status API mengubah tarif, bukan sifatnya. PPh Pasal 22 Impor tetap tidak final.', 'Tanpa API, PPh tetap dipungut, dengan tarif lebih tinggi.', 'Tarif 2,5% hanya untuk importir ber-API.']),
  }], done, 'Latihan bab') }],

  ['finish', 'Selesai', (m, D) => {
    const p = panel(0);
    paper(p);
    const left = G(p);
    path(left, 'M0 0H640L470 900H0Z', { fill: MK.navy });
    path(p, 'M640 0H700L530 900H470Z', { fill: MK.gold });
    path(p, 'M712 0H742L572 900H542Z', { fill: MK.sky });
    const md = G(p, { x: 300, y: 440 });
    const rays = G(md);
    for (let i = 0; i < 16; i++) path(rays, `M0 0L${-18} -260L18 -260Z`, { fill: MK.gold, 'fill-opacity': .12 }).setAttribute('transform', `rotate(${i * 22.5})`);
    clockRun(t => rays.setAttribute('transform', `rotate(${t * 8})`), D, { tail: true });
    tile(md, 'medal', 0, 0, { size: 190, v: 'gold' });
    popIn(md, .3);
    const orb = [['wallet', 'blue'], ['ship', 'sky'], ['calc', 'gold']].map(([gl, v], i) => {
      const e = tile(p, gl, 0, 0, { size: 64, v, floor: false });
      return { e, a: i * 2.094 };
    });
    clockRun(t => orb.forEach(o => put(o.e, { x: 300 + 190 * Math.cos(o.a + t * .4), y: 440 + 190 * Math.sin(o.a + t * .4) * .55 })), D, { tail: true });
    orb.forEach(o => { put(o.e, { o: 0 }); show(o.e, .8, .5); });
    const h = T(p, 'Selamat, Sobat Pemelajar!', { x: 1120, y: 200, size: 44, weight: 700, fill: MK.navy, anchor: 'middle' });
    slideUp(h, .5);
  }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

{
  const NAVY = new Set(['intro', 'ketentuan', 'alur', 'wrap']);
  BEATS.forEach((b, i) => {
    if (!i || b.lead === false) return;
    const prev = BEATS[i - 1];
    if (NAVY.has(b.id) !== NAVY.has(prev.id) || b.id === 'finish') {
      const run = b.run;
      b.run = (m, D) => { run(m, D); wipeIn(S.panel); };
    }
  });
}

mkBoot();
</script>
