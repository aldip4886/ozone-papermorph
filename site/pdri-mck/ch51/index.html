   Bab 5: the folder is ch51, the learner sees "KB 5". Kain belum laku, kok PPh sudah dipungut? The ways PPh is paid

// the cover and the finish card name this lesson "KB 5", not "Bab KB 5"
Object.assign(TRANSLATIONS.id, { chapterNumber: '{n}', chapterComplete: '{n} selesai', chapterPractice: 'Latihan' });

const paper = p => bgPaper(p);
const navy = (p, seed, D) => bgNavy(p, seed, D);
const okTick = (p, x, y, r = 20, col = MK.green) => {
  const ok = G(p, { x, y });
  mk('circle', { r, fill: col }, ok);
  path(ok, `M${-r * .45} ${r * .05}l${r * .3} ${r * .3}l${r * .6} ${-r * .6}`, { stroke: '#fff', 'stroke-width': r * .22, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  return ok;
};
const stamp = (p, x, y, top, bottom, t0, rot = -14) => {
  const st = G(p, { x, y });
  mk('circle', { r: 88, fill: 'none', stroke: MK.gold, 'stroke-width': 6 }, st);
  mk('circle', { r: 72, fill: 'none', stroke: MK.gold, 'stroke-width': 2 }, st);
  T(st, top, { y: -8, size: 22, weight: 800, fill: MK.gold, anchor: 'middle' });
  T(st, bottom, { y: 24, size: 18, weight: 700, fill: MK.gold, anchor: 'middle' });
  st.setAttribute('transform', `translate(${x} ${y}) rotate(${rot})`);
  const sw = wrap(st, x, y); put(sw, { s: 2, o: 0 }); tw(sw, { s: 1, o: 1 }, t0, .35, out);
  return sw;
};

// Kasus 1 (KB 5.6): kain tenunan kapas, pos 5208.21.00, API-U, 2,5% x nilai impor
const NI = 1528230000, PPH = NI * .025;                                 // 38.205.750

/* ---------- the boards of the drag-and-drop activities (dragBoard, mck.js) ---------- */
// storyboard 3: PPh 21, 22 Impor, 23 and 25 into pemotongan, pemungutan, angsuran sendiri
const SORT_CARDS = [['PPh 23', 'potong'], ['PPh 22 Impor', 'pungut'], ['PPh 25', 'angsur'], ['PPh 21', 'potong']];
const sortBoard = wrapEl => {
  wrapEl.style.setProperty('--cw', '300px'); wrapEl.style.setProperty('--ch', '52px');
  wrapEl.style.setProperty('--sw2', '300px'); wrapEl.style.setProperty('--sh2', '52px');
  const pool = h('div', 'ddpool'), cols = h('div', 'ddcols');
  const cards = SORT_CARDS.map(([lab, val]) => {
    const home = h('div', 'ddhome'), el = h('div', 'ddcard chip ' + (val === 'pungut' ? 'gold' : 'blue'), lab);
    home.append(el); pool.append(home);
    return { el, val };
  });
  const slots = [];
  [['potong', 'Pemotongan', 'pembayar penghasilan memotong', 2], ['pungut', 'Pemungutan', 'pihak yang ditunjuk memungut', 1], ['angsur', 'Angsuran sendiri', 'wajib pajak mengangsur sendiri', 1]].forEach(([want, n, sub, k]) => {
    const col = h('div', 'ddcol', [h('p', 'hd', n), h('p', 'sub', sub)]);
    for (let i = 0; i < k; i++) { const el = h('div', 'ddslot'); col.append(el); slots.push({ el, want, key: want + (k > 1 ? '-' + (i + 1) : '') }); }
    cols.append(col);
  });
  wrapEl.append(pool, cols);
  return { cards, slots };
};

// storyboard 9: Pilih Tarifmu, eight scenarios in a 4 x 2 grid
const SCEN = [['fabric', 'gold', 'Kain kapas, importir ber-API-U', '2,5%'], ['gem', 'sky', 'Emas batangan', '0,25%'],
   ['cart', 'blue', 'Kedelai, importir tanpa API', '7,5%'], ['doc', 'gold', 'Barang dalam Lampiran A', '10%'],
   ['cart', 'gold', 'Gandum, importir ber-API', '0,5%'], ['fabric', 'sky', 'Kain kapas, importir tanpa API', '7,5%'],
   ['doc', 'sky', 'Barang dalam Lampiran B', '7,5%'], ['cart', 'sky', 'Tepung terigu, importir ber-API', '0,5%']];
const RATES = ['7,5%', '0,25%', '2,5%', '10%', '0,5%', '7,5%', '0,5%', '7,5%'];
const rateBoard = wrapEl => {
  wrapEl.style.setProperty('--cw', '150px'); wrapEl.style.setProperty('--ch', '46px');
  wrapEl.style.setProperty('--sw2', '150px'); wrapEl.style.setProperty('--sh2', '48px');
  const steps = h('div', 'ddsteps', [h('span', '', '① Lampiran A atau B?'), h('span', 'ar', '→'), h('span', '', '② Emas batangan?'), h('span', 'ar', '→'), h('span', '', '③ Punya API?')]);
  const gridEl = h('div', 'ddgrid'), pool = h('div', 'ddpool');
  const slots = SCEN.map(([gl, v, lab, want], i) => {
    const el = h('div', 'ddslot');
    gridEl.append(h('div', 'ddsc', [glyphSvg(gl, v, 46), h('span', '', lab), el]));
    return { el, want, key: 'skenario-' + (i + 1) };
  });

    const home = h('div', 'ddhome'), el = h('div', 'ddcard chip gold', r);
    home.append(el); pool.append(home);
    return { el, val: r };
  });
  wrapEl.append(steps, gridEl, pool);

};

// storyboard 10: the five stages of the money, then the party or document of each

const PAIRS = [['a', 'Importir · PIB'], ['b', 'Importir dan bank devisa'], ['c', null], ['d', 'DJBC · pemungutan dan pelaporan'], ['e', 'Importir · SPT Tahunan']];
const PAIR_MIX = [3, 0, 4, 1];
const pairBoard = wrapEl => {

  wrapEl.style.setProperty('--sw2', '246px'); wrapEl.style.setProperty('--sh2', '62px');

  wrapEl.append(row, pool);
