     ['dengan', 'Dengan SKB', [[K1_PPN, MK.blue, 'PPN']], 620]].forEach(([mark, n, segs, x]) => {
      const g = G(p), t0 = m(mark) - .1;
      let y = base, tot = 0;
      segs.forEach(([v, col, lab], i) => {
        const h = v * K, yb = y, y1 = yb - h, r = mk('rect', { x: x - 95, y: yb, width: 190, height: 0, fill: col }, g);
        prog(q => { r.setAttribute('y', yb - h * q); r.setAttribute('height', h * q); }, t0 + i * .5, .6, out);
        T(g, lab, { x, y: y1 + h / 2 + 7, size: 19, weight: 700, fill: col === MK.gold ? MK.navy : '#fff', anchor: 'middle' });
        y = y1; tot += v;
      });
      T(g, n, { x, y: base + 38, size: 22, weight: 700, fill: MK.navy, anchor: 'middle' });
      const l = T(g, rp(tot), { x, y: y - 16, size: 24, weight: 800, fill: MK.navy, anchor: 'middle' });
      put(l, { o: 0 }); show(l, t0 + 1.2, .3);
    });
    const c = G(p);
    mcard(c, 930, 240, 578, 220);
    tile(c, 'doc', 1015, 350, { size: 96, v: 'gold' });
    T(c, 'PPh Pasal 22 tidak dipungut', { x: 1090, y: 330, size: 24, weight: 700, fill: MK.navy });
    T(c, rp(K1_PPH), { x: 1090, y: 380, size: 34, weight: 800, fill: MK.goldDark });
    popIn(c, m('dengan') + 1);
    const d = G(p);
    mcard(d, 930, 490, 578, 200, { fill: MK.navy });
    T(d, 'YANG TETAP DIBAYAR', { x: 970, y: 540, size: 15, weight: 700, fill: '#D5E2F5' });
    T(d, 'PPN Impor', { x: 970, y: 600, size: 26, weight: 600, fill: '#fff' });
    T(d, rp(K1_PPN), { x: 970, y: 655, size: 40, weight: 800, fill: MK.gold });
    popIn(d, m('dengan') + 2.2);
    source(p, 'Bahan Ajar PDRI KB 6.4; KMK 55/MK/EF.2/2026', m('tanpa'));
  }],

  ['q2', 'Cek pemahaman', (m, D) => {
    const p = panel(0);
    paper(p);
    actionTitle(p, 'Cek pemahaman: pajak masukan mana yang|masih dapat dikreditkan?', { tag: 'CEK PEMAHAMAN', t0: .1 });
    [['doc', 'gold', 'SKB PPh 22', 'PPh tidak dipungut'], ['hand', 'blue', 'PPN tidak dipungut', 'tetap terutang'], ['gift', 'sky', 'PPN dibebaskan', 'tidak terutang']].forEach(([gl, v, n, sub], i) => {
      const c = G(p), y = 250 + i * 150;
      mcard(c, 92, y, 560, 126);
      tile(c, gl, 155, y + 62, { size: 76, v });
      T(c, n, { x: 210, y: y + 58, size: 26, weight: 700, fill: MK.navy });
      T(c, sub, { x: 210, y: y + 92, size: 19, weight: 500, fill: MK.dim });
      slideUp(c, .2 + i * .15);
    });
  }, { ask: done => quiz({ x: 700, y: 220, w: 820, cls: 'side' }, [{
    id: 'c-kredit', prompt: ['Pajak masukan mana yang masih dapat dikreditkan?'],
    build: choice([['PPN yang tidak dipungut'], ['PPN yang dibebaskan'], ['PPnBM atas barang mewah'], ['PPN barang mewah yang dibebaskan']], 0,
      'Pada PPN tidak dipungut, PPN tetap terutang, jadi pajak masukannya masih dapat dikreditkan.',
      [null, 'Pada PPN dibebaskan, pajak masukannya tidak dapat dikreditkan.', 'PPnBM tidak dapat dikreditkan.', 'PPN yang dibebaskan, termasuk atas barang mewah, tidak dapat dikreditkan.']),
  }], done) }],

  ['jawab', 'Jawaban untuk Kasus 2', (m, D) => {
    const p = panel(0);
    paper(p);
    actionTitle(p, 'Jawaban: motor ini barang mewah, dan PPnBM|tidak dapat dikreditkan', { tag: 'MENJAWAB PERTANYAAN KASUS 2' });
    const q = G(p);
    mcard(q, 92, 230, 500, 470);
    tile(q, 'question', 175, 310, { size: 96, v: 'gold' });
    T(q, 'PERTANYAAN', { x: 245, y: 300, size: 16, weight: 700, fill: MK.dim });
    lines(q, 'Mengapa pungutan|satu motor bisa|lebih dari dua kali|nilai pabeannya?', 132, 420, { size: 28, weight: 700, lh: 1.3 });
    slideUp(q, .4);
    [['a1', 'gem', 'blue', 'PPN 12% penuh + PPnBM 95%', 'barang mewah: tanpa 11/12|dan ditambah PPnBM'],
     ['a2', 'hand', 'gold', `${rp(PPNBM)} tidak dikreditkan`, 'PPnBM benar-benar|menjadi beban'],
     ['a3', 'law', 'sky', 'Mengatur konsumsi barang mewah', 'fungsi regulerend dan|teori daya pikul']].forEach(([mark, gl, v, n, sub], i) => {
      const y = 230 + i * 160, g = G(p);
      mcard(g, 640, y, 868, 140);
      tile(g, gl, 715, y + 70, { size: 80, v, floor: false });
      T(g, n, { x: 780, y: y + 62, size: 27, weight: 700, fill: MK.navy });
      lines(g, sub, 780, y + 96, { size: 19, weight: 500, fill: MK.dim });
      T(g, '0' + (i + 1), { x: 1470, y: y + 62, size: 30, weight: 700, fill: MK.line, anchor: 'end' });
      slideUp(g, m(mark) - .2, .5);
    });
    source(p, 'Bahan Ajar PDRI KB 6.3', m('a1'));
  }],

  ['wrap', 'Rangkuman', (m, D) => {
    const p = panel(0);
    navy(p, 9, D);
    actionTitle(p, 'Rangkuman: PPN 12% penuh ditambah PPnBM,|dan fasilitas mengubah tagihan', { tag: 'RANGKUMAN BAB 6', dark: true });
    [['w1', 'gem', 'blue', 'PPN barang mewah|12% × nilai impor,|ditambah PPnBM|sesuai tarifnya'],
     ['w2', 'hand', 'gold', 'PPnBM tidak dapat|dikreditkan:|menjadi beban|importir'],
     ['w3', 'doc', 'sky', 'Fasilitas mengubah|jumlah yang dibayar:|periksa dokumen|sebelum menghitung']].forEach(([mark, gl, v, str], i) => {
      const x = 92 + i * 482, c = G(p);
      mcard(c, x, 250, 450, 450, { dark: true });
      const strip = mk('rect', { x, y: 250, width: 450, height: 12, rx: 6, fill: MK.gold, 'fill-opacity': 0 }, c);
      tile(c, gl, x + 90, 335, { size: 96, v });
      T(c, '0' + (i + 1), { x: x + 400, y: 320, size: 34, weight: 700, fill: MK.line, anchor: 'end' });
      lines(c, str, x + 40, 450, { size: 26, weight: 700, lh: 1.32 });
      put(c, { o: 0 }); tw(c, { o: .35 }, .3, .4);
      tw(c, { o: 1 }, m(mark), .4); pulse(c, m(mark), 1.03);
      prog(q => strip.setAttribute('fill-opacity', q), m(mark), .4, out);
    });
  }],

  ['final1', 'Latihan bab', (m) => { const p = panel(0); paper(p); }, { ask: done => quiz(SCREEN, [{
    id: 'p-temukan-salah', prompt: [`Latihan 6.1. Seorang petugas menghitung PPN motor Kasus 2: 12% × 11/12 × ${rp(NI)} = ${rp(SALAH)}. Motor ini barang mewah. Berapa PPN yang benar?`],
    build: blanks([{ parts: ['12% × ' + rp(NI) + ' = Rp', { box: idNum(PPN) }],
      why: `Barang mewah memakai nilai impor penuh: 12% × ${rp(NI)} = ${rp(PPN)}.`, hint: 'Barang mewah tidak memakai 11/12.' }]),
  }, {
    id: 'p-selisih', prompt: [`Latihan 6.2. Berapa selisih kurang pungut akibat kesalahan itu?`],
    build: blanks([{ parts: [rp(PPN) + ' − ' + rp(SALAH) + ' = Rp', { box: idNum(PPN - SALAH) }],
      why: `${rp(PPN)} − ${rp(SALAH)} = ${rp(PPN - SALAH)}.`, hint: 'Kurangkan PPN yang benar dengan hitungan petugas.' }]),
  }, {
    id: 'p-efek-skb', prompt: ['Latihan 6.3. Seandainya PT Kain Prima Nusantara memiliki SKB PPh Pasal 22 yang berlaku, berapa PDRI Kasus 1?'],
    build: choice([[`${rp(K1_PPN)}: hanya PPN Impor`], [`${rp(K1_PPN + K1_PPH)}: PPN dan PPh Pasal 22`], [`${rp(K1_PPH)}: hanya PPh Pasal 22`], ['Rp0: seluruh PDRI tidak dipungut']], 0,
      `SKB membuat PPh Pasal 22 tidak dipungut. Yang dibayar tinggal PPN Impor: ${rp(K1_PPN)}.`,
      [null, 'SKB PPh Pasal 22 menghapus PPh yang dipungut, jadi PPh tidak ikut dibayar.', 'SKB berlaku untuk PPh Pasal 22, bukan untuk PPN.', 'SKB tidak membebaskan PPN Impor.']),
  }], done, 'Latihan bab') }],

  ['finish', 'Selesai', (m, D) => {
    const p = panel(0);
    paper(p);
    const left = G(p);
    path(left, 'M0 0H640L470 900H0Z', { fill: MK.navy });
    path(p, 'M640 0H700L530 900H470Z', { fill: MK.gold });
    path(p, 'M712 0H742L572 900H542Z', { fill: MK.sky });
    const md = G(p, { x: 300, y: 440 });
    const rays = G(md);
    for (let i = 0; i < 16; i++) path(rays, `M0 0L${-18} -260L18 -260Z`, { fill: MK.gold, 'fill-opacity': .12 }).setAttribute('transform', `rotate(${i * 22.5})`);
    clockRun(t => rays.setAttribute('transform', `rotate(${t * 8})`), D, { tail: true });
    tile(md, 'medal', 0, 0, { size: 190, v: 'gold' });
    popIn(md, .3);
    const orb = [['gem', 'blue'], ['bike', 'sky'], ['doc', 'gold']].map(([gl, v], i) => {
      const e = tile(p, gl, 0, 0, { size: 64, v, floor: false });
      return { e, a: i * 2.094 };
    });
    clockRun(t => orb.forEach(o => put(o.e, { x: 300 + 190 * Math.cos(o.a + t * .4), y: 440 + 190 * Math.sin(o.a + t * .4) * .55 })), D, { tail: true });
    orb.forEach(o => { put(o.e, { o: 0 }); show(o.e, .8, .5); });
    const h = T(p, 'Selamat, Sobat Pemelajar!', { x: 1120, y: 200, size: 44, weight: 700, fill: MK.navy, anchor: 'middle' });
    slideUp(h, .5);
  }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

{
  const NAVY = new Set(['intro', 'ppnbm', 'wrap']);
  BEATS.forEach((b, i) => {
    if (!i || b.lead === false) return;
    const prev = BEATS[i - 1];
    if (NAVY.has(b.id) !== NAVY.has(prev.id) || b.id === 'finish') {
      const run = b.run;
      b.run = (m, D) => { run(m, D); wipeIn(S.panel); };
    }
  });
}

mkBoot();
</script>
