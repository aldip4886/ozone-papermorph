<script>
'use strict';
/* Bab 4 (KB 4): PPN Impor. The three traits of PPN, its object and subject, the 12% rate with the 11/12 base,
   the Kasus 1 calculation, output and input tax, the PIB as a tax invoice, and the PPN relay from port to buyer.
   McKinsey-style exhibits in the INSW design. */
const CHAPTER = { number: 4, title: 'Pajak Pertambahan Nilai Impor', minutes: 5, language: 'id' };

const paper = p => bgPaper(p);
const navy = (p, seed, D) => bgNavy(p, seed, D);
const cap = (p, str, x, y, { size = 21, weight = 600, fill = MK.navy, anchor = 'middle' } = {}) => T(p, str, { x, y, size, weight, fill, anchor });
const okTick = (p, x, y, r = 20, col = MK.green) => {
  const ok = G(p, { x, y });
  mk('circle', { r, fill: col }, ok);
  path(ok, `M${-r * .45} ${r * .05}l${r * .3} ${r * .3}l${r * .6} ${-r * .6}`, { stroke: '#fff', 'stroke-width': r * .22, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  return ok;
};
// Kasus 1 numbers (KB 4.6) and the simplified relay (KB 4.5)
const NI = 1528230000, DPP = NI * 11 / 12, PPN = DPP * .12;          // 1.400.877.500 and 168.105.300
const NI2 = 764115000, PPN2 = NI2 * 11 / 12 * .12;                    // 84.052.650
// the relay: [who, glyph, tile, sale, PK, PM, paid]; amounts in rupiah
const RELAY = [['Impor', 'ship', 'blue', 0, 0, 0, PPN], ['Importir → konveksi', 'fabric', 'gold', 1.8e9, 198e6, PPN, 198e6 - PPN],
  ['Konveksi → toko', 'factory', 'sky', 2.5e9, 275e6, 198e6, 77e6], ['Toko → pembeli', 'tag', 'gold', 3.2e9, 352e6, 275e6, 77e6]];
const jt = n => (n / 1e6).toFixed(1).replace('.', ',');

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'PPN Impor', (m, D) => {
    const p = panel(0);
    navy(p, 41, D);
    // the PPN in the middle, the chain from ship to buyer on a ring
    const ring = G(p, { x: 1130, y: 470 });
    mk('circle', { r: 250, fill: 'none', stroke: MK.sky, 'stroke-width': 3, 'stroke-opacity': .6, 'stroke-dasharray': '6 10' }, ring);
    path(ring, 'M-270 0A270 270 0 0 1 0 -270', { stroke: MK.gold, 'stroke-width': 14, 'stroke-linecap': 'round', fill: 'none' });
    path(ring, 'M270 0A270 270 0 0 1 0 270', { stroke: MK.gold, 'stroke-width': 14, 'stroke-linecap': 'round', fill: 'none' });
    clockRun(t => ring.setAttribute('transform', `translate(1130 470) rotate(${t * 6})`), D, { tail: true });
    const mid = G(p, { x: 1130, y: 470 });
    mk('circle', { r: 150, fill: '#fff' }, mid);
    tile(mid, 'percent', 0, -18, { size: 150, v: 'gold' });
    T(mid, 'PPN', { y: 92, size: 30, weight: 800, fill: MK.navy, anchor: 'middle' });
    popIn(mid, .3);
    [['ship', 'blue', 'Impor'], ['fabric', 'gold', 'Importir'], ['factory', 'sky', 'Konveksi'], ['tag', 'gold', 'Toko'], ['user', 'blue', 'Pembeli'], ['shield', 'sky', 'Kas negara']].forEach(([gl, v, n], k) => {
      const a = -Math.PI / 2 + k * Math.PI / 3, x = 1130 + 250 * Math.cos(a), y = 470 + 250 * Math.sin(a);
      const g = G(p);
      tile(g, gl, x, y, { size: 84, v, floor: false });
      pill(g, n, x, y + 60, { size: 16, bg: '#fff', ink: MK.navy });
      popIn(g, m('sub') + .3 + k * .22);
    });
    const tg = pill(p, 'BAB 4 · KEGIATAN BELAJAR 4', 92, 290, { size: 20, anchor: 'start' });
    slideUp(tg, .5);
    const t1 = T(p, 'Pajak Pertambahan', { x: 92, y: 392, size: 70, weight: 700, fill: '#fff' });
    const t2 = T(p, 'Nilai Impor', { x: 92, y: 474, size: 70, weight: 700, fill: MK.gold });
    slideUp(t1, .7); slideUp(t2, .85);
    const rule = mk('rect', { x: 92, y: 512, width: 0, height: 6, rx: 3, fill: MK.gold }, p);
    prog(q => rule.setAttribute('width', 120 * q), 1.2, .5, out);
    const sub = G(p);
    lines(sub, 'Cara menghitungnya, dan ke mana|PPN mengalir setelah dibayar', 92, 572, { size: 30, weight: 500, fill: '#D5E2F5' });
    slideUp(sub, m('sub'));
  }],

  ['ask', 'PPN yang sudah dibayar', (m, D) => {
    const p = panel(0);

    actionTitle(p, 'PPN Impor yang sudah dibayar tidak hilang;|kuncinya ada pada cara kerja PPN', { tag: 'PERTANYAAN KASUS 3' });

    lines(q, '“PPN Rp168 juta ini|hilang begitu saja?”', 245, 340, { size: 27, weight: 700 });
    mk('rect', { x: 122, y: 400, width: 560, height: 2, fill: MK.line }, q);
    slideUp(q, .4);
    const amt = G(p);
    tile(amt, 'wallet', 175, 500, { size: 96, v: 'blue' });
    T(amt, 'PPN IMPOR DIBAYAR DI PELABUHAN', { x: 245, y: 482, size: 15, weight: 700, fill: MK.dim });
    T(amt, rp(PPN), { x: 245, y: 530, size: 40, weight: 800, fill: MK.navy });
    T(amt, 'Kasus 1, kain poliester 100.000 meter', { x: 122, y: 650, size: 19, weight: 600, fill: MK.navy });
    slideUp(amt, m('ask') + .2);

    T(a, 'Tidak.', { x: 810, y: 400, size: 84, weight: 800, fill: MK.gold });
    show(a, m('ans') - .2, .4);
    const k = G(p);
    T(k, 'UNTUK MENJELASKANNYA, KENALI DULU', { x: 810, y: 480, size: 15, weight: 700, fill: '#D5E2F5' });

      const x = 870 + i * 225, g = G(k);

      popIn(g, m('ans') + 1.6 + i * .3);

    show(k, m('ans') + 1.3, .4);
    source(p, 'Bahan Ajar PDRI, Kasus yang Dipakai dan KB 4', m('ans') + 1);
  }],

  ['ciri', 'Tiga ciri PPN', (m, D) => {

    mk('rect', { x: 92, y: 565, width: 10, height: 135, rx: 5, fill: MK.gold }, d);
    tile(d, 'idcard', 175, 632, { size: 76, v: 'gold', floor: false });
    T(d, 'PKP · Pengusaha Kena Pajak', { x: 240, y: 620, size: 26, weight: 700, fill: MK.navy });

    slideUp(h, m('hpp'));

     ['lux', 'gem', 'sky', 'Barang mewah', 'yang dikenai PPnBM', '12% × nilai impor', 12, MK.goldDark]].forEach(([mark, gl, v, n, sub, f, eff, col], i) => {
      const x = 92 + i * 726, c = G(p);
      mcard(c, x, 300, 690, 400);
      mk('rect', { x, y: 300, width: 690, height: 12, rx: 6, fill: col }, c);
      tile(c, gl, x + 80, 390, { size: 88, v });
      T(c, n, { x: x + 145, y: 385, size: 28, weight: 700, fill: MK.navy });
      T(c, sub, { x: x + 145, y: 418, size: 18, weight: 500, fill: MK.dim });
      T(c, 'RUMUS', { x: x + 40, y: 480, size: 14, weight: 700, fill: MK.dim });
      T(c, f, { x: x + 40, y: 522, size: 30, weight: 700, fill: MK.navy });
      T(c, 'BEBAN EFEKTIF', { x: x + 40, y: 585, size: 14, weight: 700, fill: MK.dim });
      mk('rect', { x: x + 40, y: 605, width: 480, height: 44, rx: 8, fill: '#EEF2F8' }, c);
      const bar = mk('rect', { x: x + 40, y: 605, width: 0, height: 44, rx: 8, fill: col }, c);
      const lab = T(c, eff + '%', { x: x + 540, y: 640, size: 40, weight: 800, fill: col });

      put(lab, { o: 0 }); show(lab, m(mark) + 1.2, .3);
      prog(q => bar.setAttribute('width', 480 * eff / 12 * q), m(mark) + .5, .9, out);
    });
    const note = pill(p, 'Masih berlaku saat bahan ajar disusun (10 September 2026)', 860, 752, { size: 16, anchor: 'start', bg: '#EEF2F8', ink: MK.navy });
    popIn(note, m('note'));
    source(p, 'Bahan Ajar PDRI KB 4.3', m('hpp'));
  }],

  ['q1', 'Cek pemahaman', (m, D) => {
    const p = panel(0);
    paper(p);
    actionTitle(p, 'Cek pemahaman: berapa beban efektif|PPN Impor atas kain kita?', { tag: 'CEK PEMAHAMAN', t0: .1 });
    [['fabric', 'gold', 'Kain poliester', 'bukan barang mewah'], ['user', 'blue', 'Importir', 'berstatus PKP'], ['percent', 'sky', 'Tarif PPN', '12% menurut UU HPP']].forEach(([gl, v, n, sub], i) => {
      const c = G(p), y = 250 + i * 150;
      mcard(c, 92, y, 640, 126);
      tile(c, gl, 155, y + 62, { size: 76, v });
      T(c, n, { x: 210, y: y + 58, size: 28, weight: 700, fill: MK.navy });
      T(c, sub, { x: 210, y: y + 92, size: 20, weight: 500, fill: MK.dim });
      slideUp(c, .2 + i * .15);

  }, { ask: done => quiz({ x: 790, y: 220, w: 730, cls: 'side' }, [{
    id: 'c-efektif', prompt: ['Berapa beban efektif PPN Impor atas kain PT Kain Prima Nusantara?'],
    build: choice([['11% dari nilai impor'], ['12% dari nilai impor'], ['10% dari nilai impor'], ['0%, karena importirnya PKP']], 0,
      'Kain tidak tergolong mewah, jadi DPP-nya 11/12 dari nilai impor: 12% × 11/12 = 11%.',
      [null, '12% penuh hanya untuk barang mewah yang dikenai PPnBM.', 'Tarifnya 12% dengan DPP 11/12, jadi bebannya 11%, bukan 10%.', 'Status PKP tidak membebaskan PPN Impor. PKP justru dapat mengkreditkannya nanti.']),
  }], done) }],

    const p = panel(0);
    paper(p);
    actionTitle(p, `PPN Impor Kasus 1 sebesar ${rp(PPN)}`, { tag: 'MENGHITUNG PPN IMPOR · KASUS 1' });
    const c = G(p);
    mcard(c, 92, 230, 600, 230);

    show(f, m('cek') - .2, .4);
    const dpp = G(p);
    T(dpp, 'DPP', { x: 780, y: 345, size: 22, weight: 700, fill: MK.dim });

    T(res, 'PPN Impor', { x: 815, y: 628, size: 24, weight: 600, fill: '#D5E2F5' });

  ['pkpm', 'Pajak keluaran dan pajak masukan', (m, D) => {
