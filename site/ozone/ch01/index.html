<script>
'use strict';
const CHAPTER = { number: 1, title: 'Introduction to Ozone Depletion', minutes: 8, language: 'en', next: '../ch02/' };

/* ---------- chapter drawing helpers ---------- */
const lbl = (p, str, x, y, t0, o = {}) => { const e = ozLabel(p, str, x, y, o); show(e, t0); return e; };
const tag = (p, str, x, y, colr, t0, o = {}) => { const e = ozTag(p, str, x, y, colr, o); tw(e, { o: 1 }, t0, .4); return e; };
// the ozone layer as a horizontal band across the stage (sunscreen, ground)
function ozoneBand(p, y0, y1, { x0 = 0, x1 = 1600, o = 1 } = {}) {
  const g = G(p, { o });
  mk('rect', { x: x0, y: y0, width: x1 - x0, height: y1 - y0, fill: OZ.ozone, opacity: .16 }, g);
  mk('rect', { x: x0, y: (y0 + y1) / 2 - (y1 - y0) * .22, width: x1 - x0, height: (y1 - y0) * .44, fill: OZ.ozone, opacity: .14 }, g);
  let seed = 3, d = ''; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  for (let i = 0; i < (x1 - x0) / 12; i++) { const dx = x0 + rnd() * (x1 - x0), dy = y0 + 6 + rnd() * (y1 - y0 - 12); d += `M${dx.toFixed(1)} ${dy.toFixed(1)}m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0`; }
  ozBob(path(g, d, { fill: OZ.ozone, 'fill-opacity': .7, 'stroke-opacity': .7 }), { amp: 8, per: 7, key: 'x' });
  return g;
}
// the atmosphere as laid out in 'layers' and 'q1' (one place, so the quick check shows the same picture)
const ATM = { x: 260, y: 80, w: 740, h: 700, top: 60 };

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Introduction to ozone depletion', (m, D) => {
    const p = panel(0);
    // Earth's limb at the bottom, the ozone layer a thin glowing shell around it
    const earth = G(p, { o: 0, y: 40 });
    mk('circle', { cx: 800, cy: 2150, r: 1520, fill: OZ.ozone, opacity: .10 }, earth);
    mk('circle', { cx: 800, cy: 2150, r: 1490, fill: OZ.ozone, opacity: .16 }, earth);
    mk('circle', { cx: 800, cy: 2150, r: 1450, fill: OZ.sea }, earth);
    path(earth, 'M380 760C470 720 560 712 640 724C700 700 780 702 820 716C900 700 1010 706 1080 730L1130 900H330Z', { fill: OZ.land, 'fill-opacity': .9, 'stroke-opacity': .9 });
    tw(earth, { o: 1, y: 0 }, .1, 1.4, out);
    sun(p, 1380, 150, 56, 1);
    const g = G(p, { o: 0, y: 20 });
    T(g, 'Lesson 1', { x: 800, y: 260, size: 30, fill: OZ.dim, anchor: 'middle', weight: 600 });
    T(g, 'Introduction to Ozone Depletion', { x: 800, y: 350, size: 76, weight: 700, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = G(p, { o: 0 });
    T(sub, 'what the ozone layer is · how it gets damaged · why it matters', { x: 800, y: 440, size: 32, fill: OZ.ozone, anchor: 'middle', weight: 550 });
    show(sub, m('sub'), .8);
  }],

  ['layers', 'Where ozone is', (m) => {
    const p = panel(0);
    const A = atmosphere(p, ATM);
    tw(A.space, { o: .6 }, .2, .6);
    const lx = ATM.x + ATM.w + 40;
    show(A.tropo, m('tropo'), .7);
    lbl(p, 'Troposphere', lx, A.yAt(7), m('tropo', .2), { size: 34 });
    lbl(p, 'from the ground to about 10–15 km', lx, A.yAt(7) + 36, m('tropo', .5), { size: 24, fill: OZ.dim, weight: 500 });
    show(A.strato, m('strato'), .7);
    lbl(p, 'Stratosphere', lx, A.yAt(46), m('strato', .2), { size: 34 });
    lbl(p, 'up to about 50 km', lx, A.yAt(46) + 36, m('strato', .5), { size: 24, fill: OZ.dim, weight: 500 });
    show(A.band, m('band'), .9);
    lbl(p, 'The ozone layer', lx, A.yAt(26), m('band', .3), { size: 36, fill: OZ.ozone, weight: 700 });
    lbl(p, 'about 15–35 km', lx, A.yAt(26) + 38, m('band', .6), { size: 24, fill: OZ.dim, weight: 500 });
    const n90 = G(p, { x: ATM.x + ATM.w / 2, y: A.yAt(25) + 20, o: 0, s: .6 });
    mk('rect', { x: -140, y: -52, width: 280, height: 76, rx: 38, fill: 'rgba(8,16,36,.78)' }, n90);
    T(n90, '≈ 90 % of ozone', { y: 0, size: 36, fill: OZ.ozone, anchor: 'middle', weight: 750 });
    pop(n90, m('ninety'));
    const n10 = G(p, { x: ATM.x + ATM.w / 2, y: A.yAt(5) + 18, o: 0, s: .6 });
    mk('rect', { x: -120, y: -46, width: 240, height: 66, rx: 33, fill: 'rgba(8,16,36,.7)' }, n10);
    T(n10, '≈ 10 %', { y: 0, size: 32, fill: OZ.oxygen, anchor: 'middle', weight: 700 });
    pop(n10, m('ten'));
  }],

  ['molecule', 'The ozone molecule', (m) => {
    const p = panel(0);
    sun(p, 150, 120, 50, 1);
    const a = O2(p, 520, 430, { o: 0 }); put(a, { s: 1.6 });
    const b = O2(p, 1080, 430, { o: 0 }); put(b, { s: 1.6 });
    show(a, m('o2'), .5); show(b, m('o2', .4), .5);
    const la = lbl(p, 'O₂ · oxygen', 520, 540, m('o2', .2), { size: 30, fill: OZ.oxygen, anchor: 'middle' });
    const lb = lbl(p, 'O₂', 1080, 540, m('o2', .6), { size: 30, fill: OZ.oxygen, anchor: 'middle' });
    hide(lb, m('o3'), .3);
    // UV splits the left pair
    const R = uvRay(p, 'C', 520, 130, 368, { label: false });
    const uvt = lbl(p, 'ultraviolet light', 545, 170, m('split', -.2), { size: 24, fill: OZ.uvB, weight: 600 });
    draw(R.ray, m('split', -.3), .6, lin);
    tw(R.burst, { o: 1, s: 1 }, m('split', .3), .25, back); hide(R.burst, m('split', .9), .4); hide(R.ray, m('split', .9), .4);
    hide(a.bond, m('split', .3), .2);
    tw(a.a, { x: -80 }, m('split', .3), .7, out); tw(a.b, { x: 80 }, m('split', .3), .7, out);
    hide(la, m('split', .3), .3);
    const lOO = lbl(p, 'O + O', 520, 540, m('split', .6), { size: 30, fill: OZ.oxygen, anchor: 'middle' });
    hide(lOO, m('join'), .3);
    lbl(p, 'O', 392, 540, m('join', .4), { size: 30, fill: OZ.oxygen, anchor: 'middle' });
    // one atom joins the other pair: a free copy takes its place, flies over, and the trio forms
    const fly = atom(p, 'O', 520 + 80 * 1.6, 430, { o: 0, s: 1.6 });
    tw(fly, { o: 1 }, m('join', -.05), .05); tw(a.b, { o: 0 }, m('join'), .05);
    tw(fly, { x: 1154, y: 459 }, m('join'), 1.1, io);
    const o3 = O3(p, 1080, 430, { o: 0 }); put(o3, { s: 1.6 });
    tw(fly, { o: 0 }, m('o3'), .3); tw(b, { o: 0 }, m('o3'), .3); tw(o3, { o: 1 }, m('o3'), .3);
    tw(o3, { s: 1.8 }, m('o3', .3), .22, out); tw(o3, { s: 1.6 }, m('o3', .52), .4);
    lbl(p, 'O₃ · ozone', 1080, 540, m('o3', .2), { size: 40, fill: OZ.ozone, anchor: 'middle', weight: 750 });
    hide(uvt, m('join'), .4);
    // the two steps, written out under the picture
    lbl(p, 'O₂ + UV light  →  O + O', 800, 680, m('split', 1), { size: 34, fill: OZ.ink, anchor: 'middle', weight: 600 });
    lbl(p, 'O + O₂  →  O₃', 800, 740, m('o3', .5), { size: 34, fill: OZ.ozone, anchor: 'middle', weight: 650 });
  }],

  ['sunscreen', 'Our planet’s sunscreen', (m) => {
    const p = panel(0);
    sun(p, 110, 90, 54, 1);
    const band = ozoneBand(p, 230, 330, { o: 0 }); show(band, .2, .6);
    lbl(p, 'ozone layer', 30, 220, .4, { size: 26, fill: OZ.ozone, weight: 650 });
    // the ground
    mk('rect', { x: 0, y: 560, width: 1600, height: 30, fill: OZ.ground }, p);
    path(p, 'M0 560H1600', { stroke: OZ.good, 'stroke-width': 3, 'fill-opacity': .6, 'stroke-opacity': .6 });
    lbl(p, 'the ground', 30, 548, .4, { size: 22, fill: OZ.dim, weight: 500 });
    // three kinds of UV
    const C = uvRay(p, 'C', 470, 120, 262);
    const B1 = uvRay(p, 'B', 780, 120, 292, { label: false }), B2 = uvRay(p, 'B', 860, 120, 312), B3 = uvRay(p, 'B', 700, 120, 548, { label: false, width: 3.5 });
    const Aa = uvRay(p, 'A', 1190, 120, 548);
    const t0 = m('rays');
    for (const [i, R] of [C, B2, Aa].entries()) { if (R.label) show(R.label, t0 + i * .2, .4); }
    playRay(C, m('uvc'), .8, true);
    lbl(p, 'stopped completely', 470, 400, m('uvc', .8), { size: 24, fill: OZ.uvC, anchor: 'middle' });
    playRay(B1, m('uvb'), .9, true); playRay(B2, m('uvb', .1), .9, true); playRay(B3, m('uvb', .25), 1.8, false);
    lbl(p, 'mostly absorbed', 822, 400, m('uvb', 1), { size: 24, fill: OZ.uvB, anchor: 'middle' });
    lbl(p, 'some gets through', 718, 520, m('uvb', 1.8), { size: 20, fill: OZ.uvB, anchor: 'start', weight: 500 });
    playRay(Aa, m('uva'), 1.8, false);
    lbl(p, 'passes almost freely', 1214, 400, m('uva', 1), { size: 24, fill: OZ.uvA, anchor: 'start' });
    const sh = tag(p, '“our planet’s sunscreen”', 1380, 280, OZ.ozone, m('shield'), { size: 28 });
    pulse(band, m('shield', .2), 1.02);
    // what more UV-B would do
    const harms = [['skin', 'skin cancer', 'harm'], ['eye', 'cataracts', 'harm'], ['shield', 'weaker immunity', 'harm'], ['plankton', 'plankton', 'sea'], ['fish', 'young fish', 'sea'], ['bottle', 'plastics wear out', 'plastic']];
    harms.forEach(([icon, name, mark], i) => {
      const x = 170 + i * 250, t = m(mark, (i % 3) * .35 * (mark === 'harm' ? 1 : .6));
      const ic = ozIcon(p, icon, x, 670, { s: .7, colr: OZ.bad || '#ff8a6b' });
      tw(ic, { o: 1 }, t, .4);
      lbl(p, name, x, 750, t + .15, { size: 24, fill: OZ.ink, anchor: 'middle', weight: 550 });
    });
  }],

  ['ground', 'Ozone near the ground', (m) => {
    const p = panel(0);
    // top: the ozone layer, far up
    const band = ozoneBand(p, 70, 170, { o: 0 }); show(band, .2, .6);
    const up = O3(p, 800, 120, { o: 0 }); show(up, .4, .5);
    lbl(p, 'ozone layer, 15–35 km up', 40, 210, .5, { size: 24, fill: OZ.ozone, weight: 600 });
    path(p, 'M0 260H1600', { stroke: OZ.faint, 'stroke-width': 2, 'stroke-dasharray': '10 12' });
    // bottom: a city
    skyline(p, 0, 720, 1600);
    mk('rect', { x: 0, y: 720, width: 1600, height: 40, fill: OZ.ground }, p);
    const low = O3(p, 800, 470, { o: 0 });
    tw(low, { o: 1 }, m('same'), .5);
    const sameArrow = path(p, 'M800 190V400', { stroke: OZ.dim, 'stroke-width': 3, 'stroke-dasharray': '6 10' }, { d: 0 });
    draw(sameArrow, m('same', .1), .8);
    lbl(p, 'the same molecule: O₃', 830, 300, m('same', .5), { size: 28, fill: OZ.ink, weight: 650 });
    // cars and industry release NOx and VOCs
    const cars = [[260, 690], [430, 700], [1180, 694]].map(([x, y]) => ozIcon(p, 'car', x, y, { s: .9, colr: OZ.dim }));
    cars.forEach((c, i) => tw(c, { o: 1 }, m('cars', i * .15), .4));
    const fac = ozIcon(p, 'factory', 1420, 668, { s: 1, colr: OZ.dim }); tw(fac, { o: 1 }, m('cars', .3), .4);
    tag(p, 'NOₓ', 330, 600, OZ.smog, m('cars', 1.2), { size: 26 });
    tag(p, 'VOCs', 1300, 590, OZ.smog, m('cars', 1.6), { size: 26 });
    const s2 = sun(p, 1480, 360, 40, 0); show(s2, m('sun'), .6);
    lbl(p, '+ sunlight  →  O₃ near the ground', 800, 560, m('sun', .4), { size: 30, fill: OZ.ink, anchor: 'middle', weight: 650 });
    // smog
    const haze = mk('rect', { x: 0, y: 380, width: 1600, height: 340, fill: OZ.smog }, p);
    put(haze, { o: 0 }); tw(haze, { o: .22 }, m('smog'), 1.2);
    const lungs = ozIcon(p, 'lungs', 140, 470, { s: .8, colr: '#ff8a6b' }); tw(lungs, { o: 1 }, m('smog', .6), .4);
    lbl(p, 'smog · hard on the lungs', 210, 480, m('smog', .8), { size: 26, fill: '#ffb39b', weight: 650 });
    // the rule
    tag(p, 'High up: ozone protects us', 1180, 120, OZ.ozone, m('rule'), { size: 28 });
    tag(p, 'Down here: ozone harms us', 1240, 470, '#ff8a6b', m('rule', 1.6), { size: 28 });
  }],

  ['q1', 'Quick check', () => {
    const p = panel(0);
    const A = atmosphere(p, ATM);
    put(A.tropo, { o: 1 }); put(A.strato, { o: 1 }); put(A.band, { o: 1 }); put(A.space, { o: .6 });
    S.q1 = A;
  }, { ask: done => {
    const A = S.q1, x = ATM.x, w = ATM.w;
    quiz({ x: 1080, y: 150, w: 470, cls: 'side' }, [{
      id: 'c-where', prompt: ['Click the part of the atmosphere that holds most of Earth’s ozone.'],
      build: pickEls([
        { el: A.space, box: [x, A.yAt(60), w, A.yAt(50) - A.yAt(60)], label: 'above 50 km' },
        { el: A.band, box: [x, A.yAt(35), w, A.yAt(15) - A.yAt(35)], label: 'the band between 15 and 35 km' },
        { el: A.tropo, box: [x, A.yAt(12), w, A.yAt(0) - A.yAt(12)], label: 'the troposphere, near the ground' },
      ], 1, 'Right. About 90 % of ozone sits in the stratosphere, most of it in this band between about 15 and 35 km: the ozone layer.',
      i => i === 0 ? 'Above 50 km the air is too thin. Look lower, in the stratosphere.' : 'Only about 10 % of ozone is down here, near the ground. Look higher.'),
    }], done);
  } }],

  ['hole', 'The ozone hole', (m) => {
    const p = panel(0);
    const gl = globe(p, 430, 450, 300, { o: 0 }); show(gl, .2, .6);
    clockRun(t => put(gl, { r: -t * 2.5 }), 0, { tail: true });   // Earth turns slowly about the pole
    lbl(p, 'Antarctica, seen from above the South Pole', 430, 815, .5, { size: 22, fill: OZ.dim, anchor: 'middle', weight: 500 });
    // a short timeline over the right half
    const L = timeline(p, { x0: 860, x1: 1540, y: 200, from: 1970, to: 2000, ticks: 10,
      pins: [{ year: 1974, label: 'first warnings', up: true }, { year: 1985, label: 'hole found', up: true }] });
    draw(L.line, .3, .8); show(L.ticks, .5, .4);
    tw(L.pins[0].g, { o: 1 }, .9, .5);
    tw(L.pins[1].g, { o: 1 }, m('found'), .5);
    // the hole appears, then grows (illustrative sizes)
    tw(gl.hole, { s: .45 }, m('found', .3), 1, out);
    const yr = lbl(p, '', 740, 300, m('grow'), { size: 34, fill: OZ.ods, anchor: 'middle', weight: 750 });
    prog(q => { yr.textContent = String(Math.round(1985 + q * 15)); }, m('grow'), 2.6, lin);
    tw(gl.hole, { s: 1 }, m('grow'), 2.6, io);
    hide(yr, m('du'), .4);
    // Dobson units: a column of air's ozone squeezed into a thin layer
    const col = mk('rect', { x: 930, y: 300, width: 120, height: 340, rx: 10, fill: OZ.ozone }, p);
    put(col, { o: 0, a_y: 300, a_height: 340 });
    tw(col, { o: .45 }, m('du'), .5);
    const colL = lbl(p, 'all the ozone above one spot', 990, 280, m('du', .2), { size: 22, fill: OZ.dim, anchor: 'middle', weight: 500 });
    tw(col, { a_y: 628, a_height: 12, o: .95 }, m('du', 2.6), 1.4, io);
    hide(colL, m('du', 2.6), .4);
    const gr = path(p, 'M880 640H1100', { stroke: OZ.ground, 'stroke-width': 10 }, { o: 0 }); show(gr, m('du'), .4);
    lbl(p, 'squeezed to the ground', 990, 680, m('du', 3.2), { size: 22, fill: OZ.dim, anchor: 'middle', weight: 500 });
    tag(p, '1 Dobson unit (DU) = 0.01 mm', 925, 750, OZ.ozone, m('du', 4.6), { size: 22 });
    // the 220 DU threshold on a gauge
    const gx = 1330, gy = yDU => 660 - (yDU - 100) / 400 * 380;
    const gauge = G(p, { o: 0 });
    path(gauge, `M${gx} ${gy(100)}V${gy(500)}`, { stroke: OZ.dim, 'stroke-width': 3 });
    for (const v of [100, 200, 300, 400, 500]) {
      path(gauge, `M${gx - 8} ${gy(v)}H${gx + 8}`, { stroke: OZ.dim, 'stroke-width': 3 });
      T(gauge, String(v), { x: gx + 18, y: gy(v) + 8, size: 22, fill: OZ.dim, weight: 500 });
    }
    T(gauge, 'DU', { x: gx, y: gy(500) - 18, size: 22, fill: OZ.dim, anchor: 'middle', weight: 650 });
    mk('rect', { x: gx - 14, y: gy(220), width: 28, height: gy(100) - gy(220), fill: OZ.ods, opacity: .35 }, gauge);
    show(gauge, m('line'), .5);
    const thr = G(p, { o: 0 });
    path(thr, `M${gx - 70} ${gy(220)}H${gx + 70}`, { stroke: OZ.ods, 'stroke-width': 4, 'stroke-dasharray': '10 6' });
    T(thr, '220', { x: gx - 80, y: gy(220) + 9, size: 28, fill: OZ.ods, anchor: 'end', weight: 750 });
    show(thr, m('line', .4), .5);
    lbl(p, 'never lower before 1979', gx - 80, gy(220) - 26, m('line', 1.6), { size: 20, fill: OZ.dim, anchor: 'end', weight: 500 });
    tag(p, 'below 220 DU  =  the ozone hole', 1370, 750, OZ.ods, m('def'), { size: 26 });
    pulse(gl.hole, m('def', .2), 1.06);
  }],

  ['poles', 'Why over the poles', (m) => {
    const p = panel(0);
    const gl = globe(p, 470, 450, 320, { o: 0 }); show(gl, .2, .6);
    put(gl.hole, { s: 0 });
    // the vortex spins for the rest of the beat
    show(gl.vortex, m('vortex'), .6);
    clockRun(t => { put(gl.vortex, { r: t * 22 }); }, m('arctic', 4), { tail: true });
    const steps = [
      ['vortex', '1', 'A polar vortex locks in the cold', OZ.ink],
      ['clouds', '2', 'Polar stratospheric clouds form', '#f2b6e6'],
      ['react', '3', 'Chlorine and bromine turn reactive', OZ.ods],
      ['spring', '4', 'Spring sunlight: ozone is destroyed', OZ.law],
    ];
    steps.forEach(([mark, n, str, colr], i) => {
      const g = G(p, { x: 940, y: 210 + i * 110, o: 0 });
      mk('circle', { cx: 22, cy: -10, r: 24, fill: colr }, g);
      T(g, n, { x: 22, y: 0, size: 26, fill: '#0b1730', anchor: 'middle', weight: 800 });
      T(g, str, { x: 64, y: 0, size: 30, fill: OZ.ink, weight: 600 });
      tw(g, { o: 1 }, m(mark, .2), .5);
    });
    tw(gl.clouds, { o: 1 }, m('clouds'), 1);
    const reactive = [[-90, -60, 'Cl'], [60, -80, 'Cl'], [-20, 70, 'Br'], [100, 40, 'Cl']].map(([dx, dy, k]) => atom(p, k, 470 + dx, 450 + dy, { o: 0, s: .5, eyes: true }));
    reactive.forEach((a, i) => pop(a, m('react', .3 + i * .2)));
    const s2 = sun(p, 860, 120, 46, 0);
    tw(s2, { o: 1, x: 820, y: 150 }, m('spring'), 1);
    tw(gl.hole, { s: 1 }, m('spring', .5), 2.4, io);
    reactive.forEach((a, i) => pulse(a, m('spring', .6 + i * .15), 1.25));
    // the Arctic too
    const arc = G(p, { x: 1000, y: 690, o: 0 });
    mk('circle', { r: 64, fill: OZ.sea }, arc);
    mk('circle', { r: 30, fill: OZ.ice }, arc);
    mk('circle', { r: 26, fill: OZ.ods, opacity: .45 }, arc);
    show(arc, m('arctic'), .5);
    lbl(p, 'The Arctic too:', 1086, 680, m('arctic', .2), { size: 28, fill: OZ.ink, weight: 650 });
    lbl(p, 'serious losses in 2011 and 2020', 1086, 718, m('arctic', .5), { size: 26, fill: OZ.dim, weight: 500 });
  }],

  ['uses', 'Where the chemicals came from', (m) => {
    const p = panel(0);
    const c = CFC(p, 300, 470, { o: 0, s: 1.2 });
    tw(c, { o: 1, s: 1.5 }, m('cfc'), .5, back);
    lbl(p, 'CFC-11 · a chlorofluorocarbon', 300, 640, m('cfc', .3), { size: 26, fill: OZ.ods, anchor: 'middle', weight: 650 });
    const tiles = [
      ['fridge', [['fridge', -50], ['ac', 60]], 'Fridges and air conditioners'],
      ['foam', [['foam', -50], ['shoe', 60]], 'Foams: insulation, mattresses, shoe soles'],
      ['spray', [['spray', -80], ['inhaler', 0], ['extinguisher', 80]], 'Sprays, inhalers, fire extinguishers'],
      ['farm', [['farm', 0]], 'Fumigants in agriculture'],
    ];
    tiles.forEach(([mark, icons, str], i) => {
      const x = 880 + (i % 2) * 380, y = 260 + Math.floor(i / 2) * 270;

  ['chain', 'The chain reaction', (m) => {
    const p = panel(0);
    const c = CFC(p, 200, 420, { o: 0 }); show(c, .2, .4);
    lbl(p, 'CFC', 200, 540, .4, { size: 26, fill: OZ.ods, anchor: 'middle' });

    hide(c.bonds[0], m('hit', .2), .15); hide(c.cl[0], m('hit', .2), .05);

    tw(o3, { o: 0 }, m('left'), .05); tw(pr, { o: 1 }, m('left'), .05); hide(o3L, m('left'), .2);

    lbl(p, 'Cl + O₃  →  ClO + O₂', 800, 700, m('left', .6), { size: 32, fill: OZ.ink, anchor: 'middle', weight: 600 });

    const cl2 = atom(p, 'Cl', 940, 560, { o: 0, eyes: true });
    const tFree = m('free', 1.1);
    tw(clo, { o: 0 }, tFree, .05); tw(loose, { o: 0 }, tFree, .05); tw(pr2, { o: 1 }, tFree, .05); tw(cl2, { o: 1 }, tFree, .05);
    tw(pr2, { x: 1240, y: 600 }, tFree + .2, 1.2, io); hide(cloL, m('free', -.2), .3);
    tw(cl2, { x: 860, y: 590 }, tFree + .2, 1, io);
    lbl(p, 'ClO + O  →  Cl + O₂', 800, 750, tFree + .3, { size: 32, fill: OZ.ink, anchor: 'middle', weight: 600 });
    // ready again: a loop arrow back to the start
    const loop = path(p, 'M830 600C720 650 590 620 560 520C548 470 556 430 570 400', { fill: 'none', stroke: OZ.ods, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-dasharray': '2 14' }, { d: 0 });
    const next = O3(p, 600, 330, { o: 0, eyes: true }); show(next, m('again', -.4), .5);

    pulse(cl2, m('again', .2), 1.25);
    tw(cl2, { x: 600, y: 430 }, m('again', 1.3), 1.4, io);   // off to the next ozone molecule

    const num = T(cnt, '1', { y: 52, size: 60, fill: OZ.ods, anchor: 'middle', weight: 800 });
    show(cnt, m('count'), .4);
    prog(q => { num.textContent = (q < 1 ? '' : 'up to ') + Math.round(1 + (q * q) * 99999).toLocaleString('en-US').replace(/,/g, ' '); }, m('count', .2), 3, lin);
  }],
