<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memahami dan Menghitung PDRI · Versi 3 · Slide Materi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2A5C;--navy-deep:#071E45;--navy2:#0E3A78;--blue:#0055A5;--sky:#3A9BE1;
  --gold:#F5B324;--gold-dark:#C8901A;--gold-light:#FFE29A;--paper:#FBFAF6;--line:#D6DEEA;
  --red:#D83C3C;--green:#22A55A;--bg:#EEF3FA;--side:320px;
  --ease:cubic-bezier(.2,.8,.2,1);--pop:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--navy);background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{display:block}
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100dvh;transition:grid-template-columns .45s var(--ease)}
.app.collapsed{grid-template-columns:0 minmax(0,1fr)}

/* ---------- sidebar ---------- */
.side{background:#fff;border-right:2px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;z-index:30}
.side-in{width:var(--side);display:flex;flex-direction:column;height:100%}
.side-head{padding:18px 18px 12px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;position:relative;overflow:hidden}
.side-head:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;background:var(--gold);opacity:.9;transform:rotate(45deg);border-radius:18px}
.side-head small{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.side-head h2{font-size:16px;line-height:1.3;margin-top:4px;max-width:230px;position:relative;z-index:1}
.search{margin:12px 14px 6px;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border-radius:12px;border:2px solid var(--line);font:500 13px 'Poppins',sans-serif;color:var(--navy);background:var(--paper);outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--sky)}
.search svg{position:absolute;left:11px;top:11px;width:18px;height:18px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round}
.outline{flex:1;overflow-y:auto;padding:6px 10px 12px;scrollbar-width:thin}
.grp{margin:2px 0}
.grp>button{width:100%;display:flex;align-items:center;gap:8px;text-align:left;padding:9px 10px;border-radius:12px;font-weight:700;font-size:13px;line-height:1.25;transition:background .2s}
.grp>button:hover{background:var(--bg)}
.grp>button .ch{margin-left:auto;transition:transform .3s var(--ease);flex:none}
.grp.open>button .ch{transform:rotate(90deg)}
.grp .dot{width:10px;height:10px;border-radius:3px;background:var(--gold);flex:none;box-shadow:0 2px 0 var(--gold-dark)}
.grp.lvl .dot{background:var(--blue);box-shadow:0 2px 0 #003A73}
.items{display:none;padding:2px 0 6px 14px;border-left:2px solid var(--line);margin-left:15px}
.grp.open .items{display:block;animation:fadeIn .3s var(--ease)}
.it{display:flex;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:10px;font-size:12.5px;line-height:1.35;font-weight:500;color:#33507e;transition:background .2s,color .2s}
.it:hover{background:var(--bg)}
.it .no{flex:none;min-width:22px;font-weight:700;color:var(--blue)}
.it.on{background:var(--navy);color:#fff}
.it.on .no{color:var(--gold)}
.it .ty{margin-left:auto;flex:none;font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:6px;height:fit-content;background:var(--gold-light);color:var(--navy)}
.it.on .ty{background:var(--gold)}
.side-foot{padding:12px 14px 14px;border-top:2px solid var(--line);display:grid;gap:8px;background:var(--paper)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:14px;font-weight:600;font-size:13px;transition:transform .2s var(--pop),box-shadow .2s,background .2s}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.gold{background:var(--gold);color:var(--navy);box-shadow:0 5px 0 var(--gold-dark)}
.btn.gold:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--gold-dark)}
.btn.gold:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-dark)}
.btn.ghost{background:#fff;border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--sky);transform:translateY(-1px)}
.btn.navy{background:var(--navy);color:#fff;box-shadow:0 5px 0 var(--navy-deep)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- main ---------- */
.main{position:relative;display:flex;flex-direction:column;min-width:0;height:100dvh;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;flex:none;z-index:5}
.ib{width:42px;height:42px;border-radius:14px;background:#fff;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .2s var(--pop),border-color .2s}
.ib:hover{border-color:var(--sky);transform:translateY(-1px)}
.ib svg{width:20px;height:20px;stroke:var(--navy);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.crumb{min-width:0;flex:1}
.crumb small{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.crumb b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;padding:8px 14px;border-radius:99px;background:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(10,42,92,.25);border:2px solid rgba(245,179,36,.6)}
.pill i{font-style:normal;color:var(--gold)}
.stage{position:relative;flex:1;min-height:0;margin:0 14px;border-radius:28px;overflow:hidden;background:var(--paper);border:2px solid var(--line);box-shadow:0 18px 44px rgba(10,42,92,.12);
  background-image:linear-gradient(rgba(0,85,165,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(0,85,165,.06) 2px,transparent 2px);background-size:48px 48px}
.stage:before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 90px rgba(10,42,92,.08);pointer-events:none;z-index:2}
.slide{position:absolute;inset:0;overflow:hidden}
.slide.out{animation:outL .38s var(--ease) forwards;pointer-events:none}
.slide.out.rev{animation-name:outR}
@keyframes outL{to{opacity:0;transform:translateX(-5%) scale(.985)}}
@keyframes outR{to{opacity:0;transform:translateX(5%) scale(.985)}}
.wipe{position:absolute;inset:0;z-index:10;pointer-events:none;overflow:hidden}
.wipe i{position:absolute;top:-10%;bottom:-10%;width:70%;left:-150%;transform:skewX(-18deg)}
.wipe .w1{background:var(--gold)}.wipe .w2{background:var(--navy)}
.wipe.go .w1{animation:wipe 1.3s cubic-bezier(.65,0,.35,1)}
.wipe.go .w2{animation:wipe 1.3s cubic-bezier(.65,0,.35,1) .14s}
.wipe.go.rev .w1,.wipe.go.rev .w2{animation-name:wipeR}
@keyframes wipe{from{left:-150%}to{left:150%}}
@keyframes wipeR{from{left:150%}to{left:-150%}}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px 14px;flex:none}
.prog{flex:1;height:10px;border-radius:99px;background:#dbe5f3;position:relative;overflow:hidden;cursor:pointer}
.prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--blue),var(--sky) 60%,var(--gold));border-radius:99px;transition:width .6s var(--ease)}
.count{font-weight:700;font-size:13px;min-width:70px;text-align:center}
.count span{color:var(--blue)}
.nav{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;flex:none;transition:transform .2s var(--pop),box-shadow .2s,opacity .2s}
.nav svg{width:22px;height:22px;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav.prev{background:#fff;border:2px solid var(--line)}.nav.prev svg{stroke:var(--navy)}
.nav.next{background:var(--gold);box-shadow:0 5px 0 var(--gold-dark)}.nav.next svg{stroke:var(--navy)}
.nav:hover{transform:translateY(-2px)}.nav.next:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-dark)}
.nav[disabled]{opacity:.35;pointer-events:none}

/* ---------- notes ---------- */
.notes{position:absolute;left:14px;right:14px;bottom:0;z-index:20;background:var(--navy);color:#fff;border-radius:22px 22px 0 0;padding:16px 22px 22px;transform:translateY(105%);transition:transform .45s var(--ease);box-shadow:0 -12px 40px rgba(10,42,92,.35);max-height:46%;overflow:auto}
.notes.on{transform:none}
.notes small{color:var(--gold);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px}
.notes p{margin-top:6px;font-size:14.5px;line-height:1.6}
.notes .x{position:absolute;right:12px;top:10px;width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.notes .x svg{width:16px;height:16px;stroke:#fff;stroke-width:2.5;fill:none}

/* ---------- slide parts ---------- */

.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;box-shadow:0 3px 0 var(--gold-dark)}
.tag.blue{background:var(--blue);color:#fff;box-shadow:0 3px 0 #003A73}
h1.t{font-size:clamp(22px,3.1vw,42px);line-height:1.22;font-weight:700;margin-top:14px;max-width:1100px;letter-spacing:-.01em}
mark{background:linear-gradient(transparent 52%,rgba(245,179,36,.62) 52% 92%,transparent 92%);background-size:0 100%;background-repeat:no-repeat;color:inherit;padding:0 2px;animation:hl 1.2s var(--ease) forwards;animation-delay:calc(var(--base,0s) + 1s)}
@keyframes hl{to{background-size:100% 100%}}
.body{display:grid;gap:clamp(14px,2vw,26px);margin-top:clamp(18px,2.6vw,34px);grid-template-columns:minmax(0,1fr)}
.body.has-aside{grid-template-columns:minmax(0,1fr) minmax(220px,300px)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:clamp(12px,1.6vw,20px)}
.card{display:flex;gap:14px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:0 10px 26px rgba(10,42,92,.10);transition:transform .3s var(--pop),border-color .2s,box-shadow .3s}
.card:hover{border-color:var(--sky);box-shadow:0 18px 34px rgba(10,42,92,.16)}
.card b{display:block;font-size:15px;line-height:1.3;margin-bottom:3px}
.card p{font-size:clamp(13px,1.15vw,15.5px);line-height:1.55;color:#27406d}
.card .tile{width:clamp(56px,5vw,74px);height:clamp(56px,5vw,74px);flex:none}
.tile{filter:drop-shadow(0 4px 6px rgba(10,42,92,.15));animation:pop 1.1s var(--pop) backwards;animation-delay:calc(var(--base,0s) + var(--d,0) * 140ms + .2s)}
@keyframes pop{from{opacity:0;transform:scale(.5) rotate(-8deg)}}
.stat{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;border-radius:24px;padding:22px;position:relative;overflow:hidden;align-self:start;box-shadow:0 16px 36px rgba(10,42,92,.3)}
.stat:after{content:"";position:absolute;right:-26px;bottom:-26px;width:96px;height:96px;border-radius:22px;background:var(--gold);transform:rotate(30deg);opacity:.95}
.stat small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sky);font-weight:700}
.stat .n{font-size:clamp(28px,3.4vw,44px);font-weight:700;color:var(--gold);line-height:1.1;margin:8px 0 6px;word-break:break-word}
.stat p{font-size:13px;color:#cfe0f5;position:relative;z-index:1;max-width:80%}
.src{margin-top:22px;font-size:12px;color:#5b7197;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.src b{color:var(--navy)}
.vis{margin-top:14px;font-size:12px;color:#6b7fa3;font-style:italic}

/* jenis: peralihan */
.per{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px;align-items:center;min-height:100%}
.per .big{font-size:clamp(90px,16vw,220px);line-height:.9;font-weight:700;color:var(--navy);letter-spacing:-.04em;position:relative;display:inline-block}
.per .big:after{content:"";position:absolute;left:0;right:0;bottom:6%;height:16%;background:var(--gold);z-index:-1;border-radius:6px;transform-origin:left;animation:grow .8s var(--ease) .6s both}
@keyframes grow{from{transform:scaleX(0)}}
.per h1{font-size:clamp(24px,min(4vw,7vh),56px);line-height:1.12;font-weight:700;margin:10px 0 18px}
.chips{display:grid;gap:10px}
.chip{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-size:clamp(13px,1.2vw,16px);line-height:1.45;box-shadow:0 8px 20px rgba(10,42,92,.08)}
.chip i{flex:none;width:28px;height:28px;border-radius:9px;background:var(--navy);color:var(--gold);font:700 13px 'Poppins';display:grid;place-items:center;font-style:normal}
.per .art{position:relative;display:grid;place-items:center}
.art svg.iso{width:100%;max-width:520px;height:auto;overflow:visible}
.disc{position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#dcebfa 60%,#c3dcf5);border:10px solid #fff;box-shadow:0 20px 50px rgba(10,42,92,.2)}
.ring{position:absolute;width:92%;aspect-ratio:1;border-radius:50%;border:4px solid var(--sky);opacity:.55}
.arc{position:absolute;width:98%;aspect-ratio:1;border-radius:50%;border:8px solid transparent;border-top-color:var(--gold);border-left-color:var(--gold);transform:rotate(-20deg);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(340deg)}}
.art .tile{position:absolute;right:4%;bottom:2%;width:clamp(84px,11vw,140px);height:clamp(84px,11vw,140px);z-index:2}
.fl{animation:flt 8s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-6px)}}

/* interaksi */
.int{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:24px;align-items:start}
.int .panel{background:linear-gradient(160deg,#fff,#e8f2fd);border:2px solid var(--line);border-radius:24px;padding:20px;text-align:center;box-shadow:0 12px 30px rgba(10,42,92,.1)}
.int .panel .tile{width:120px;height:120px;margin:0 auto}
.steps{display:grid;gap:12px;counter-reset:s}
.step{display:flex;gap:14px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-left:8px solid var(--gold);border-radius:18px;padding:14px 18px;font-size:clamp(14px,1.3vw,17px);line-height:1.5;box-shadow:0 8px 20px rgba(10,42,92,.08);transition:transform .25s var(--pop)}

.step:before{counter-increment:s;content:counter(s);flex:none;width:30px;height:30px;border-radius:10px;background:var(--navy);color:var(--gold);font-weight:700;display:grid;place-items:center;font-size:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.timer{font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;color:var(--navy);margin-top:12px}
.timer.warn{color:var(--red)}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.vote button{border-radius:20px;padding:18px;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;transition:transform .2s var(--pop)}
.vote button:active{transform:scale(.96)}
.vote .y{background:var(--green);box-shadow:0 6px 0 #167a41}.vote .n{background:var(--red);box-shadow:0 6px 0 #a02a2a}
.vote small{display:block;font-weight:500;font-size:12px;opacity:.9}
.reveal{margin-top:16px;background:var(--navy);color:#fff;border-radius:18px;padding:16px 20px;line-height:1.6;font-size:14.5px;display:none}
.reveal.on{display:block;animation:rv .5s var(--ease) both}
.reveal b{color:var(--gold)}

/* rangkuman */
.ran{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:22px;align-items:start}
.check{display:grid;gap:12px}
.ck{display:flex;gap:14px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 18px;font-size:clamp(14px,1.3vw,17px);line-height:1.5;box-shadow:0 8px 20px rgba(10,42,92,.08)}
.ck .tile{width:52px;height:52px;flex:none}
.ans{background:linear-gradient(160deg,var(--navy),var(--navy2));border-radius:24px;padding:22px;color:#fff;box-shadow:0 16px 36px rgba(10,42,92,.3);display:grid;gap:12px}
.ans small{color:var(--gold);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px}
.ans div{font-size:15px;line-height:1.55}
.ans mark{background-image:linear-gradient(transparent 52%,rgba(245,179,36,.55) 52% 92%,transparent 92%);color:#fff}

/* sampul & penutup */
.cover{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center;min-height:100%}
.cover h1{font-size:clamp(28px,min(5vw,9vh),72px);line-height:1.08;font-weight:700;letter-spacing:-.02em;margin:16px 0}
.cover p.sub{font-size:clamp(14px,1.6vw,21px);line-height:1.5;color:#27406d;max-width:560px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.meta span{padding:9px 16px;border-radius:99px;border:2px dashed var(--sky);font-size:13px;font-weight:600;color:var(--blue)}
.hint{margin-top:26px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--blue)}
.hint kbd{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:8px;padding:2px 9px;font:600 12px 'Poppins'}
.pulse{animation:pls 1.8s ease-in-out infinite}
@keyframes pls{50%{transform:translateX(7px)}}
.end{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);min-height:100%;gap:0;border-radius:20px;overflow:hidden}
.end .l{background:radial-gradient(ellipse at 70% 30%,#12468C,#0A2A5C 55%,#071E45);display:grid;place-items:center;position:relative;overflow:hidden;padding:30px;min-height:260px}
.end .l:before,.end .l:after{content:"";position:absolute;width:180%;height:46px;transform:rotate(-18deg);left:-40%}
.end .l:before{background:var(--gold);bottom:14%}.end .l:after{background:var(--sky);bottom:5%;opacity:.8}
.medal{position:relative;width:min(70%,260px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE29A,#F5B324 55%,#C8901A);display:grid;place-items:center;box-shadow:0 20px 50px rgba(0,0,0,.4),0 0 0 14px rgba(245,179,36,.25);animation:flt 4s ease-in-out infinite;z-index:1}
.medal:before{content:"";position:absolute;inset:12%;border-radius:50%;border:5px dashed rgba(10,42,92,.55);animation:spin 20s linear infinite}
.medal svg{width:50%;height:50%;stroke:var(--navy);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.end .r{background:var(--paper);padding:clamp(22px,3vw,48px);display:flex;flex-direction:column;justify-content:center}
.end h1{font-size:clamp(28px,4.4vw,60px);line-height:1.1;font-weight:700;margin:12px 0}
.end p{font-size:clamp(14px,1.3vw,17px);line-height:1.6;color:#27406d}
.refl{margin-top:16px;display:grid;gap:8px}
.refl .chip{font-size:14px}

/* agenda */
.agenda{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px;margin-top:22px}
.ag{text-align:left;background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:8px;grid-template-columns:auto 1fr;align-items:center;box-shadow:0 10px 26px rgba(10,42,92,.1);transition:transform .3s var(--pop),border-color .2s,box-shadow .3s}
.ag:hover{border-color:var(--gold);box-shadow:0 20px 36px rgba(10,42,92,.18)}
.ag .tile{width:64px;height:64px}
.ag b{font-size:15px;line-height:1.3;display:block}
.ag small{font-size:12px;color:var(--blue);font-weight:600}
.ag .no{grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6b7fa3;display:flex;justify-content:space-between}
.agdiv{grid-column:1/-1;display:flex;align-items:center;gap:12px;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.agdiv:after{content:"";height:3px;flex:1;background:linear-gradient(90deg,var(--gold),transparent);border-radius:3px}

/* ringkasan akhir */
.sum{display:grid;gap:18px;margin-top:20px}
.chain{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}

const SCENE_KEYS=Object.keys(SCENES);
function sceneFor(s){
  const t=(s.title+' '+s.isi);
  if(/kapal|peti kemas|pelabuhan|angkutan/i.test(t))return 'port';
  if(/pajak|dokumen|pib|faktur|tabel/i.test(t))return 'docs';
  if(/rp|koin|pungut|bayar|tagihan/i.test(t))return 'coins';
  if(/tarif|tangga|langkah/i.test(t))return 'steps';
  if(/dasar|undang|gedung|djbc|djp/i.test(t))return 'tower';
  return SCENE_KEYS[(s.n||0)%SCENE_KEYS.length];
}

/* ================= helper teks ================= */
const esc=t=>String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const NUM=/(Rp\s?[\d.,]+(?: (?:miliar|juta|ribu))?|USD\s?[\d.,]+|\d+(?:,\d+)?%|\d+ JP|\d+ (?:menit|detik))/g;
const hl=t=>esc(t).replace(NUM,'<mark>$1</mark>');
function chunks(t){
  if(!t)return[];
  let p=t.split(/;\s+|\.\s+(?=[A-Z0-9"“(])/).map(x=>x.trim().replace(/\.$/,'')).filter(Boolean);
  if(p.length>8)p=[...p.slice(0,7),p.slice(7).join('; ')];
  return p;
}
function split(ch){const m=ch.match(/^([^:]{3,44}):\s+(.+)$/);return m?{l:m[1],t:m[2]}:{l:'',t:ch}}
function keyStat(title){const m=title.match(/Rp\s?[\d.,]+(?: (?:miliar|juta|ribu))?|\d+(?:,\d+)?%|USD\s?[\d.,]+/);return m?m[0]:null}
const TYPE={JUD:'Pembuka',PER:'Peralihan',MAT:'Materi',INT:'Interaksi',KAS:'Studi kasus',RAN:'Rangkuman',PEN:'Penutup',AGE:'Agenda',SUM:'Ringkasan',SCN:'Adegan'};
const secLabel=g=>g.label;

/* ================= model ================= */
function buildFlat(){
  flat=[];groupsUI=[];
  const gs=deckData.groups;
  gs.forEach((g,gi)=>{
    const per=g.slides.find(s=>s.type==='PER');
    const lbl=g.name+(per&&!/^Pembukaan|Penutup$/.test(g.name)?' · '+per.title:'');
    const ui={label:lbl,short:g.name,items:[],lvl:/^Bagian/.test(g.name)};
    groupsUI.push(ui);
    g.slides.forEach(s=>{
      const o=Object.assign({},s,{grp:gi,sec:g.name,secLabel:lbl,ref:s});
      flat.push(o);ui.items.push(o);
      if(g.name==='Pembukaan'&&s.type==='JUD'){
        const a={n:'A',type:'AGE',title:'Agenda: tiga bab pertama, materi dalam slide beranimasi',isi:'',sumber:'',catatan:'Jelaskan alur: tiga bab, tiap bab berisi slide materi beranimasi. Klik kartu untuk melompat.',grp:gi,sec:g.name,secLabel:lbl,synthetic:1};
        flat.push(a);ui.items.push(a);
      }
    });
    if(g.name==='Penutup'){
      const last=ui.items.pop(),lf=flat.pop();
      const sm={n:'R',type:'SUM',title:'Rangkuman Bab 1–3: satu angka dasar, satu dasar hukum, satu alur pemungutan',isi:'',sumber:'Modul PDRI Bab 1–3; KMK 55/MK/EF.2/2026 (kurs 18 sampai 24 November 2026); PMK 98 Tahun 2025; PMK 51 Tahun 2025',catatan:'Tutup tiga bab pertama. Tarif BM 10% masih asumsi latihan (cek BTKI). Berikutnya Bab 4: PPN Impor.',grp:gi,sec:g.name,secLabel:lbl,synthetic:1};
      flat.push(sm,lf);ui.items.push(sm,last);
    }
  });
}

/* ================= render slide ================= */
function rvs(i){return `class="rv" style="--d:${i}"`}
function render(s,ix){
  switch(s.type){
    case 'JUD':return rCover(s);
    case 'AGE':return rAgenda(s);
    case 'SCN':return rScn(s);
    case 'PER':return rPer(s);
    case 'INT':return rInt(s);
    case 'RAN':return rRan(s);
    case 'SUM':return rSum(s);
    case 'PEN':return rEnd(s);
    default:return rMat(s,ix);
  }
}

function rAgenda(s){
  let html='',idx=0;
  groupsUI.forEach((g,gi)=>{
    if(/^Bagian/.test(g.short)){html+=`<div class="agdiv rv" style="--d:${idx++}">${esc(g.short)} · ${esc(g.label.split(' · ')[1]||'')}</div>`;return}

function rPer(s){
  const m=s.isi.match(/Nomor KB (\d+)/);
  let big=m?m[1]:(/Bagian II/.test(s.sec)?'II':/Bagian I/.test(s.sec)?'I':'•');
  const items=chunks(s.isi).filter(x=>!/^Nomor KB|^Label Bagian|^Judul|^Nomor/.test(x));
  const chips=items.map((x,i)=>`<div class="chip rv" data-fx="l" style="--d:${i+3}"><i>${i+1}</i><span>${hl(x)}</span></div>`).join('');
  const sc=sceneFor(s);
  return `<div class="per"><div><span class="tag blue rv">${esc(s.sec==='Pembukaan'?'Peralihan':s.sec)}</span><div class="big rv" style="--d:1">${esc(big)}</div><h1 class="rv" style="--d:2">${esc(s.title)}</h1><div class="chips">${chips}</div></div>
  <div class="art rv" style="--d:2"><div class="ring"></div><div class="disc"></div><div style="position:relative;width:80%">${iso(SCENES[sc],520,400,32)}</div>${tile(pickGlyph(s.title+' '+s.visual,s.n),'gold')}</div></div>`;

function rMat(s,ix){
  const items=chunks(s.isi);
  const st=(s.type==='KAS'||s.type==='MAT')?keyStat(s.title):null;
  const cards=items.map((x,i)=>{const p=split(x);return `<div class="card rv" data-fx="z" style="--d:${i+2}">${tile(pickGlyph(x,i+ix),VNAMES[i%3])}<div>${p.l?`<b>${esc(p.l)}</b>`:''}<p>${hl(p.t)}</p></div></div>`}).join('');
  const titleH=hl(s.title);
  const aside=st?`<aside class="stat rv" data-fx="r" style="--d:${items.length+2}"><small>Angka kunci</small><div class="n">${esc(st)}</div><p>${esc(s.type==='KAS'?'Dari studi kasus slide ini':'Pesan utama slide ini')}</p></aside>`:'';
  return `<span class="tag ${s.type==='KAS'?'blue':''} rv">${TYPE[s.type]}</span><h1 class="t rv" style="--d:1">${titleH}</h1>
  <div class="body ${st?'has-aside':''}"><div class="cards">${cards||'<div class="card"><p>Tidak ada isi tambahan.</p></div>'}</div>${aside}</div>
  ${s.visual?`<p class="vis rv" style="--d:${items.length+3}">Visual: ${esc(s.visual)}</p>`:''}
  ${s.sumber?`<p class="src rv" style="--d:${items.length+4}"><b>Sumber</b> ${esc(s.sumber)}</p>`:''}`;

function rInt(s){

  const mm=(s.isi+' '+s.title).match(/(\d+)\s*(menit|detik)/i);

  <div class="timer" data-tdisp style="display:none"></div>
  <div class="reveal" data-rv><b>Catatan fasilitator:</b> ${esc(s.catatan)}</div></div>
  <div class="panel rv" data-fx="r" style="--d:2">${tile(pickGlyph(s.title+' '+s.visual,s.n),'gold')}<div style="margin-top:12px;font-size:12.5px;opacity:.8;line-height:1.5">${esc(s.visual||'Kegiatan interaktif')}</div></div></div></div>`;
}
function rRan(s){
  const items=chunks(s.isi);
  const ans=items.filter(x=>/^Jawaban|^Stempel|lencana|^QR/i.test(x));
  const pts=items.filter(x=>!ans.includes(x));
  const ck=pts.map((x,i)=>`<div class="ck rv" data-fx="l" style="--d:${i+2}">${tile('check','blue')}<span>${hl(x)}</span></div>`).join('');

  return `<span class="tag rv">${TYPE.RAN}</span><h1 class="t rv" style="--d:1">${hl(s.title)}</h1><div class="body"><div class="ran"><div class="check">${ck}</div>${an}</div></div>`;

/* ================= interaksi di dalam slide ================= */
function wire(root,s){
  root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  const fr=root.querySelector('.scnf iframe');
  if(fr){
    const box=root.querySelector('.scnf'),wrap=root.querySelector('.scnw'),ld=root.querySelector('.ld');
    const mq=matchMedia('(max-width:700px) and (orientation:portrait)');
    const fit=()=>{
      const cw=wrap.clientWidth,ch=wrap.clientHeight;if(!cw||!ch)return;
      const rot=false,L=cw,T=ch;
      const w=Math.min(L,T*16/9),h=w*9/16;
      box.style.inset='auto';box.style.margin='0';
      box.style.width=w+'px';box.style.height=h+'px';
      box.style.left=((cw-w)/2)+'px';box.style.top=((ch-h)/2)+'px';
      box.classList.toggle('rot',rot);
      box.style.transform=rot?'rotate(90deg)':'';
      if(rot)box.style.animation='none';
    };
    fit();new ResizeObserver(fit).observe(wrap);
    if(mq.addEventListener)mq.addEventListener('change',fit);
    fr.addEventListener('load',()=>{ld.classList.add('off');try{fr.focus()}catch(e){}});
    const mb=root.querySelector('[data-mode]'),rp=root.querySelector('[data-replay]');
    const send=()=>{try{fr.contentWindow.postMessage({pm:'start',mode:MODE},'*')}catch(e){}};
    mb.onclick=()=>{MODE=MODE==='instant'?'build':'instant';localStorage.setItem('pdri-mode',MODE);mb.lastElementChild.textContent=MODE==='instant'?'Langsung':'Bangun';toast(MODE==='instant'?'Semua elemen langsung tampil':'Elemen muncul bertahap (cepat)');send()};
    rp.onclick=send;
    const an=root.querySelector('[data-an]');
    an.onclick=()=>{AUTONEXT=!AUTONEXT;localStorage.setItem('pdri-an',AUTONEXT?'on':'off');an.setAttribute('aria-pressed',AUTONEXT);toast('Auto-lanjut '+(AUTONEXT?'hidup':'mati'))};
  }

  const rv=root.querySelector('[data-rv]');
  const rb=root.querySelector('[data-reveal]');
  if(rb&&rv)rb.onclick=()=>{rv.classList.toggle('on');rb.lastChild.textContent=rv.classList.contains('on')?'Sembunyikan':'Tampilkan kunci / catatan'};
  const tb=root.querySelector('[data-timer]'),td=root.querySelector('[data-tdisp]');
  if(tb){let iv=null,left=+tb.dataset.timer;const show=()=>{const m=Math.floor(left/60),r=left%60;td.textContent=`${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;td.classList.toggle('warn',left<=10)};

function aurora(bg){

  const ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),ps=[];let W=0,H=0;
  const size=()=>{W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!ps.length&&W)for(let k=0;k<(innerWidth<700?24:44);k++)ps.push({x:rnd(0,W),y:rnd(0,H),r:rnd(1,2.8),v:rnd(.08,.28),c:Math.random()<.5?'245,179,36':'255,255,255',a:rnd(.2,.65),ph:rnd(0,6)})};
  new ResizeObserver(size).observe(cv);size();
  (function f(){if(!cv.isConnected)return;ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.y-=p.v;p.ph+=.006;p.x+=Math.sin(p.ph)*.18;if(p.y<-6){p.y=H+6;p.x=rnd(0,W)}ctx.fillStyle=`rgba(${p.c},${p.a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()});

function countUp(el,delay){

  if(!isFinite(val))return;
  const pre=txt.slice(0,m.index),post=txt.slice(m.index+raw.length),pad=/^0\d/.test(raw)?raw.length:0;
  const fmt=v=>pad?String(Math.round(v)).padStart(pad,'0'):v.toLocaleString('id-ID',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  const t0=performance.now()+delay;el.textContent=pre+fmt(0)+post;
  (function f(t){const p=Math.max(0,Math.min(1,(t-t0)/2000)),e=1-Math.pow(1-p,3);el.textContent=pre+fmt(val*e)+post;if(p<1&&el.isConnected)requestAnimationFrame(f)})(performance.now());
}

  else if(k==='b'||k==='B'||k==='.')toggleBlack();
  else if(k==='F5')m.shift?startShow({from:cur}):startShow({from:0});
  else if(k==='Home')go(0);else if(k==='End')go(flat.length-1);
}
function wake(){
  htmlEl.classList.add('awake');htmlEl.classList.remove('idle');clearTimeout(idleT);
  idleT=setTimeout(()=>{htmlEl.classList.remove('awake');htmlEl.classList.add('idle')},2600);
}
addEventListener('mousemove',()=>{if(showOn)wake()});
addEventListener('touchstart',()=>{if(showOn)wake()},{passive:true});
async function startShow(o){
  o=o||{};
  closeMenu();
  if(o.presenter){
    try{pw=window.open(location.href.split('#')[0]+'#presenter','pdri-presenter','popup=yes,width=1180,height=760')}catch(e){pw=null}
    if(!pw)toast('Jendela presenter diblokir. Izinkan pop-up untuk halaman ini.');
  }
  showOn=true;showStart=Date.now();htmlEl.classList.add('present');app.classList.add('collapsed');app.classList.remove('drawer');
  if(o.from!=null)go(o.from);
  wake();
  let screenOpt;
  if(o.presenter&&window.getScreenDetails){
    try{
      const d=await getScreenDetails();
      const ext=d.screens.find(s=>s!==d.currentScreen);
      if(ext){screenOpt={screen:ext};try{pw&&pw.moveTo(d.currentScreen.availLeft+40,d.currentScreen.availTop+40)}catch(e){}}
    }catch(e){}
  }
  try{await htmlEl.requestFullscreen(screenOpt)}catch(e){try{await htmlEl.requestFullscreen()}catch(e2){toast('Tekan F11 untuk layar penuh. Jendela ini sudah dalam mode presentasi.')}}
  pvPost();
}
function endShow(){
  if(!showOn)return;
  showOn=false;htmlEl.classList.remove('present','awake','idle');toggleBlack(false);
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  pvPost();
}
document.addEventListener('fullscreenchange',()=>{if(showOn&&!document.fullscreenElement)endShow()});
/* menu Proyeksikan */
function closeMenu(){$('#pmenu').classList.remove('on')}
$('#btnProject').onclick=e=>{e.stopPropagation();$('#pmenu').classList.toggle('on')};
document.addEventListener('click',e=>{if(!e.target.closest('#pmenu,#btnProject'))closeMenu()});
$('#pmGo').onclick=()=>{
  const from=document.querySelector('input[name=pmFrom]:checked').value==='cur'?cur:0;
  startShow({from,presenter:$('#pmPv').checked});
};
$('#pPrev').onclick=()=>go(cur-1);$('#pNext').onclick=()=>go(cur+1);
$('#pBlack').onclick=()=>toggleBlack();$('#pExit').onclick=endShow;
$('#blk').onclick=()=>toggleBlack(false);
$('#pctl').addEventListener('pointermove',e=>e.stopPropagation());
/* klik di tepi kiri/kanan panggung untuk pindah slide saat presentasi (di atas iframe) */
$('#zL').onclick=()=>go(cur-1);$('#zR').onclick=()=>go(cur+1);

/* ---- tampilan presenter (jendela terpisah) ---- */
function initPresenter(){
  htmlEl.classList.add('pv');
  document.title='Tampilan presenter · PDRI';
  const root=document.createElement('div');root.id='pv';
  root.innerHTML=`<header><b>Tampilan presenter</b><span class="grow"></span><span id="pvClock"></span><span class="pvt" id="pvTimer">00:00</span><button class="btn ghost sm" id="pvReset">Reset timer</button></header>
  <main><section class="pvcur"><small id="pvTag">Menunggu jendela presentasi…</small><h1 id="pvTitle">–</h1><div class="pvnotes" id="pvNotes"></div></section>
  <aside><div class="pvnext"><small>Berikutnya</small><b id="pvNext">–</b></div>
  <div class="pvctl"><button class="btn ghost" id="pvPrev">‹ Sebelumnya</button><button class="btn gold" id="pvNextBtn">Berikutnya ›</button></div>
  <div class="pvctl"><button class="btn ghost sm" id="pvReplay">Ulangi animasi</button><button class="btn ghost sm" id="pvBlack">Layar hitam</button><button class="btn ghost sm" id="pvA1">A−</button><button class="btn ghost sm" id="pvA2">A+</button></div>
  <div class="pvcount" id="pvCount"></div><div class="pvlist" id="pvList"></div></aside></main>`;
  document.body.appendChild(root);
  const q=id=>document.getElementById(id);
  const send=(a,i)=>{try{(window.opener||pw).postMessage({pm:'pv-cmd',a,i},'*')}catch(e){}};
  q('pvPrev').onclick=()=>send('prev');q('pvNextBtn').onclick=()=>send('next');q('pvBlack').onclick=()=>send('black');q('pvReplay').onclick=()=>send('replay');
  let fs=22;const setFs=v=>{fs=Math.max(14,Math.min(48,v));q('pvNotes').style.fontSize=fs+'px'};setFs(22);
  q('pvA1').onclick=()=>setFs(fs-2);q('pvA2').onclick=()=>setFs(fs+2);
  const list=q('pvList');
  flat.forEach((s,i)=>{const b=document.createElement('button');b.dataset.i=i;b.innerHTML=`<span>${esc(String(s.n))}</span>${esc(s.title)}`;b.onclick=()=>send('goto',i);list.appendChild(b)});
  let t0=0;
  q('pvReset').onclick=()=>{t0=Date.now()};
  setInterval(()=>{const d=new Date();q('pvClock').textContent=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});if(t0){const s=Math.floor((Date.now()-t0)/1000);q('pvTimer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}},500);
  addEventListener('message',e=>{
    const m=e.data;if(!m||m.pm!=='pv-state')return;
    if(!t0)t0=m.start||Date.now();
    q('pvTag').textContent=m.tag;q('pvTitle').textContent=m.title;
    q('pvNotes').textContent=m.notes||'Tidak ada catatan untuk slide ini.';
    q('pvNext').textContent=m.next||'Akhir presentasi';
    q('pvCount').textContent='Slide '+(m.i+1)+' dari '+m.n+(m.black?'  ·  layar hitam':'');
    q('pvBlack').classList.toggle('on',!!m.black);
    list.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===m.i));
    const on=list.querySelector('.on');on&&on.scrollIntoView({block:'nearest'});
  });
  addEventListener('keydown',e=>{
    if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();send('next')}
    else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();send('prev')}
    else if(e.key==='b'||e.key==='B'||e.key==='.')send('black');
  });
  send('hello');
}

/* slide native diskalakan dari kanvas tetap bila panggung sempit, supaya selalu 16:9 seperti PowerPoint */
function fitNative(el){
  const sc=el.querySelector('.sc');if(!sc||el.classList.contains('scn'))return;
  const W=stage.clientWidth;
  if(W>=1000){sc.style.cssText='';return}
  const DW=W<700?720:960,DH=DW*9/16,k=W/DW;
  sc.style.cssText=`width:${DW}px;height:${DH}px;inset:auto;left:0;top:0;transform:scale(${k.toFixed(4)});transform-origin:0 0`;
}
new ResizeObserver(()=>slideEl.querySelectorAll('.slide').forEach(fitNative)).observe(stage);

/* ================= mulai ================= */
buildFlat();if(IS_PV){initPresenter();return}buildOutline();
if(innerWidth>900)app.classList.add('collapsed');
const start=parseInt(location.hash.slice(1));
go(start&&start>0?start-1:0);
if(!slideEl.children.length){mount(cur,'0s')}
})();
</script>
